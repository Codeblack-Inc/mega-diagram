<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 비전 검사 시장 규모 추정</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #17152b;   /* deep warm charcoal */
      --color-ink:     #f6f5fa;   /* warm off-white */
      --color-muted:   #d4d2de;
      --color-accent:  #6e9bea;
      --font-sans:     'Geist', 'Pretendard', 'Noto Sans KR', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-sans);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Market sizing · mega-diagram</p>
    <h1>AI 비전 검사 시장 규모 추정</h1>

    <svg viewBox="0 0 1000 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="tam-sam-som-dark-title tam-sam-som-dark-desc">
      <title id="tam-sam-som-dark-title">AI 비전 검사 시장 규모 추정</title>
      <desc id="tam-sam-som-dark-desc">국내 제조업 품질 검사 시장(TAM) 24,000억 원 안에서 중소 전자·자동차 부품사 비전 검사 자동화 시장(SAM) 3,600억 원, 3년 내 확보 목표 시장(SOM) 180억 원을 동심원으로 겹쳐 보이고, 오른쪽에 각 규모의 산출 근거를 적은 시장 규모도.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#d4d2de"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#6e9bea"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#9a86ec"/></marker>
      </defs>

      <!-- Rings: outer → inner so the focal SOM paints last -->
      <circle cx="288" cy="264" r="216" fill="rgba(246,245,250,0.02)" stroke="rgba(246,245,250,0.3)" stroke-width="1"/>
      <circle cx="288" cy="264" r="144" fill="rgba(246,245,250,0.04)" stroke="#d4d2de" stroke-width="1"/>
      <circle cx="288" cy="264" r="72" fill="rgba(110,155,234,0.10)" stroke="#6e9bea" stroke-width="1"/>

      <!-- In-ring labels: tag + size at the top of each exposed band -->
      <text x="288" y="76" fill="#f6f5fa" font-size="14" font-weight="600" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="middle">TAM</text>
      <text x="288" y="96" fill="#d4d2de" font-size="12" font-weight="500" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="middle">24,000억 원</text>
      <text x="288" y="148" fill="#f6f5fa" font-size="14" font-weight="600" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="middle">SAM</text>
      <text x="288" y="168" fill="#d4d2de" font-size="12" font-weight="500" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="middle">3,600억 원</text>
      <text x="288" y="260" fill="#6e9bea" font-size="14" font-weight="600" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="middle">SOM</text>
      <text x="288" y="280" fill="#d4d2de" font-size="12" font-weight="500" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="middle">180억 원</text>

      <!-- Leaders: horizontal, from a dot inside each ring's own band to its callout -->
      <circle cx="388" cy="108" r="2.5" fill="#d4d2de"/>
      <line x1="388" y1="108" x2="568" y2="108" stroke="#d4d2de" stroke-width="0.8"/>
      <circle cx="388" cy="212" r="2.5" fill="#d4d2de"/>
      <line x1="388" y1="212" x2="568" y2="212" stroke="#d4d2de" stroke-width="0.8"/>
      <circle cx="312" cy="316" r="2.5" fill="#6e9bea"/>
      <line x1="312" y1="316" x2="568" y2="316" stroke="#6e9bea" stroke-width="0.8"/>

      <!-- Callouts: name + size, 산출 근거, scope -->
      <text x="584" y="112" fill="#9d9ab0" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.08em">TAM</text>
      <text x="616" y="112" fill="#f6f5fa" font-size="14" font-weight="600" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">전체 시장</text>
      <text x="960" y="112" fill="#f6f5fa" font-size="14" font-weight="600" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="end">24,000억 원</text>
      <line x1="584" y1="124" x2="960" y2="124" stroke="rgba(246,245,250,0.12)" stroke-width="0.8"/>
      <text x="584" y="146" fill="#f6f5fa" font-size="12" font-weight="500" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">제조 사업체 6만 곳 × 연 검사비 4,000만 원</text>
      <text x="584" y="166" fill="#d4d2de" font-size="12" font-weight="400" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">국내 제조업 품질 검사 비용 전체</text>
      <text x="584" y="216" fill="#9d9ab0" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.08em">SAM</text>
      <text x="616" y="216" fill="#f6f5fa" font-size="14" font-weight="600" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">유효 시장</text>
      <text x="960" y="216" fill="#f6f5fa" font-size="14" font-weight="600" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="end">3,600억 원</text>
      <line x1="584" y1="228" x2="960" y2="228" stroke="rgba(246,245,250,0.12)" stroke-width="0.8"/>
      <text x="584" y="250" fill="#f6f5fa" font-size="12" font-weight="500" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">중소 부품사 1만 2,000곳 × 3,000만 원</text>
      <text x="584" y="270" fill="#d4d2de" font-size="12" font-weight="400" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">전자·자동차 부품, 비전 검사 대상 공정</text>
      <text x="584" y="320" fill="#6e9bea" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.08em">SOM</text>
      <text x="616" y="320" fill="#f6f5fa" font-size="14" font-weight="600" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">목표 시장</text>
      <text x="960" y="320" fill="#6e9bea" font-size="14" font-weight="600" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="end">180억 원</text>
      <line x1="584" y1="332" x2="960" y2="332" stroke="rgba(246,245,250,0.12)" stroke-width="0.8"/>
      <text x="584" y="354" fill="#f6f5fa" font-size="12" font-weight="500" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">SAM 사업장의 5%, 600곳 × 3,000만 원</text>
      <text x="584" y="374" fill="#d4d2de" font-size="12" font-weight="400" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">2029년까지 파트너 채널 확보 기준</text>

      <!-- Source line (bottom strip) -->
      <line x1="40" y1="508" x2="960" y2="508" stroke="rgba(246,245,250,0.1)" stroke-width="0.8"/>
      <text x="40" y="536" fill="#d4d2de" font-size="12" font-weight="500" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">출처</text>
      <text x="88" y="536" fill="#d4d2de" font-size="12" font-weight="400" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">통계청 광업·제조업조사(2024), 중소벤처기업부 중소기업 실태조사(2024), 자사 추정</text>
    </svg>
  </div>
</body>
</html>
