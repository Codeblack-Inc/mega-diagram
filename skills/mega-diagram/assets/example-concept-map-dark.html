<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>가온 통합 충전 플랫폼 서비스 개념도</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #17152b;
      --color-ink:     #f6f5fa;
      --color-muted:   #d4d2de;
      --color-accent:  #6e9bea;
      --font-sans:     'Geist', 'Pretendard', 'Noto Sans KR', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-sans);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Concept map · mega-diagram</p>
    <h1>가온 통합 충전 플랫폼 서비스 개념도</h1>

    <svg viewBox="0 0 1000 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="concept-map-dark-title concept-map-dark-desc">
      <title id="concept-map-dark-title">가온 통합 충전 플랫폼 서비스 개념도</title>
      <desc id="concept-map-dark-desc">가온 통합 충전 플랫폼을 중심으로 전기차 이용자는 예약·결제를 하고 빈 충전기 안내를 받으며, 가온시·환경공단은 보조금·정책을 주고 이용 통계를 받고, 충전 사업자는 충전기 상태를 보내고 정산금을 받으며, 외부 결제·지도·차량 시스템과 승인 요청과 정보를 주고받는 서비스 개념도.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#d4d2de"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#6e9bea"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#9a86ec"/></marker>
      </defs>

      <!-- Value flows first. Each actor pair gets two parallel one-way lines, 32-48px apart. -->
      <line x1="240" y1="284" x2="360" y2="284" stroke="#6e9bea" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <line x1="360" y1="316" x2="240" y2="316" stroke="#d4d2de" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="476" y1="120" x2="476" y2="216" stroke="#d4d2de" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="524" y1="216" x2="524" y2="120" stroke="#d4d2de" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <line x1="640" y1="284" x2="760" y2="284" stroke="#d4d2de" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="760" y1="316" x2="640" y2="316" stroke="#d4d2de" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <line x1="476" y1="384" x2="476" y2="480" stroke="#9a86ec" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <line x1="524" y1="480" x2="524" y2="384" stroke="#9a86ec" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow-link)"/>

      <!-- Flow labels: 16px masks, 8px clear of their stroke, on open canvas -->
      <rect x="268" y="260" width="64" height="16" rx="2" fill="#17152b"/>
      <text x="300" y="272" fill="#6e9bea" font-size="12" font-weight="500" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="middle">예약·결제</text>
      <rect x="252" y="324" width="96" height="16" rx="2" fill="#17152b"/>
      <text x="300" y="336" fill="#d4d2de" font-size="12" font-weight="500" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="middle">빈 충전기 안내</text>
      <rect x="392" y="160" width="76" height="16" rx="2" fill="#17152b"/>
      <text x="430" y="172" fill="#d4d2de" font-size="12" font-weight="500" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="middle">보조금·정책</text>
      <rect x="532" y="160" width="64" height="16" rx="2" fill="#17152b"/>
      <text x="564" y="172" fill="#d4d2de" font-size="12" font-weight="500" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="middle">이용 통계</text>
      <rect x="676" y="260" width="44" height="16" rx="2" fill="#17152b"/>
      <text x="698" y="272" fill="#d4d2de" font-size="12" font-weight="500" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="middle">정산금</text>
      <rect x="660" y="324" width="76" height="16" rx="2" fill="#17152b"/>
      <text x="698" y="336" fill="#d4d2de" font-size="12" font-weight="500" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="middle">충전기 상태</text>
      <rect x="372" y="424" width="96" height="16" rx="2" fill="#17152b"/>
      <text x="420" y="436" fill="#9a86ec" font-size="12" font-weight="500" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="middle">결제 승인 요청</text>
      <rect x="532" y="424" width="96" height="16" rx="2" fill="#17152b"/>
      <text x="580" y="436" fill="#9a86ec" font-size="12" font-weight="500" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="middle">지도·차량 정보</text>

      <!-- Actors -->
      <!-- 기관 · 가온시 · 환경공단 -->
      <rect x="380" y="40" width="240" height="80" rx="6" fill="#17152b"/>
      <rect x="380" y="40" width="240" height="80" rx="6" fill="rgba(246,245,250,0.03)" stroke="rgba(246,245,250,0.3)" stroke-width="1"/>
      <text x="396" y="62" fill="#9d9ab0" font-size="12" font-weight="500" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">기관</text>
      <text x="396" y="84" fill="#f6f5fa" font-size="14" font-weight="600" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">가온시 · 환경공단</text>
      <text x="396" y="106" fill="#d4d2de" font-size="12" font-weight="400" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">충전 인프라 정책·보조금</text>
      <!-- 국민 · 전기차 이용자 -->
      <rect x="40" y="260" width="200" height="80" rx="6" fill="#17152b"/>
      <rect x="40" y="260" width="200" height="80" rx="6" fill="rgba(212,210,222,0.10)" stroke="#9d9ab0" stroke-width="1"/>
      <text x="56" y="282" fill="#9d9ab0" font-size="12" font-weight="500" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">국민</text>
      <text x="56" y="304" fill="#f6f5fa" font-size="14" font-weight="600" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">전기차 이용자</text>
      <text x="56" y="326" fill="#d4d2de" font-size="12" font-weight="400" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">등록 전기차 42,000대</text>
      <!-- 운영사 · 충전 사업자 12개사 -->
      <rect x="760" y="260" width="200" height="80" rx="6" fill="#17152b"/>
      <rect x="760" y="260" width="200" height="80" rx="6" fill="#24223a" stroke="#f6f5fa" stroke-width="1"/>
      <text x="776" y="282" fill="#9d9ab0" font-size="12" font-weight="500" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">운영사</text>
      <text x="776" y="304" fill="#f6f5fa" font-size="14" font-weight="600" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">충전 사업자 12개사</text>
      <text x="776" y="326" fill="#d4d2de" font-size="12" font-weight="400" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">충전기 1,860기 운영</text>
      <!-- 외부 시스템 · 결제·지도·차량 연계 -->
      <rect x="380" y="480" width="240" height="80" rx="6" fill="#17152b"/>
      <rect x="380" y="480" width="240" height="80" rx="6" fill="rgba(246,245,250,0.03)" stroke="rgba(246,245,250,0.3)" stroke-width="1"/>
      <text x="396" y="502" fill="#9d9ab0" font-size="12" font-weight="500" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">외부 시스템</text>
      <text x="396" y="524" fill="#f6f5fa" font-size="14" font-weight="600" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">결제·지도·차량 연계</text>
      <text x="396" y="544" fill="#9d9ab0" font-size="9" font-family="'Geist Mono', monospace">PG · MAP · OEM API</text>

      <!-- Service platform hub (focal) -->
      <rect x="360" y="216" width="280" height="168" rx="6" fill="#17152b"/>
      <rect x="360" y="216" width="280" height="168" rx="6" fill="rgba(110,155,234,0.10)" stroke="#6e9bea" stroke-width="1.2"/>
      <text x="376" y="238" fill="#6e9bea" font-size="12" font-weight="500" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">서비스 플랫폼</text>
      <text x="376" y="262" fill="#f6f5fa" font-size="16" font-weight="600" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">가온 통합 충전 플랫폼</text>
      <line x1="376" y1="276" x2="624" y2="276" stroke="rgba(246,245,250,0.12)" stroke-width="0.8"/>
      <circle cx="380" cy="296" r="1.5" fill="#d4d2de"/>
      <text x="388" y="300" fill="#f6f5fa" font-size="12" font-weight="400" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">충전소 검색·예약</text>
      <circle cx="380" cy="316" r="1.5" fill="#d4d2de"/>
      <text x="388" y="320" fill="#f6f5fa" font-size="12" font-weight="400" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">통합 결제·정산</text>
      <circle cx="380" cy="336" r="1.5" fill="#d4d2de"/>
      <text x="388" y="340" fill="#f6f5fa" font-size="12" font-weight="400" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">충전기 원격 관제</text>
      <circle cx="380" cy="356" r="1.5" fill="#d4d2de"/>
      <text x="388" y="360" fill="#f6f5fa" font-size="12" font-weight="400" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">이용 데이터 분석</text>

      <!-- Legend -->
      <line x1="40" y1="584" x2="960" y2="584" stroke="rgba(246,245,250,0.12)" stroke-width="0.8"/>
      <text x="40" y="616" fill="#d4d2de" font-size="12" font-weight="500" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">범례</text>
      <rect x="88" y="604" width="16" height="12" rx="2" fill="rgba(110,155,234,0.10)" stroke="#6e9bea" stroke-width="1"/>
      <text x="112" y="616" fill="#d4d2de" font-size="12" font-weight="500" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">서비스 플랫폼</text>
      <rect x="216" y="604" width="16" height="12" rx="2" fill="rgba(212,210,222,0.10)" stroke="#9d9ab0" stroke-width="1"/>
      <text x="240" y="616" fill="#d4d2de" font-size="12" font-weight="500" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">이용자</text>
      <rect x="300" y="604" width="16" height="12" rx="2" fill="#24223a" stroke="#f6f5fa" stroke-width="1"/>
      <text x="324" y="616" fill="#d4d2de" font-size="12" font-weight="500" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">운영 주체</text>
      <rect x="404" y="604" width="16" height="12" rx="2" fill="rgba(246,245,250,0.03)" stroke="rgba(246,245,250,0.3)" stroke-width="1"/>
      <text x="428" y="616" fill="#d4d2de" font-size="12" font-weight="500" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">기관·외부</text>
      <line x1="508" y1="610" x2="524" y2="610" stroke="#d4d2de" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="532" y="616" fill="#d4d2de" font-size="12" font-weight="500" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">서비스·재원</text>
      <line x1="624" y1="610" x2="640" y2="610" stroke="#d4d2de" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <text x="648" y="616" fill="#d4d2de" font-size="12" font-weight="500" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">정보 환류</text>
      <line x1="728" y1="610" x2="744" y2="610" stroke="#9a86ec" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <text x="752" y="616" fill="#d4d2de" font-size="12" font-weight="500" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">시스템 연계</text>
    </svg>
  </div>
</body>
</html>
