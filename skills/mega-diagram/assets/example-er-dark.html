<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>콘텐츠 플랫폼 · ER 모델</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #17152b;
      --color-ink:     #f6f5fa;
      --color-muted:   #d4d2de;
      --color-accent:  #6e9bea;
      --font-sans:     'Geist', 'Pretendard', 'Noto Sans KR', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
    /* mega: Korean h1 is set in sans */
    h1 { font-family: var(--font-sans); font-weight: 700; letter-spacing: -0.03em; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">ER · mega-diagram</p>
    <h1>콘텐츠 플랫폼 · 데이터 모델</h1>

    <svg viewBox="0 0 1000 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="er-dark-title er-dark-desc">
      <title id="er-dark-title">콘텐츠 플랫폼 · 데이터 모델</title>
      <desc id="er-dark-desc">작성자가 게시글을 작성하고, 게시글이 조인 테이블을 거쳐 태그와 연결되는 콘텐츠 플랫폼 ER 다이어그램.</desc>
        <defs>
          <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r="0.9" fill="rgba(246,245,250,0.10)"/>
          </pattern>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#d4d2de"/></marker>
        </defs>


        <!-- Relationship lines (drawn first) -->
        <!-- 1. Author — Article (1:N "writes") -->
        <line x1="260" y1="240" x2="400" y2="240" stroke="#d4d2de" stroke-width="1" />
        <!-- 2. Article — ArticleTag (1:N) -->
        <path d="M 640,320 H 702 Q 710,320 710,328 H 780" fill="none" stroke="#d4d2de" stroke-width="1"/>
        <!-- 3. Tag — ArticleTag (1:N, vertical) -->
        <line x1="880" y1="248" x2="880" y2="280" stroke="#d4d2de" stroke-width="1" />

        <!-- Cardinality labels -->
        <rect x="266" y="232" width="12" height="12" rx="2" fill="#17152b"/>
        <text x="272" y="242" fill="#d4d2de" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="600">1</text>

        <rect x="378" y="232" width="16" height="12" rx="2" fill="#17152b"/>
        <text x="386" y="242" fill="#d4d2de" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="600">N</text>

        <rect x="646" y="316" width="12" height="12" rx="2" fill="#17152b"/>
        <text x="652" y="326" fill="#d4d2de" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="600">1</text>

        <rect x="760" y="324" width="16" height="12" rx="2" fill="#17152b"/>
        <text x="768" y="334" fill="#d4d2de" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="600">N</text>

        <rect x="872" y="252" width="16" height="12" rx="2" fill="#17152b"/>
        <text x="880" y="262" fill="#d4d2de" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="600">1</text>

        <rect x="872" y="268" width="16" height="12" rx="2" fill="#17152b"/>
        <text x="880" y="278" fill="#d4d2de" font-size="10" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="600">N</text>

        <!-- Relationship labels -->
        <rect x="316" y="218" width="32" height="16" rx="2" fill="#17152b"/>
        <text x="332" y="230" fill="#d4d2de" font-size="12" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="middle" font-weight="500">작성</text>

        <rect x="684" y="298" width="64" height="16" rx="2" fill="#17152b"/>
        <text x="716" y="310" fill="#d4d2de" font-size="12" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="middle" font-weight="500">태그 지정</text>

        <!-- Entity: Author -->
        <rect x="60" y="160" width="200" height="160" rx="6" fill="#24223a" stroke="#f6f5fa" stroke-width="1"/>
        <rect x="60" y="160" width="200" height="40" rx="6" fill="rgba(246,245,250,0.04)" stroke="none"/>
        <rect x="60" y="192" width="200" height="8" fill="rgba(246,245,250,0.04)"/>
        <line x1="60" y1="200" x2="260" y2="200" stroke="rgba(246,245,250,0.22)" stroke-width="1"/>
        <text x="76" y="176" fill="#d4d2de" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">ENTITY</text>
        <text x="76" y="192" fill="#f6f5fa" font-size="14" font-weight="600" font-family="'Geist', sans-serif">Author</text>
        <text x="244" y="192" fill="#f6f5fa" font-size="12" font-weight="600" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="end">작성자</text>
        <text x="76" y="220" fill="#f6f5fa" font-size="10" font-family="'Geist Mono', monospace"># id</text>
        <text x="220" y="220" fill="#d4d2de" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end">uuid</text>
        <text x="76" y="240" fill="#f6f5fa" font-size="10" font-family="'Geist Mono', monospace">handle</text>
        <text x="220" y="240" fill="#d4d2de" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end">text</text>
        <text x="76" y="260" fill="#f6f5fa" font-size="10" font-family="'Geist Mono', monospace">name</text>
        <text x="220" y="260" fill="#d4d2de" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end">text</text>
        <text x="76" y="280" fill="#f6f5fa" font-size="10" font-family="'Geist Mono', monospace">bio</text>
        <text x="220" y="280" fill="#d4d2de" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end">text</text>
        <text x="76" y="300" fill="#f6f5fa" font-size="10" font-family="'Geist Mono', monospace">site_url</text>
        <text x="220" y="300" fill="#d4d2de" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end">text</text>

        <!-- Entity: Article (focal coral) -->
        <rect x="400" y="120" width="240" height="240" rx="6" fill="rgba(110,155,234,0.04)" stroke="#6e9bea" stroke-width="1"/>
        <rect x="400" y="120" width="240" height="40" rx="6" fill="rgba(110,155,234,0.10)" stroke="none"/>
        <rect x="400" y="152" width="240" height="8" fill="rgba(110,155,234,0.10)"/>
        <line x1="400" y1="160" x2="640" y2="160" stroke="rgba(110,155,234,0.40)" stroke-width="1"/>
        <text x="416" y="136" fill="#6e9bea" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">ENTITY · AGGREGATE ROOT</text>
        <text x="416" y="152" fill="#f6f5fa" font-size="14" font-weight="600" font-family="'Geist', sans-serif">Article</text>
        <text x="624" y="152" fill="#f6f5fa" font-size="12" font-weight="600" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="end">게시글</text>
        <text x="416" y="180" fill="#f6f5fa" font-size="10" font-family="'Geist Mono', monospace"># id</text>
        <text x="600" y="180" fill="#d4d2de" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end">uuid</text>
        <text x="416" y="200" fill="#f6f5fa" font-size="10" font-family="'Geist Mono', monospace">title</text>
        <text x="600" y="200" fill="#d4d2de" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end">text</text>
        <text x="416" y="220" fill="#f6f5fa" font-size="10" font-family="'Geist Mono', monospace">slug</text>
        <text x="600" y="220" fill="#d4d2de" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end">text · unique</text>
        <text x="416" y="240" fill="#f6f5fa" font-size="10" font-family="'Geist Mono', monospace">body_mdx</text>
        <text x="600" y="240" fill="#d4d2de" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end">text</text>
        <text x="416" y="260" fill="#f6f5fa" font-size="10" font-family="'Geist Mono', monospace">published_at</text>
        <text x="600" y="260" fill="#d4d2de" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end">timestamp</text>
        <text x="416" y="280" fill="#f6f5fa" font-size="10" font-family="'Geist Mono', monospace">→ author_id</text>
        <text x="600" y="280" fill="#d4d2de" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end">uuid</text>
        <text x="416" y="300" fill="#f6f5fa" font-size="10" font-family="'Geist Mono', monospace">status</text>
        <text x="600" y="300" fill="#d4d2de" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end">enum</text>
        <text x="416" y="320" fill="#f6f5fa" font-size="10" font-family="'Geist Mono', monospace">og_image</text>
        <text x="600" y="320" fill="#d4d2de" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end">text · url</text>

        <!-- Entity: Tag -->
        <rect x="780" y="120" width="200" height="128" rx="6" fill="#24223a" stroke="#f6f5fa" stroke-width="1"/>
        <rect x="780" y="120" width="200" height="40" rx="6" fill="rgba(246,245,250,0.04)" stroke="none"/>
        <rect x="780" y="152" width="200" height="8" fill="rgba(246,245,250,0.04)"/>
        <line x1="780" y1="160" x2="980" y2="160" stroke="rgba(246,245,250,0.22)" stroke-width="1"/>
        <text x="796" y="136" fill="#d4d2de" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">ENTITY</text>
        <text x="796" y="152" fill="#f6f5fa" font-size="14" font-weight="600" font-family="'Geist', sans-serif">Tag</text>
        <text x="964" y="152" fill="#f6f5fa" font-size="12" font-weight="600" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="end">태그</text>
        <text x="796" y="180" fill="#f6f5fa" font-size="10" font-family="'Geist Mono', monospace"># id</text>
        <text x="940" y="180" fill="#d4d2de" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end">uuid</text>
        <text x="796" y="200" fill="#f6f5fa" font-size="10" font-family="'Geist Mono', monospace">slug</text>
        <text x="940" y="200" fill="#d4d2de" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end">text · unique</text>
        <text x="796" y="220" fill="#f6f5fa" font-size="10" font-family="'Geist Mono', monospace">name</text>
        <text x="940" y="220" fill="#d4d2de" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end">text</text>
        <text x="796" y="240" fill="#f6f5fa" font-size="10" font-family="'Geist Mono', monospace">description</text>
        <text x="940" y="240" fill="#d4d2de" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end">text</text>

        <!-- Entity: ArticleTag (join) -->
        <rect x="780" y="280" width="200" height="96" rx="6" fill="rgba(246,245,250,0.04)" stroke="#d4d2de" stroke-width="1" stroke-dasharray="4,3"/>
        <rect x="780" y="280" width="200" height="40" rx="6" fill="rgba(246,245,250,0.06)" stroke="none"/>
        <rect x="780" y="312" width="200" height="8" fill="rgba(246,245,250,0.06)"/>
        <line x1="780" y1="320" x2="980" y2="320" stroke="rgba(246,245,250,0.22)" stroke-width="1"/>
        <text x="796" y="296" fill="#d4d2de" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">JOIN</text>
        <text x="796" y="312" fill="#f6f5fa" font-size="14" font-weight="600" font-family="'Geist', sans-serif">ArticleTag</text>
        <text x="964" y="312" fill="#f6f5fa" font-size="12" font-weight="600" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="end">게시글·태그</text>
        <text x="796" y="340" fill="#f6f5fa" font-size="10" font-family="'Geist Mono', monospace">→ article_id</text>
        <text x="940" y="340" fill="#d4d2de" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end">uuid</text>
        <text x="796" y="360" fill="#f6f5fa" font-size="10" font-family="'Geist Mono', monospace">→ tag_id</text>
        <text x="940" y="360" fill="#d4d2de" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end">uuid</text>

        <!-- Legend -->
        <line x1="40" y1="404" x2="960" y2="404" stroke="rgba(246,245,250,0.10)" stroke-width="0.8"/>
        <text x="40" y="420" fill="#d4d2de" font-size="12" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" font-weight="500">범례</text>

        <rect x="40" y="436" width="14" height="10" rx="2" fill="rgba(110,155,234,0.04)" stroke="#6e9bea" stroke-width="1"/>
        <text x="60" y="444" fill="#d4d2de" font-size="12" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" font-weight="500">애그리거트 루트</text>

        <rect x="160" y="436" width="14" height="10" rx="2" fill="#24223a" stroke="#f6f5fa" stroke-width="1"/>
        <text x="180" y="444" fill="#d4d2de" font-size="12" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" font-weight="500">엔티티</text>

        <rect x="240" y="436" width="14" height="10" rx="2" fill="rgba(246,245,250,0.04)" stroke="#d4d2de" stroke-width="1" stroke-dasharray="3,2"/>
        <text x="260" y="444" fill="#d4d2de" font-size="12" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" font-weight="500">조인 테이블</text>

        <text x="352" y="444" fill="#f6f5fa" font-size="10" font-family="'Geist Mono', monospace" font-weight="600">#</text>
        <text x="368" y="444" fill="#d4d2de" font-size="12" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" font-weight="500">기본 키</text>

        <text x="436" y="444" fill="#f6f5fa" font-size="10" font-family="'Geist Mono', monospace" font-weight="600">→</text>
        <text x="452" y="444" fill="#d4d2de" font-size="12" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" font-weight="500">외래 키</text>

        <text x="520" y="444" fill="#d4d2de" font-size="10" font-family="'Geist Mono', monospace" font-weight="600">1 / N</text>
        <text x="560" y="444" fill="#d4d2de" font-size="12" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" font-weight="500">카디널리티</text>
      </svg>
  </div>
</body>
</html>
