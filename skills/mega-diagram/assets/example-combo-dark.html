<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>매출액 및 전년 대비 증가율 2021~2026</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #17152b;
      --color-ink:     #f6f5fa;
      --color-muted:   #d4d2de;
      --color-accent:  #6e9bea;
      --font-sans:     'Geist', 'Pretendard', 'Noto Sans KR', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1100px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-sans);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 800px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Combo chart · mega-diagram</p>
    <h1>매출액 및 전년 대비 증가율 2021~2026</h1>

    <svg viewBox="0 0 1000 488" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="combo-dark-title combo-dark-desc">

      <!-- Axis titles with series keys: left = bars, right = line -->
      <rect x="32" y="28" width="12" height="8" fill="rgba(212,210,222,0.15)" stroke="#d4d2de" stroke-width="1"/>
      <text x="52" y="36" fill="#d4d2de" font-size="12" font-weight="500" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">매출액(억 원) · 왼쪽 축</text>
      <line x1="944" y1="32" x2="968" y2="32" stroke="#f6f5fa" stroke-width="1.8"/>
      <text x="936" y="36" fill="#d4d2de" font-size="12" font-weight="500" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="end">증가율(%) · 오른쪽 축</text>

      <!-- Shared gridlines: 100 억 원 = 10 % -->
      <text x="88" y="379" fill="#d4d2de" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">0</text>
      <text x="872" y="379" fill="#d4d2de" font-size="9" font-family="'Geist Mono', monospace">0%</text>

      <text x="872" y="299" fill="#d4d2de" font-size="9" font-family="'Geist Mono', monospace">10%</text>

      <line x1="96" y1="56" x2="96" y2="376" stroke="rgba(246,245,250,0.25)" stroke-width="1"/>
      <line x1="864" y1="56" x2="864" y2="376" stroke="rgba(246,245,250,0.25)" stroke-width="1"/>
      <line x1="96" y1="376" x2="864" y2="376" stroke="rgba(246,245,250,0.25)" stroke-width="1"/>

      <!-- Bars (left axis): value printed inside the bar foot so it never meets the line -->
      <rect x="124" y="281.6" width="72" height="94.4" fill="#17152b"/>
      <rect x="124" y="281.6" width="72" height="94.4" fill="rgba(212,210,222,0.15)" stroke="#d4d2de" stroke-width="1"/>
      <text x="160" y="364" fill="#f6f5fa" font-size="12" font-weight="500" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="middle">118억 원</text>
      <text x="160" y="396" fill="#f6f5fa" font-size="12" font-weight="600" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="middle">2021</text>
      <rect x="252" y="254.4" width="72" height="121.6" fill="#17152b"/>
      <rect x="252" y="254.4" width="72" height="121.6" fill="rgba(212,210,222,0.15)" stroke="#d4d2de" stroke-width="1"/>
      <text x="288" y="364" fill="#f6f5fa" font-size="12" font-weight="500" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="middle">152억 원</text>

      <rect x="508" y="204.8" width="72" height="171.2" fill="#17152b"/>

      <text x="544" y="364" fill="#f6f5fa" font-size="12" font-weight="500" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="middle">214억 원</text>
      <text x="544" y="396" fill="#f6f5fa" font-size="12" font-weight="600" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="middle">2024</text>
      <!-- Focal bar: accent element 1 -->
      <rect x="636" y="144.8" width="72" height="231.2" fill="#17152b"/>
      <rect x="636" y="144.8" width="72" height="231.2" fill="rgba(110,155,234,0.12)" stroke="#6e9bea" stroke-width="1"/>
      <text x="672" y="364" fill="#6e9bea" font-size="12" font-weight="600" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="middle">289억 원</text>
      <text x="672" y="396" fill="#f6f5fa" font-size="12" font-weight="600" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="middle">2025</text>

      <text x="800" y="364" fill="#f6f5fa" font-size="12" font-weight="500" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="middle">341억 원</text>
      <text x="800" y="396" fill="#f6f5fa" font-size="12" font-weight="600" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="middle">2026</text>

      <!-- Growth line (right axis) -->

      <circle cx="160" cy="192.8" r="4" fill="#17152b" stroke="#f6f5fa" stroke-width="1.5"/>
      <rect x="142" y="203.8" width="36" height="12" rx="2" fill="#17152b"/>
      <text x="160" y="212.8" fill="#f6f5fa" font-size="9" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">22.9%</text>
      <circle cx="288" cy="145.6" r="4" fill="#17152b" stroke="#f6f5fa" stroke-width="1.5"/>
      <rect x="270" y="124.6" width="36" height="12" rx="2" fill="#17152b"/>
      <text x="288" y="133.6" fill="#f6f5fa" font-size="9" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">28.8%</text>
      <circle cx="416" cy="276" r="4" fill="#17152b" stroke="#f6f5fa" stroke-width="1.5"/>
      <rect x="398" y="287" width="36" height="12" rx="2" fill="#17152b"/>
      <text x="416" y="296" fill="#f6f5fa" font-size="9" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">12.5%</text>
      <circle cx="544" cy="175.2" r="4" fill="#17152b" stroke="#f6f5fa" stroke-width="1.5"/>
      <rect x="550" y="182.2" width="36" height="12" rx="2" fill="#17152b"/>
      <text x="554" y="191.2" fill="#f6f5fa" font-size="9" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="start">25.1%</text>
      <!-- Focal point: accent element 2 -->
      <circle cx="672" cy="96" r="5" fill="#6e9bea" stroke="#17152b" stroke-width="1.5"/>
      <rect x="654" y="75" width="36" height="12" rx="2" fill="#17152b"/>
      <text x="672" y="84" fill="#6e9bea" font-size="9" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">35.0%</text>
      <circle cx="800" cy="232" r="4" fill="#17152b" stroke="#f6f5fa" stroke-width="1.5"/>
      <rect x="782" y="243" width="36" height="12" rx="2" fill="#17152b"/>
      <text x="800" y="252" fill="#f6f5fa" font-size="9" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">18.0%</text>

      <!-- Legend -->
      <line x1="32" y1="424" x2="968" y2="424" stroke="rgba(246,245,250,0.1)" stroke-width="0.8"/>
      <text x="32" y="442" fill="#d4d2de" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>
      <rect x="32" y="456" width="16" height="8" fill="rgba(212,210,222,0.15)" stroke="#d4d2de" stroke-width="1"/>
      <text x="56" y="464" fill="#d4d2de" font-size="12" font-weight="500" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">매출액 (왼쪽 축)</text>
      <line x1="216" y1="460" x2="240" y2="460" stroke="#f6f5fa" stroke-width="1.8"/>
      <circle cx="228" cy="460" r="3" fill="#17152b" stroke="#f6f5fa" stroke-width="1.5"/>
      <text x="248" y="464" fill="#d4d2de" font-size="12" font-weight="500" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">전년 대비 증가율 (오른쪽 축)</text>
      <rect x="484" y="456" width="16" height="8" fill="rgba(110,155,234,0.12)" stroke="#6e9bea" stroke-width="1"/>
      <text x="508" y="464" fill="#d4d2de" font-size="12" font-weight="500" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">2025 해외 수출 개시</text>
      <text x="968" y="464" fill="#d4d2de" font-size="12" font-weight="500" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="end">2021 증가율은 2020 매출 96억 원 기준</text>

  </div>
</body>
</html>
