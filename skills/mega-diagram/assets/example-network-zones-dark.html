<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>가온시 민원 포털 망 구성도</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #17152b;   /* deep warm charcoal */
      --color-ink:     #f6f5fa;   /* warm off-white */
      --color-muted:   #d4d2de;
      --color-accent:  #6e9bea;
      --font-sans:     'Geist', 'Pretendard', 'Noto Sans KR', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-sans);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Network zones · mega-diagram</p>
    <h1>가온시 민원 포털 망 구성도</h1>

    <svg viewBox="0 0 1000 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="network-zones-dark-title network-zones-dark-desc">
      <title id="network-zones-dark-title">가온시 민원 포털 망 구성도</title>
      <desc id="network-zones-dark-desc">외부망의 민원인이 방화벽 FW-1을 지나 DMZ 웹서버에 접속하고, 첨부 자료는 FW-2 경계의 망연계 솔루션이 검사한 뒤에만 내부 업무망 WAS로 전달되며, WAS는 DB와 업무 PC만 연결하는 망분리 구성.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#d4d2de"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#6e9bea"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#9a86ec"/></marker>
      </defs>

      <!-- 1. Zones (painted first). Korean zone name + Latin subnet inside the top-left corner. -->
      <rect x="40" y="40" width="176" height="408" rx="8" fill="rgba(246,245,250,0.02)" stroke="rgba(246,245,250,0.20)" stroke-width="1" stroke-dasharray="4,4"/>
      <text x="56" y="68" fill="#f6f5fa" font-size="12" font-weight="600" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">외부망 (인터넷)</text>
      <text x="56" y="84" fill="#9d9ab0" font-size="9" font-family="'Geist Mono', monospace">0.0.0.0/0</text>
      <rect x="256" y="40" width="224" height="408" rx="8" fill="rgba(246,245,250,0.02)" stroke="rgba(246,245,250,0.20)" stroke-width="1" stroke-dasharray="4,4"/>
      <text x="272" y="68" fill="#f6f5fa" font-size="12" font-weight="600" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">DMZ</text>
      <text x="272" y="84" fill="#9d9ab0" font-size="9" font-family="'Geist Mono', monospace">172.16.10.0/24</text>
      <rect x="520" y="40" width="440" height="408" rx="8" fill="rgba(246,245,250,0.02)" stroke="rgba(246,245,250,0.20)" stroke-width="1" stroke-dasharray="4,4"/>
      <text x="536" y="68" fill="#f6f5fa" font-size="12" font-weight="600" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">내부 업무망</text>
      <text x="536" y="84" fill="#9d9ab0" font-size="9" font-family="'Geist Mono', monospace">10.20.0.0/16</text>

      <!-- 2. Firewalls: boundary walls in the zone gutters, tag above -->
      <rect x="232" y="72" width="8" height="376" rx="2" fill="rgba(246,245,250,0.05)" stroke="#d4d2de" stroke-width="1"/>
      <text x="236" y="60" fill="#d4d2de" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">FW-1</text>
      <rect x="496" y="72" width="8" height="376" rx="2" fill="rgba(246,245,250,0.05)" stroke="#d4d2de" stroke-width="1"/>
      <text x="500" y="60" fill="#d4d2de" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">FW-2</text>

      <!-- 3. Network paths (before nodes). Zone-crossing = link, in-zone = muted, 망연계 hand-off = accent -->
      <line x1="200" y1="160" x2="308" y2="160" stroke="#9a86ec" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <line x1="436" y1="188" x2="436" y2="244" stroke="#d4d2de" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="568" y1="244" x2="568" y2="188" stroke="#6e9bea" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <line x1="712" y1="160" x2="776" y2="160" stroke="#d4d2de" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="680" y1="364" x2="680" y2="188" stroke="#d4d2de" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- 4. Path labels: Latin protocol:port in mono (12px mask), Korean in 12px (16px mask) -->
      <rect x="244" y="140" width="60" height="12" rx="2" fill="#17152b"/>
      <text x="274.0" y="149" fill="#9a86ec" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">HTTPS:443</text>
      <rect x="380" y="208" width="48" height="12" rx="2" fill="#17152b"/>
      <text x="404.0" y="217" fill="#d4d2de" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SFTP:22</text>
      <rect x="576" y="208" width="84" height="16" rx="2" fill="#17152b"/>
      <text x="618.0" y="220" fill="#6e9bea" font-size="12" font-weight="500" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="middle">검사 후 전달</text>
      <rect x="720" y="140" width="52" height="12" rx="2" fill="#17152b"/>
      <text x="746.0" y="149" fill="#d4d2de" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">TCP:5432</text>
      <rect x="688" y="316" width="60" height="12" rx="2" fill="#17152b"/>
      <text x="718.0" y="325" fill="#d4d2de" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">HTTPS:443</text>

      <!-- 5. Nodes: paper mask, styled box, type tag, name, sublabel -->
      <!-- 민원인 -->
      <rect x="56" y="132" width="144" height="56" rx="6" fill="#17152b"/>
      <rect x="56" y="132" width="144" height="56" rx="6" fill="rgba(212,210,222,0.10)" stroke="#9d9ab0" stroke-width="1"/>
      <rect x="68" y="144" width="28" height="12" rx="2" fill="transparent" stroke="#d4d2de" stroke-opacity="0.5" stroke-width="0.8"/>
      <text x="82.0" y="153" fill="#d4d2de" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">USER</text>
      <text x="104" y="155" fill="#f6f5fa" font-size="12" font-weight="600" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">민원인</text>
      <text x="68" y="175" fill="#d4d2de" font-size="9" font-family="'Geist Mono', monospace">PC · MOBILE</text>
      <!-- 웹서버 -->
      <rect x="308" y="132" width="160" height="56" rx="6" fill="#17152b"/>
      <rect x="308" y="132" width="160" height="56" rx="6" fill="#17152b" stroke="#f6f5fa" stroke-width="1"/>
      <rect x="320" y="144" width="24" height="12" rx="2" fill="transparent" stroke="#d4d2de" stroke-opacity="0.5" stroke-width="0.8"/>
      <text x="332.0" y="153" fill="#d4d2de" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">WEB</text>
      <text x="352" y="155" fill="#f6f5fa" font-size="12" font-weight="600" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">웹서버</text>
      <text x="320" y="175" fill="#d4d2de" font-size="9" font-family="'Geist Mono', monospace">nginx 1.26 · x2</text>
      <!-- 망연계 솔루션 -->
      <rect x="420" y="244" width="160" height="56" rx="6" fill="#17152b"/>
      <rect x="420" y="244" width="160" height="56" rx="6" fill="rgba(110,155,234,0.10)" stroke="#6e9bea" stroke-width="1.2"/>
      <rect x="432" y="256" width="24" height="12" rx="2" fill="transparent" stroke="#6e9bea" stroke-opacity="0.5" stroke-width="0.8"/>
      <text x="444.0" y="265" fill="#6e9bea" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CDS</text>
      <text x="464" y="267" fill="#f6f5fa" font-size="12" font-weight="600" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">망연계 솔루션</text>
      <text x="432" y="288" fill="#d4d2de" font-size="12" font-weight="500" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">단방향 자료 전송</text>
      <!-- 업무 WAS -->
      <rect x="552" y="132" width="160" height="56" rx="6" fill="#17152b"/>
      <rect x="552" y="132" width="160" height="56" rx="6" fill="#17152b" stroke="#f6f5fa" stroke-width="1"/>
      <rect x="564" y="144" width="24" height="12" rx="2" fill="transparent" stroke="#d4d2de" stroke-opacity="0.5" stroke-width="0.8"/>
      <text x="576.0" y="153" fill="#d4d2de" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">WAS</text>
      <text x="596" y="155" fill="#f6f5fa" font-size="12" font-weight="600" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">업무 WAS</text>
      <text x="564" y="175" fill="#d4d2de" font-size="9" font-family="'Geist Mono', monospace">Tomcat 10 · x2</text>
      <!-- 민원 DB -->
      <rect x="776" y="132" width="160" height="56" rx="6" fill="#17152b"/>
      <rect x="776" y="132" width="160" height="56" rx="6" fill="rgba(246,245,250,0.05)" stroke="#d4d2de" stroke-width="1"/>
      <rect x="788" y="144" width="20" height="12" rx="2" fill="transparent" stroke="#d4d2de" stroke-opacity="0.5" stroke-width="0.8"/>
      <text x="798.0" y="153" fill="#d4d2de" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DB</text>
      <text x="816" y="155" fill="#f6f5fa" font-size="12" font-weight="600" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">민원 DB</text>
      <text x="788" y="175" fill="#d4d2de" font-size="9" font-family="'Geist Mono', monospace">PostgreSQL 16</text>
      <!-- 업무 PC -->
      <rect x="552" y="364" width="160" height="56" rx="6" fill="#17152b"/>
      <rect x="552" y="364" width="160" height="56" rx="6" fill="#17152b" stroke="#f6f5fa" stroke-width="1"/>
      <rect x="564" y="376" width="20" height="12" rx="2" fill="transparent" stroke="#d4d2de" stroke-opacity="0.5" stroke-width="0.8"/>
      <text x="574.0" y="385" fill="#d4d2de" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PC</text>
      <text x="592" y="387" fill="#f6f5fa" font-size="12" font-weight="600" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">업무 PC</text>
      <text x="564" y="407" fill="#d4d2de" font-size="9" font-family="'Geist Mono', monospace">VDI · x320</text>

      <!-- 6. Legend -->
      <line x1="40" y1="472" x2="960" y2="472" stroke="rgba(246,245,250,0.12)" stroke-width="0.8"/>
      <text x="40" y="500" fill="#d4d2de" font-size="12" font-weight="500" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">범례</text>
      <rect x="88" y="490" width="16" height="12" rx="2" fill="rgba(212,210,222,0.10)" stroke="#9d9ab0" stroke-width="1"/>
      <text x="112" y="500" fill="#d4d2de" font-size="12" font-weight="500" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">외부 사용자</text>
      <rect x="204" y="490" width="16" height="12" rx="2" fill="#17152b" stroke="#f6f5fa" stroke-width="1"/>
      <text x="228" y="500" fill="#d4d2de" font-size="12" font-weight="500" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">서버·단말</text>
      <rect x="308" y="490" width="16" height="12" rx="2" fill="rgba(246,245,250,0.05)" stroke="#d4d2de" stroke-width="1"/>
      <text x="332" y="500" fill="#d4d2de" font-size="12" font-weight="500" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">저장소</text>
      <rect x="392" y="490" width="16" height="12" rx="2" fill="rgba(110,155,234,0.10)" stroke="#6e9bea" stroke-width="1"/>
      <text x="416" y="500" fill="#d4d2de" font-size="12" font-weight="500" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">망연계</text>
      <rect x="480" y="488" width="8" height="16" rx="2" fill="rgba(246,245,250,0.05)" stroke="#d4d2de" stroke-width="1"/>
      <text x="500" y="500" fill="#d4d2de" font-size="12" font-weight="500" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">방화벽</text>
      <line x1="560" y1="496" x2="580" y2="496" stroke="#9a86ec" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <text x="588" y="500" fill="#d4d2de" font-size="12" font-weight="500" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">경계 통과</text>
      <line x1="668" y1="496" x2="688" y2="496" stroke="#d4d2de" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="696" y="500" fill="#d4d2de" font-size="12" font-weight="500" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">구간 내부</text>
      <line x1="776" y1="496" x2="796" y2="496" stroke="#6e9bea" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <text x="804" y="500" fill="#d4d2de" font-size="12" font-weight="500" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">망간 전달</text>
    </svg>
  </div>
</body>
</html>
