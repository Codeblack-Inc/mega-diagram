<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>월별 온라인 매출 · 막대 차트</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:  #ffffff;
      --color-ink:    #17152b;
      --color-muted:  #68657b;
      --color-accent: #2f6fdb;
      --font-sans:    'Geist', 'Pretendard', 'Noto Sans KR', system-ui, sans-serif;
      --font-serif:   'Instrument Serif', serif;
      --font-mono:    'Geist Mono', ui-monospace, monospace;
    }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 760px; display: block; }
      /* mega: Korean h1 is set in sans */
    h1 { font-family: var(--font-sans); font-weight: 700; letter-spacing: -0.03em; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Bar · mega-diagram</p>
    <h1>월별 온라인 매출 · 1~8월</h1>

    <svg viewBox="0 0 1000 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="bar-title bar-desc">
      <title id="bar-title">월별 온라인 매출 · 1~8월</title>
      <desc id="bar-desc">2026년 1~8월 온라인 몰 월 매출을 억 원 단위로 보여 주며 5월이 최고 실적인 막대 차트.</desc>
      <defs>
        <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
          <circle cx="1" cy="1" r="0.9" fill="rgba(23,21,43,0.10)"/>
        </pattern>
      </defs>


      <!-- Y-axis rotated label -->
      <text transform="rotate(-90 24 230)" x="24" y="230" fill="#68657b" font-size="12" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="middle" font-weight="500">매출(억 원)</text>

      <!-- Horizontal gridlines (drawn before bars) -->
      <line x1="80" y1="357" x2="960" y2="357" stroke="rgba(23,21,43,0.08)" stroke-width="0.8"/>
      <line x1="80" y1="293" x2="960" y2="293" stroke="rgba(23,21,43,0.08)" stroke-width="0.8"/>
      <line x1="80" y1="230" x2="960" y2="230" stroke="rgba(23,21,43,0.08)" stroke-width="0.8"/>
      <line x1="80" y1="167" x2="960" y2="167" stroke="rgba(23,21,43,0.08)" stroke-width="0.8"/>
      <line x1="80" y1="103" x2="960" y2="103" stroke="rgba(23,21,43,0.08)" stroke-width="0.8"/>
      <line x1="80" y1="40"  x2="960" y2="40"  stroke="rgba(23,21,43,0.06)" stroke-width="0.8"/>

      <!-- Y-axis line and X-axis baseline -->
      <line x1="80" y1="40" x2="80" y2="420" stroke="rgba(23,21,43,0.25)" stroke-width="1"/>
      <line x1="80" y1="420" x2="960" y2="420" stroke="rgba(23,21,43,0.25)" stroke-width="1"/>

      <!-- Y-axis tick labels -->
      <text x="72" y="361" fill="#68657b" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">20</text>
      <text x="72" y="297" fill="#68657b" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">40</text>
      <text x="72" y="234" fill="#68657b" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">60</text>
      <text x="72" y="171" fill="#68657b" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">80</text>
      <text x="72" y="107" fill="#68657b" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">100</text>
      <text x="72" y="44"  fill="#68657b" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">120</text>

      <!-- ─── BARS (pitch=110, width=72, pad=19) ─── -->
      <!-- S1: v=72, h=228, y=192 -->
      <rect x="99" y="192" width="72" height="228" fill="#ffffff"/>
      <rect x="99" y="192" width="72" height="228" fill="rgba(104,101,123,0.15)" stroke="#68657b" stroke-width="1"/>
      <text x="135" y="184" fill="#68657b" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">72</text>

      <!-- S2: v=88, h=280, y=140 -->
      <rect x="209" y="140" width="72" height="280" fill="#ffffff"/>
      <rect x="209" y="140" width="72" height="280" fill="rgba(104,101,123,0.15)" stroke="#68657b" stroke-width="1"/>
      <text x="245" y="132" fill="#68657b" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">88</text>

      <!-- S3: v=95, h=300, y=120 -->
      <rect x="319" y="120" width="72" height="300" fill="#ffffff"/>
      <rect x="319" y="120" width="72" height="300" fill="rgba(104,101,123,0.15)" stroke="#68657b" stroke-width="1"/>
      <text x="355" y="112" fill="#68657b" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">95</text>

      <!-- S4: v=78, h=248, y=172 -->
      <rect x="429" y="172" width="72" height="248" fill="#ffffff"/>
      <rect x="429" y="172" width="72" height="248" fill="rgba(104,101,123,0.15)" stroke="#68657b" stroke-width="1"/>
      <text x="465" y="164" fill="#68657b" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">78</text>

      <!-- S5 FOCAL: v=110, h=348, y=72 -->
      <rect x="539" y="72" width="72" height="348" fill="#ffffff"/>
      <rect x="539" y="72" width="72" height="348" fill="rgba(47,111,219,0.12)" stroke="#2f6fdb" stroke-width="1"/>
      <text x="575" y="64" fill="#2f6fdb" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" font-weight="600">110</text>

      <!-- S6: v=102, h=324, y=96 -->
      <rect x="649" y="96" width="72" height="324" fill="#ffffff"/>
      <rect x="649" y="96" width="72" height="324" fill="rgba(104,101,123,0.15)" stroke="#68657b" stroke-width="1"/>
      <text x="685" y="88" fill="#68657b" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">102</text>

      <!-- S7: v=85, h=268, y=152 -->
      <rect x="759" y="152" width="72" height="268" fill="#ffffff"/>
      <rect x="759" y="152" width="72" height="268" fill="rgba(104,101,123,0.15)" stroke="#68657b" stroke-width="1"/>
      <text x="795" y="144" fill="#68657b" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">85</text>

      <!-- S8: v=93, h=296, y=124 -->
      <rect x="869" y="124" width="72" height="296" fill="#ffffff"/>
      <rect x="869" y="124" width="72" height="296" fill="rgba(104,101,123,0.15)" stroke="#68657b" stroke-width="1"/>
      <text x="905" y="116" fill="#68657b" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">93</text>

      <!-- X-axis category labels -->
      <text x="135" y="440" fill="#17152b" font-size="12" font-weight="600" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="middle">1월</text>
      <text x="245" y="440" fill="#17152b" font-size="12" font-weight="600" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="middle">2월</text>
      <text x="355" y="440" fill="#17152b" font-size="12" font-weight="600" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="middle">3월</text>
      <text x="465" y="440" fill="#17152b" font-size="12" font-weight="600" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="middle">4월</text>
      <text x="575" y="440" fill="#2f6fdb" font-size="12" font-weight="600" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="middle">5월</text>
      <text x="685" y="440" fill="#17152b" font-size="12" font-weight="600" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="middle">6월</text>
      <text x="795" y="440" fill="#17152b" font-size="12" font-weight="600" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="middle">7월</text>
      <text x="905" y="440" fill="#17152b" font-size="12" font-weight="600" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="middle">8월</text>

      <!-- Legend -->
      <line x1="40" y1="462" x2="960" y2="462" stroke="rgba(23,21,43,0.10)" stroke-width="0.8"/>
      <text x="40" y="478" fill="#68657b" font-size="12" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" font-weight="500">범례</text>

      <rect x="40" y="488" width="16" height="10" rx="2" fill="rgba(47,111,219,0.12)" stroke="#2f6fdb" stroke-width="1"/>
      <text x="64" y="497" fill="#68657b" font-size="12" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" font-weight="500">5월 · 최고 실적</text>

      <rect x="220" y="488" width="16" height="10" rx="2" fill="rgba(104,101,123,0.15)" stroke="#68657b" stroke-width="1"/>
      <text x="244" y="497" fill="#68657b" font-size="12" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" font-weight="500">기타 월</text>
    </svg>
  </div>
</body>
</html>
