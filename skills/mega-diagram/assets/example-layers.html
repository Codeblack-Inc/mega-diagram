<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>사내 AI 결재 도우미 · 계층 구조</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #ffffff;
      --color-ink:     #17152b;
      --color-muted:   #68657b;
      --color-accent:  #2f6fdb;
      --font-sans:     'Geist', 'Pretendard', 'Noto Sans KR', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
    h1 { font-family: var(--font-sans); font-weight: 700; letter-spacing: -0.03em; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Layer stack · mega-diagram</p>
    <h1>사내 AI 결재 도우미 · 계층 구조</h1>

    <svg viewBox="0 0 1000 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="layers-title layers-desc">
      <title id="layers-title">사내 AI 결재 도우미 · 계층 구조</title>
      <desc id="layers-desc">모델 가중치, SDK, 프롬프트, 에이전트 하네스, 사용자 화면의 5계층 스택이며 에이전트 하네스를 핵심 계층으로 강조한 그림.</desc>
        <defs>
          <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r="0.9" fill="rgba(23,21,43,0.10)"/>
          </pattern>
        </defs>


        <!-- Direction column (left margin) -->
        <text x="60" y="68" fill="#68657b" font-size="12" font-weight="500" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">추상화</text>
        <line x1="80" y1="80" x2="80" y2="400" stroke="rgba(23,21,43,0.30)" stroke-width="1"/>
        <polygon points="76,80 84,80 80,72" fill="#68657b"/>
        <text x="60" fill="#68657b" y="420" font-size="12" font-weight="500" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">하드웨어</text>

        <!-- Stack container hairlines (top + bottom edges) -->
        <line x1="120" y1="80" x2="960" y2="80" stroke="rgba(23,21,43,0.12)" stroke-width="1"/>
        <line x1="120" y1="400" x2="960" y2="400" stroke="rgba(23,21,43,0.12)" stroke-width="1"/>

        <!-- L5 — UI (top layer, near-white fill) -->
        <rect x="120" y="80" width="840" height="64" fill="#ffffff"/>
        <line x1="120" y1="144" x2="960" y2="144" stroke="rgba(23,21,43,0.12)" stroke-width="1"/>
        <text x="140" y="116" fill="#68657b" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">L5</text>
        <text x="260" y="118" fill="#17152b" font-size="16" font-weight="600" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">사용자 화면</text>
        <text x="940" y="118" fill="#68657b" text-anchor="end" font-size="12" font-weight="500" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">메신저 · 그룹웨어 · 모바일</text>

        <!-- L4 — Agent harness (FOCAL, coral tint + coral stroke) -->
        <rect x="120" y="144" width="840" height="64" fill="rgba(47,111,219,0.08)"/>
        <rect x="120" y="144" width="840" height="64" fill="none" stroke="#2f6fdb" stroke-width="1"/>
        <text x="140" y="180" fill="#2f6fdb" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em" font-weight="600">L4</text>
        <text x="260" y="182" fill="#17152b" font-size="16" font-weight="600" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">에이전트 하네스</text>
        <text x="940" y="182" fill="#2f6fdb" text-anchor="end" font-size="12" font-weight="500" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">도구 · 메모리 · 실행 루프</text>

        <!-- L3 — Prompt layer -->
        <rect x="120" y="208" width="840" height="64" fill="#ffffff"/>
        <line x1="120" y1="272" x2="960" y2="272" stroke="rgba(23,21,43,0.12)" stroke-width="1"/>
        <text x="140" y="244" fill="#68657b" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">L3</text>
        <text x="260" y="246" fill="#17152b" font-size="16" font-weight="600" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">프롬프트 계층</text>
        <text x="940" y="246" fill="#68657b" text-anchor="end" font-size="12" font-weight="500" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">시스템 지시 · 예시 · 캐싱</text>

        <!-- L2 — SDK -->
        <rect x="120" y="272" width="840" height="64" fill="#f6f5fa"/>
        <line x1="120" y1="336" x2="960" y2="336" stroke="rgba(23,21,43,0.12)" stroke-width="1"/>
        <text x="140" y="308" fill="#68657b" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">L2</text>
        <text x="260" y="310" fill="#17152b" font-size="16" font-weight="600" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">SDK · 클라이언트</text>
        <text x="940" y="310" fill="#68657b" text-anchor="end" font-size="12" font-weight="500" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">인증 · 재시도 · 스트리밍</text>

        <!-- L1 — Model -->
        <rect x="120" y="336" width="840" height="64" fill="#f6f5fa"/>
        <text x="140" y="372" fill="#68657b" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">L1</text>
        <text x="260" y="374" fill="#17152b" font-size="16" font-weight="600" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">모델 가중치</text>
        <text x="940" y="374" fill="#68657b" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.08em">opus, sonnet, haiku</text>

        <!-- Caption -->
        <text x="120" y="456" fill="#68657b" font-size="12" font-weight="500" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">핵심 계층</text>
        <text x="240" y="456" fill="#68657b" font-size="12" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">제품 차별화의 대부분은 하네스에서 결정 — 도구·메모리, 모델 호출을 실제 결재 업무로 엮는 실행 루프</text>
      </svg>
  </div>
</body>
</html>
