<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>(주)바른식탁 기업 급식 구독 사업 SWOT 분석</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #ffffff;
      --color-ink:     #17152b;
      --color-muted:   #68657b;
      --color-accent:  #2f6fdb;
      --font-sans:     'Geist', 'Pretendard', 'Noto Sans KR', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-sans);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">SWOT · mega-diagram</p>
    <h1>기업 급식 구독 사업 SWOT 분석</h1>

    <svg viewBox="0 0 1000 576" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="swot-title swot-desc">

      <text x="326" y="48" fill="#68657b" font-size="12" font-weight="500" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="middle">긍정 요인</text>
      <text x="754" y="48" fill="#68657b" font-size="12" font-weight="500" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="middle">부정 요인</text>
      <text x="104" y="138" fill="#68657b" font-size="12" font-weight="500" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="end">내부 환경</text>
      <text x="104" y="294" fill="#68657b" font-size="12" font-weight="500" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="end">외부 환경</text>
      <text x="104" y="440" fill="#68657b" font-size="12" font-weight="500" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="end">교차 전략</text>

      <rect x="120" y="64" width="412" height="140" rx="6" fill="#ffffff"/>
      <rect x="120" y="64" width="412" height="140" rx="6" fill="rgba(23,21,43,0.03)" stroke="rgba(23,21,43,0.2)" stroke-width="1"/>
      <text x="136" y="92" fill="#17152b" font-size="14" font-weight="600" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">강점 (S)</text>

      <circle cx="140" cy="142" r="1.5" fill="#68657b"/>
      <text x="148" y="146" fill="#68657b" font-size="12" font-weight="400" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">자체 조리센터 2곳 운영</text>

      <circle cx="140" cy="182" r="1.5" fill="#68657b"/>
      <text x="148" y="186" fill="#68657b" font-size="12" font-weight="400" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">주문·배송 자체 플랫폼</text>
      <rect x="548" y="64" width="412" height="140" rx="6" fill="#ffffff"/>
      <rect x="548" y="64" width="412" height="140" rx="6" fill="rgba(23,21,43,0.03)" stroke="rgba(23,21,43,0.2)" stroke-width="1"/>
      <text x="564" y="92" fill="#17152b" font-size="14" font-weight="600" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">약점 (W)</text>
      <line x1="564" y1="104" x2="944" y2="104" stroke="rgba(23,21,43,0.12)" stroke-width="0.8"/>
      <circle cx="568" cy="122" r="1.5" fill="#68657b"/>
      <text x="576" y="126" fill="#68657b" font-size="12" font-weight="400" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">수도권 외 배송망 부재</text>
      <circle cx="568" cy="142" r="1.5" fill="#68657b"/>
      <text x="576" y="146" fill="#68657b" font-size="12" font-weight="400" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">원가율 68%, 업계 평균 상회</text>
      <circle cx="568" cy="162" r="1.5" fill="#68657b"/>
      <text x="576" y="166" fill="#68657b" font-size="12" font-weight="400" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">영업 인력 7명으로 한정</text>
      <circle cx="568" cy="182" r="1.5" fill="#68657b"/>

      <circle cx="140" cy="318" r="1.5" fill="#68657b"/>

      <circle cx="140" cy="338" r="1.5" fill="#68657b"/>

      <rect x="548" y="220" width="412" height="140" rx="6" fill="rgba(23,21,43,0.03)" stroke="rgba(23,21,43,0.2)" stroke-width="1"/>

      <line x1="564" y1="260" x2="944" y2="260" stroke="rgba(23,21,43,0.12)" stroke-width="0.8"/>
      <circle cx="568" cy="278" r="1.5" fill="#68657b"/>
      <text x="576" y="282" fill="#68657b" font-size="12" font-weight="400" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">대기업 급식사 구독 시장 진입</text>
      <circle cx="568" cy="298" r="1.5" fill="#68657b"/>
      <text x="576" y="302" fill="#68657b" font-size="12" font-weight="400" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">식자재 물가 전년 대비 7% 상승</text>
      <circle cx="568" cy="318" r="1.5" fill="#68657b"/>
      <text x="576" y="322" fill="#68657b" font-size="12" font-weight="400" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">배달 대행 수수료 인상</text>
      <circle cx="568" cy="338" r="1.5" fill="#68657b"/>
      <text x="576" y="342" fill="#68657b" font-size="12" font-weight="400" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">식품 위생 규제 강화</text>

      <!-- Strategy strip: SO focal -->
      <line x1="120" y1="376" x2="960" y2="376" stroke="rgba(23,21,43,0.12)" stroke-width="0.8"/>
      <rect x="120" y="392" width="204" height="88" rx="6" fill="#ffffff"/>
      <rect x="120" y="392" width="204" height="88" rx="6" fill="rgba(47,111,219,0.08)" stroke="#2f6fdb" stroke-width="1"/>

      <text x="136" y="444" fill="#68657b" font-size="12" font-weight="400" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">바우처 대상 중소기업</text>
      <text x="136" y="462" fill="#68657b" font-size="12" font-weight="400" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">재구독 사례로 공략</text>
      <rect x="332" y="392" width="204" height="88" rx="6" fill="#ffffff"/>
      <rect x="332" y="392" width="204" height="88" rx="6" fill="#ffffff" stroke="rgba(23,21,43,0.3)" stroke-width="1"/>
      <text x="348" y="416" fill="#17152b" font-size="12" font-weight="600" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">ST 전략</text>
      <text x="348" y="444" fill="#68657b" font-size="12" font-weight="400" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">식단 차별화로</text>
      <text x="348" y="462" fill="#68657b" font-size="12" font-weight="400" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">대기업 진입 방어</text>
      <rect x="544" y="392" width="204" height="88" rx="6" fill="#ffffff"/>
      <rect x="544" y="392" width="204" height="88" rx="6" fill="#ffffff" stroke="rgba(23,21,43,0.3)" stroke-width="1"/>
      <text x="560" y="416" fill="#17152b" font-size="12" font-weight="600" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">WO 전략</text>
      <text x="560" y="444" fill="#68657b" font-size="12" font-weight="400" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">공유주방 거점으로</text>
      <text x="560" y="462" fill="#68657b" font-size="12" font-weight="400" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">충청권 배송 확대</text>
      <rect x="756" y="392" width="204" height="88" rx="6" fill="#ffffff"/>
      <rect x="756" y="392" width="204" height="88" rx="6" fill="#ffffff" stroke="rgba(23,21,43,0.3)" stroke-width="1"/>
      <text x="772" y="416" fill="#17152b" font-size="12" font-weight="600" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">WT 전략</text>
      <text x="772" y="444" fill="#68657b" font-size="12" font-weight="400" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">식자재 공동 구매로</text>
      <text x="772" y="462" fill="#68657b" font-size="12" font-weight="400" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">원가율 62% 달성</text>

      <!-- Legend -->
      <line x1="40" y1="512" x2="960" y2="512" stroke="rgba(23,21,43,0.12)" stroke-width="0.8"/>
      <text x="40" y="544" fill="#68657b" font-size="12" font-weight="500" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">범례</text>
      <rect x="88" y="532" width="16" height="12" rx="2" fill="rgba(23,21,43,0.03)" stroke="rgba(23,21,43,0.2)" stroke-width="1"/>
      <text x="112" y="544" fill="#68657b" font-size="12" font-weight="500" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">현황 요인</text>
      <rect x="192" y="532" width="16" height="12" rx="2" fill="#ffffff" stroke="rgba(23,21,43,0.3)" stroke-width="1"/>
      <text x="216" y="544" fill="#68657b" font-size="12" font-weight="500" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">교차 전략</text>
      <rect x="296" y="532" width="16" height="12" rx="2" fill="rgba(47,111,219,0.08)" stroke="#2f6fdb" stroke-width="1"/>
      <text x="320" y="544" fill="#68657b" font-size="12" font-weight="500" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">우선 추진 전략</text>
    </svg>
  </div>
</body>
</html>
