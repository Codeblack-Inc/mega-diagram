<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CI 실행 시간 예산 · 생키</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #17152b;
      --color-ink:     #f6f5fa;
      --color-muted:   #d4d2de;
      --color-accent:  #6e9bea;
      --font-sans:     'Geist', 'Pretendard', 'Noto Sans KR', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
      /* mega: Korean h1 is set in sans */
    h1 { font-family: var(--font-sans); font-weight: 700; letter-spacing: -0.03em; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Sankey · mega-diagram</p>
    <h1>CI 실행 시간 예산 · 한 달 파이프라인 사용량</h1>

    <svg viewBox="0 0 1000 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="sankey-dark-title sankey-dark-desc">
      <title id="sankey-dark-title">CI 실행 시간 예산 · 한 달 파이프라인 사용량</title>
      <desc id="sankey-dark-desc">월 12,000분의 CI 실행 시간이 단위 테스트·E2E·빌드·린트 단계로 나뉜 뒤 통과·실패·재실행 통과 결과로 합쳐지는 생키 다이어그램으로, 불안정 재실행 경로만 강조색으로 표시했다.</desc>


      <!-- Column headers -->
      <text x="124" y="76" fill="#d4d2de" font-size="12" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="middle" font-weight="500">예산</text>
      <text x="504" y="76" fill="#d4d2de" font-size="12" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="middle" font-weight="500">테스트 단계</text>
      <text x="884" y="76" fill="#d4d2de" font-size="12" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="middle" font-weight="500">결과</text>

      <!-- Ribbons: col1 -> col2. Both control points sit on the midpoint x, so every band
           meets its node bar horizontally at each end rather than arriving at a slant. -->
      <path d="M132,120 C316,120 316,120 500,120 L500,224 C316,224 316,224 132,224 Z" fill="rgba(212,210,222,0.22)"/>
      <path d="M132,224 C316,224 316,256 500,256 L500,336 C316,336 316,304 132,304 Z" fill="rgba(212,210,222,0.22)"/>
      <path d="M132,304 C316,304 316,368 500,368 L500,408 C316,408 316,344 132,344 Z" fill="rgba(212,210,222,0.22)"/>
      <path d="M132,344 C316,344 316,440 500,440 L500,456 C316,456 316,360 132,360 Z" fill="rgba(212,210,222,0.22)"/>

      <!-- Ribbons: col2 -> col3, ordinary. Each source stacks its outgoing bands in target
           order and each target stacks its incoming bands in source order, which is what
           keeps every bar exactly saturated. Four sources feeding three outcomes cannot be
           drawn crossing-free; what remains is the minimum. -->
      <path d="M512,136 C696,136 696,148 880,148 L880,236 C696,236 696,224 512,224 Z" fill="rgba(212,210,222,0.22)"/>
      <path d="M512,260 C696,260 696,236 880,236 L880,312 C696,312 696,336 512,336 Z" fill="rgba(212,210,222,0.22)"/>
      <path d="M512,368 C696,368 696,312 880,312 L880,328 C696,328 696,384 512,384 Z" fill="rgba(212,210,222,0.22)"/>
      <path d="M512,384 C696,384 696,344 880,344 L880,368 C696,368 696,408 512,408 Z" fill="rgba(212,210,222,0.22)"/>
      <path d="M512,440 C696,440 696,328 880,328 L880,336 C696,336 696,448 512,448 Z" fill="rgba(212,210,222,0.22)"/>
      <path d="M512,448 C696,448 696,368 880,368 L880,376 C696,376 696,456 512,456 Z" fill="rgba(212,210,222,0.22)"/>

      <!-- Ribbons: col2 -> col3, flaky-rerun path (the one accent flow) -->
      <path d="M512,120 C696,120 696,120 880,120 L880,136 C696,136 696,136 512,136 Z" fill="rgba(110,155,234,0.28)"/>
      <path d="M512,256 C696,256 696,136 880,136 L880,140 C696,140 696,260 512,260 Z" fill="rgba(110,155,234,0.28)"/>

      <!-- Nodes -->
      <rect x="120" y="120" width="12" height="240" fill="#f6f5fa"/>
      <rect x="500" y="120" width="12" height="104" fill="#f6f5fa"/>
      <rect x="500" y="256" width="12" height="80" fill="#f6f5fa"/>
      <rect x="500" y="368" width="12" height="40" fill="#f6f5fa"/>
      <rect x="500" y="440" width="12" height="16" fill="#f6f5fa"/>
      <rect x="880" y="120" width="12" height="20" fill="#f6f5fa"/>
      <rect x="880" y="148" width="12" height="188" fill="#f6f5fa"/>
      <rect x="880" y="344" width="12" height="32" fill="#f6f5fa"/>

      <!-- Labels: column 1, outside, anchored end -->
      <text x="104" y="236" fill="#f6f5fa" font-size="12" font-weight="600" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="end">CI 실행 시간</text>
      <text x="104" y="252" fill="#d4d2de" font-size="12" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="end" font-weight="500">12,000분</text>

      <!-- Labels: column 2, centred in the gutter above the bar, where the bands separate. -->

      <text x="504" y="96" fill="#f6f5fa" font-size="12" font-weight="600" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="middle">단위 테스트</text>
      <text x="504" y="112" fill="#d4d2de" font-size="12" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="middle" font-weight="500">5,200분</text>

      <text x="504" y="236" fill="#f6f5fa" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">E2E</text>
      <text x="504" y="252" fill="#d4d2de" font-size="12" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="middle" font-weight="500">4,000분</text>

      <text x="504" y="348" fill="#f6f5fa" font-size="12" font-weight="600" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="middle">빌드</text>
      <text x="504" y="364" fill="#d4d2de" font-size="12" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="middle" font-weight="500">2,000분</text>

      <text x="504" y="420" fill="#f6f5fa" font-size="12" font-weight="600" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="middle">린트</text>
      <text x="504" y="436" fill="#d4d2de" font-size="12" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="middle" font-weight="500">800분</text>

      <!-- Labels: column 3, outside, anchored start -->

      <text x="908" y="120" fill="#f6f5fa" font-size="12" font-weight="600" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="start">재실행 통과</text>
      <text x="908" y="136" fill="#d4d2de" font-size="12" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="start" font-weight="500">1,000분</text>

      <text x="908" y="236" fill="#f6f5fa" font-size="12" font-weight="600" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="start">통과</text>
      <text x="908" y="252" fill="#d4d2de" font-size="12" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="start" font-weight="500">9,400분</text>

      <text x="908" y="356" fill="#f6f5fa" font-size="12" font-weight="600" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="start">실패</text>
      <text x="908" y="372" fill="#d4d2de" font-size="12" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="start" font-weight="500">1,600분</text>

      <!-- Legend -->
      <line x1="40" y1="492" x2="960" y2="492" stroke="rgba(246,245,250,0.10)" stroke-width="0.8"/>
      <text x="40" y="508" fill="#d4d2de" font-size="12" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" font-weight="500">범례</text>

      <rect x="40" y="520" width="16" height="8" fill="rgba(212,210,222,0.22)" stroke="#d4d2de" stroke-width="1"/>
      <text x="64" y="528" fill="#d4d2de" font-size="12" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" font-weight="500">흐름 · 단계 배분</text>

      <rect x="220" y="520" width="16" height="8" fill="rgba(110,155,234,0.28)" stroke="#6e9bea" stroke-width="1"/>
      <text x="244" y="528" fill="#d4d2de" font-size="12" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" font-weight="500">재실행 경로</text>

      <rect x="420" y="520" width="16" height="8" fill="#f6f5fa"/>
      <text x="444" y="528" fill="#d4d2de" font-size="12" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" font-weight="500">노드 · 단계 합계</text>

      <text x="600" y="528" fill="#d4d2de" font-size="12" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" font-weight="500">강조 리본 2개 · 불안정 재실행이 월 CI 예산의 약 8% 소모</text>
    </svg>
  </div>
</body>
</html>
