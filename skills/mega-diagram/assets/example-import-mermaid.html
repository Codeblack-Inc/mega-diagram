<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mermaid 가져오기 — 요청 검증 흐름</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --paper:#ffffff; --ink:#17152b; --muted:#68657b; --soft:#8a879c; --accent:#2f6fdb; --font-sans:'Geist','Pretendard','Noto Sans KR',system-ui,sans-serif; }
    body { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:48px 32px; background:var(--paper); color:var(--ink); font-family:var(--font-sans); }
    .frame { width:100%; max-width:1200px; }
    .eyebrow { margin-bottom:8px; color:var(--muted); font:500 8px 'Geist Mono',monospace; letter-spacing:.14em; text-transform:uppercase; }
    h1 { margin-bottom:24px; font:700 28px/1.15 var(--font-sans); letter-spacing:-0.03em; }
    svg { display:block; width:100%; min-width:900px; }
  </style>
</head>
<body>
  <main class="frame">
    <p class="eyebrow">Flowchart · Imported from Mermaid · doc-inline · balanced</p>
    <h1>요청 검증과 주문 저장</h1>
    <svg viewBox="0 0 960 600" role="img" aria-labelledby="import-mermaid-title import-mermaid-desc" xmlns="http://www.w3.org/2000/svg">

      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#68657b"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2f6fdb"/></marker>
      </defs>

      <rect x="40" y="80" width="200" height="336" rx="8" fill="none" stroke="rgba(23,21,43,0.12)"/>
      <text x="56" y="104" fill="#8a879c" font-size="12" font-weight="500" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">접점</text>

      <path d="M208,168 H328" fill="none" stroke="#68657b" stroke-width="1.2" marker-end="url(#arrow)"/>

      <path d="M488,192 H568" fill="none" stroke="#2f6fdb" stroke-width="1.2" marker-end="url(#arrow-accent)"/>

      <path d="M408,160 V136 A8,8 0 0 1 416,128 H504 A8,8 0 0 1 512,136 V168 A8,8 0 0 1 504,176 H488" fill="none" stroke="#68657b" stroke-width="1.2" stroke-dasharray="4,4" marker-end="url(#arrow)"/>
      <path d="M752,336 V352 A8,8 0 0 1 744,360 H696 A8,8 0 0 0 688,368 V384" fill="none" stroke="#68657b" stroke-width="1.2" marker-end="url(#arrow)"/>

      <rect x="252" y="144" width="32" height="16" rx="2" fill="#ffffff"/><text x="268" y="156" fill="#8a879c" font-size="12" font-weight="500" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="middle">요청</text>
      <rect x="232" y="272" width="32" height="16" rx="2" fill="#ffffff"/><text x="248" y="284" fill="#8a879c" font-size="12" font-weight="500" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="middle">요청</text>
      <rect x="512" y="168" width="32" height="16" rx="2" fill="#ffffff"/><text x="528" y="180" fill="#2f6fdb" font-size="12" font-weight="500" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="middle">검증</text>
      <rect x="714" y="168" width="20" height="16" rx="2" fill="#ffffff"/><text x="724" y="180" fill="#8a879c" font-size="12" font-weight="500" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="middle">예</text>
      <rect x="538" y="320" width="44" height="16" rx="2" fill="#ffffff"/><text x="560" y="332" fill="#8a879c" font-size="12" font-weight="500" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="middle">아니요</text>
      <rect x="434" y="104" width="44" height="16" rx="2" fill="#ffffff"/><text x="456" y="116" fill="#8a879c" font-size="12" font-weight="500" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="middle">재시도</text>
      <rect x="704" y="336" width="32" height="16" rx="2" fill="#ffffff"/><text x="720" y="348" fill="#8a879c" font-size="12" font-weight="500" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="middle">저장</text>

      <rect x="64" y="140" width="144" height="56" rx="6" fill="rgba(104,101,123,0.10)" stroke="#8a879c"/><text x="136" y="172" fill="#17152b" font-size="12" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" font-weight="600" text-anchor="middle">웹 앱</text>
      <rect x="64" y="268" width="144" height="56" rx="8" fill="rgba(104,101,123,0.10)" stroke="#8a879c"/><text x="136" y="300" fill="#17152b" font-size="12" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" font-weight="600" text-anchor="middle">모바일 앱</text>
      <rect x="328" y="160" width="160" height="64" rx="8" fill="rgba(47,111,219,0.08)" stroke="#2f6fdb"/><text x="408" y="188" fill="#17152b" font-size="12" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" font-weight="600" text-anchor="middle">API 게이트웨이</text><text x="408" y="204" fill="#68657b" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">/v1/*</text>
      <polygon points="632,128 696,192 632,256 568,192" fill="#ffffff" stroke="#17152b"/><text x="632" y="188" fill="#17152b" font-size="12" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" font-weight="600" text-anchor="middle">토큰</text><text x="632" y="204" fill="#17152b" font-size="12" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" font-weight="600" text-anchor="middle">유효 여부</text>
      <rect x="744" y="272" width="160" height="64" rx="6" fill="#ffffff" stroke="#17152b"/><text x="824" y="300" fill="#17152b" font-size="12" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" font-weight="600" text-anchor="middle">주문 서비스</text><text x="824" y="316" fill="#68657b" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">POST /orders</text>
      <rect x="608" y="384" width="160" height="56" rx="6" fill="rgba(23,21,43,0.05)" stroke="#68657b"/><text x="688" y="408" fill="#17152b" font-size="12" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" font-weight="600" text-anchor="middle">Postgres</text><text x="688" y="424" fill="#68657b" font-size="8" font-family="'Geist Mono',monospace" text-anchor="middle">orders</text>

      <line x1="40" y1="504" x2="920" y2="504" stroke="rgba(23,21,43,0.10)" stroke-width="0.8"/>
      <text x="40" y="528" fill="#68657b" font-size="12" font-weight="500" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">범례</text>
      <rect x="128" y="516" width="16" height="12" rx="2" fill="rgba(47,111,219,0.08)" stroke="#2f6fdb"/><text x="152" y="528" fill="#68657b" font-size="12" font-weight="500" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">핵심</text>
      <polygon points="248,516 256,522 248,528 240,522" fill="#ffffff" stroke="#17152b"/><text x="268" y="528" fill="#68657b" font-size="12" font-weight="500" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">판단</text>
      <rect x="376" y="516" width="16" height="12" rx="2" fill="rgba(23,21,43,0.05)" stroke="#68657b"/><text x="400" y="528" fill="#68657b" font-size="12" font-weight="500" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">저장소</text>
      <rect x="472" y="516" width="16" height="12" rx="2" fill="rgba(104,101,123,0.10)" stroke="#8a879c"/><text x="496" y="528" fill="#68657b" font-size="12" font-weight="500" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">입력</text>
      <rect x="568" y="516" width="16" height="12" rx="2" fill="#ffffff" stroke="#17152b"/><text x="592" y="528" fill="#68657b" font-size="12" font-weight="500" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">서비스</text>
    </svg>
  </main>
</body>
</html>
