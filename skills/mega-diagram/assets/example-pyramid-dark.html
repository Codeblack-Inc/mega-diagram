<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>성과 지표 체계 · 전략 목표에서 개인 지표까지</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #17152b;
      --color-ink:     #f6f5fa;
      --color-muted:   #d4d2de;
      --color-accent:  #6e9bea;
      --font-sans:     'Geist', 'Pretendard', 'Noto Sans KR', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
    /* mega: Korean h1 is set in sans */
    h1 { font-family: var(--font-sans); font-weight: 700; letter-spacing: -0.03em; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Pyramid · mega-diagram</p>
    <h1>성과 지표 체계 · 전략 목표에서 개인 지표까지</h1>

    <svg viewBox="0 0 1000 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="pyramid-dark-title pyramid-dark-desc">
      <title id="pyramid-dark-title">성과 지표 체계 · 전략 목표에서 개인 지표까지</title>
      <desc id="pyramid-dark-desc">개인 업무 지표, 부서 성과지표, 핵심 성과지표, 중장기 전략 목표를 개수와 점검 주기 순으로 쌓은 성과 지표 피라미드.</desc>
        <defs>
          <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r="0.9" fill="rgba(246,245,250,0.10)"/>
          </pattern>
        </defs>


        <!-- Left axis: direction of rarity -->
        <line x1="100" y1="40" x2="100" y2="320" stroke="rgba(246,245,250,0.30)" stroke-width="1"/>
        <polygon points="96,40 104,40 100,28" fill="rgba(246,245,250,0.45)"/>
        <text x="80" y="216" fill="#d4d2de" font-size="12" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="middle" transform="rotate(-90 80 216)" font-weight="500">위로 갈수록 적고 오래 가는 지표</text>

        <!-- Base layer: Short posts -->
        <polygon points="244,280 756,280 820,344 180,344" fill="rgba(246,245,250,0.04)" stroke="rgba(246,245,250,0.12)" stroke-width="1"/>
        <text x="500" y="308" fill="#f6f5fa" font-size="12" font-weight="600" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="middle">개인 업무 지표</text>
        <text x="500" y="324" fill="#d4d2de" font-size="12" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="middle" font-weight="400">월 1회 점검 · 1인당 3~5개</text>
        <text x="836" y="316" fill="#d4d2de" font-size="12" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" font-weight="500">~240개</text>

        <!-- L3: Essays -->
        <polygon points="308,216 692,216 756,280 244,280" fill="rgba(246,245,250,0.04)" stroke="rgba(246,245,250,0.12)" stroke-width="1"/>
        <text x="500" y="244" fill="#f6f5fa" font-size="12" font-weight="600" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="middle">부서 성과지표</text>
        <text x="500" y="260" fill="#d4d2de" font-size="12" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="middle" font-weight="400">분기 1회 점검 · 부서당 4~6개</text>
        <text x="776" y="252" fill="#d4d2de" font-size="12" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" font-weight="500">~48개</text>

        <!-- L2: Long-form guides -->
        <polygon points="372,152 628,152 692,216 308,216" fill="rgba(246,245,250,0.04)" stroke="rgba(246,245,250,0.12)" stroke-width="1"/>
        <text x="500" y="180" fill="#f6f5fa" font-size="12" font-weight="600" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="middle">핵심 성과지표</text>
        <text x="500" y="196" fill="#d4d2de" font-size="12" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="middle" font-weight="400">반기 1회 점검 · 기관 공통</text>
        <text x="716" y="188" fill="#d4d2de" font-size="12" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" font-weight="500">~4개</text>

        <!-- Apex: Flagship book — CORAL FOCAL (true pyramid peak — single triangle, consistent slope with layers below) -->
        <polygon points="500,24 628,152 372,152" fill="rgba(110,155,234,0.10)" stroke="#6e9bea" stroke-width="1"/>
        <text x="500" y="120" fill="#f6f5fa" font-size="12" font-weight="600" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="middle">중장기 전략 목표</text>
        <text x="500" y="136" fill="#d4d2de" font-size="12" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="middle" font-weight="400">3~5년 주기 수립</text>
        <text x="656" y="112" fill="#6e9bea" font-size="12" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" font-weight="500">최상위</text>

        <!-- Footnote under pyramid -->
        <text x="500" y="384" fill="#d4d2de" font-size="12" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="middle" font-weight="500">하위 지표가 상위 목표를 받치고, 상위 목표가 하위 지표를 정한다.</text>

        <!-- Legend -->
        <line x1="40" y1="436" x2="960" y2="436" stroke="rgba(246,245,250,0.10)" stroke-width="0.8"/>
        <text x="40" y="452" fill="#d4d2de" font-size="12" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" font-weight="500">범례</text>

        <rect x="40" y="464" width="16" height="12" fill="rgba(110,155,234,0.10)" stroke="#6e9bea" stroke-width="1"/>
        <text x="64" y="474" fill="#d4d2de" font-size="12" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" font-weight="500">최상위 — 가장 적고 영향이 큰 목표</text>

        <rect x="320" y="464" width="16" height="12" fill="rgba(246,245,250,0.04)" stroke="rgba(246,245,250,0.25)" stroke-width="1"/>
        <text x="344" y="474" fill="#d4d2de" font-size="12" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" font-weight="500">하위 층 — 실행 단위 지표</text>

        <text x="560" y="474" fill="#d4d2de" font-size="12" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" font-weight="500">층의 폭은 지표 수. 좁을수록 적고 점검 주기가 길다.</text>
      </svg>
  </div>
</body>
</html>
