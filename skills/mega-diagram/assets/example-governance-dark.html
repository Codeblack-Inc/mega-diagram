<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 공공데이터 플랫폼 과제 추진 체계도</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #17152b;
      --color-ink:     #f6f5fa;
      --color-muted:   #d4d2de;
      --color-accent:  #6e9bea;
      --font-sans:     'Geist', 'Pretendard', 'Noto Sans KR', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-sans);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Governance · mega-diagram</p>
    <h1>AI 공공데이터 플랫폼 과제 추진 체계</h1>

    <svg viewBox="0 0 1000 672" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="governance-dark-title governance-dark-desc">

      <desc id="governance-dark-desc">과학기술정보통신부·정보통신기획평가원과 협약한 주관기관 (주)메가데이터가 참여기관 세 곳에 연구비를 배분하고, 가온시 도시정보과와 기술 이전·실증 데이터를 주고받으며 자문위원회의 자문을 받는 추진 체계.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#d4d2de"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#6e9bea"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#9a86ec"/></marker>
      </defs>

      <!-- Relations first: they paint behind the organisation boxes. -->

      <line x1="476" y1="192" x2="476" y2="248" stroke="#6e9bea" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <line x1="524" y1="248" x2="524" y2="192" stroke="#d4d2de" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <line x1="240" y1="312" x2="360" y2="312" stroke="#d4d2de" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <line x1="640" y1="288" x2="760" y2="288" stroke="#d4d2de" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="760" y1="336" x2="640" y2="336" stroke="#d4d2de" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

      <path d="M 500,416 H 812 Q 820,416 820,424 V 456" fill="none" stroke="#d4d2de" stroke-width="1.2" marker-end="url(#arrow)"/>

      <rect x="392" y="212" width="76" height="16" rx="2" fill="#17152b"/>
      <text x="430" y="224" fill="#6e9bea" font-size="12" font-weight="500" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="middle">협약·연구비</text>
      <rect x="532" y="212" width="64" height="16" rx="2" fill="#17152b"/>

      <rect x="668" y="264" width="64" height="16" rx="2" fill="#17152b"/>
      <text x="700" y="276" fill="#d4d2de" font-size="12" font-weight="500" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="middle">기술 이전</text>

      <circle cx="380" cy="358" r="1.5" fill="#d4d2de"/>
      <text x="388" y="362" fill="#d4d2de" font-size="12" font-weight="400" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">참여기관 연구비 배분</text>

      <line x1="776" y1="304" x2="944" y2="304" stroke="rgba(246,245,250,0.12)" stroke-width="0.8"/>

      <circle cx="780" cy="358" r="1.5" fill="#d4d2de"/>
      <text x="788" y="362" fill="#d4d2de" font-size="12" font-weight="400" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">운영 데이터 공유</text>
      <!-- 공동연구기관 · 한빛대학교 산학협력단 -->

      <line x1="376" y1="512" x2="624" y2="512" stroke="rgba(246,245,250,0.12)" stroke-width="0.8"/>
      <circle cx="380" cy="530" r="1.5" fill="#d4d2de"/>
      <text x="388" y="534" fill="#d4d2de" font-size="12" font-weight="400" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">수집 모듈 개발</text>
      <circle cx="380" cy="548" r="1.5" fill="#d4d2de"/>
      <text x="388" y="552" fill="#d4d2de" font-size="12" font-weight="400" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">현장 시스템 연동</text>
      <!-- 참여기관 · (재)미래표준연구원 -->

      <text x="696" y="478" fill="#9d9ab0" font-size="12" font-weight="500" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">참여기관</text>
      <text x="696" y="498" fill="#f6f5fa" font-size="12" font-weight="600" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">(재)미래표준연구원</text>
      <line x1="696" y1="512" x2="944" y2="512" stroke="rgba(246,245,250,0.12)" stroke-width="0.8"/>
      <circle cx="700" cy="530" r="1.5" fill="#d4d2de"/>
      <text x="708" y="534" fill="#d4d2de" font-size="12" font-weight="400" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">표준·인증 대응</text>
      <circle cx="700" cy="548" r="1.5" fill="#d4d2de"/>
      <text x="708" y="552" fill="#d4d2de" font-size="12" font-weight="400" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">성능 시험 평가</text>

      <rect x="88" y="628" width="16" height="12" rx="2" fill="rgba(110,155,234,0.10)" stroke="#6e9bea" stroke-width="1"/>
      <text x="112" y="640" fill="#d4d2de" font-size="12" font-weight="500" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">주관기관</text>
