<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>민원 처리 경로 판단</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #ffffff;
      --color-ink:     #17152b;
      --color-muted:   #68657b;
      --color-accent:  #2f6fdb;
      --font-sans:     'Geist', 'Pretendard', 'Noto Sans KR', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
      /* mega: Korean h1 is set in sans */
    h1 { font-family: var(--font-sans); font-weight: 700; letter-spacing: -0.03em; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flowchart · mega-diagram</p>
    <h1>민원 처리 경로 판단</h1>

    <svg viewBox="0 0 1000 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="flowchart-title flowchart-desc">
      <title id="flowchart-title">민원 처리 경로 판단</title>
      <desc id="flowchart-desc">접수된 민원이 즉시 종결, 타 기관 이송, 소관 부서 처리 중 어느 경로로 가는지 판단하는 순서도.</desc>
        <defs>
          <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r="0.9" fill="rgba(23,21,43,0.10)"/>
          </pattern>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#68657b"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2f6fdb"/></marker>
        </defs>


        <!-- Arrows (drawn first, behind nodes) -->
        <!-- Start → Step -->
        <line x1="500" y1="88" x2="500" y2="120" stroke="#68657b" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- Step → Diamond 1 -->
        <line x1="500" y1="168" x2="500" y2="192" stroke="#68657b" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- Diamond 1 "NO" right -->
        <line x1="600" y1="240" x2="720" y2="240" stroke="#68657b" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- Diamond 1 "YES" down -->
        <line x1="500" y1="288" x2="500" y2="328" stroke="#68657b" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- Diamond 2 "NO" right -->
        <line x1="600" y1="376" x2="720" y2="376" stroke="#68657b" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- Diamond 2 "YES" down (coral — happy path) -->
        <line x1="500" y1="424" x2="500" y2="464" stroke="#2f6fdb" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

        <!-- Arrow labels -->
        <rect x="634" y="228" width="44" height="16" rx="2" fill="#ffffff"/>
        <text x="656" y="240" fill="#68657b" font-size="12" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="middle" font-weight="500">아니오</text>

        <rect x="490" y="296" width="20" height="16" rx="2" fill="#ffffff"/>
        <text x="500" y="308" fill="#68657b" font-size="12" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="middle" font-weight="500">예</text>

        <rect x="634" y="364" width="44" height="16" rx="2" fill="#ffffff"/>
        <text x="656" y="376" fill="#68657b" font-size="12" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="middle" font-weight="500">아니오</text>

        <rect x="490" y="432" width="20" height="16" rx="2" fill="#ffffff"/>
        <text x="500" y="444" fill="#2f6fdb" font-size="12" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="middle" font-weight="500">예</text>

        <!-- Start oval -->
        <rect x="420" y="40" width="160" height="48" rx="24" fill="rgba(23,21,43,0.03)" stroke="rgba(23,21,43,0.30)" stroke-width="1"/>
        <text x="500" y="68" fill="#17152b" font-size="12" font-weight="600" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="middle">민원 접수</text>

        <!-- Rectangle: Step -->
        <rect x="420" y="120" width="160" height="48" rx="6" fill="#ffffff" stroke="#17152b" stroke-width="1"/>
        <text x="500" y="148" fill="#17152b" font-size="12" font-weight="600" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="middle">요건 검토</text>

        <!-- Diamond 1: Repeated >3 times? -->
        <polygon points="500,192 600,240 500,288 400,240" fill="#ffffff" stroke="#17152b" stroke-width="1"/>
        <text x="500" y="238" fill="#17152b" font-size="12" font-weight="500" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="middle">처리 대상</text>
        <text x="500" y="252" fill="#17152b" font-size="12" font-weight="500" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="middle">민원인가?</text>

        <!-- End oval: One-off -->
        <rect x="720" y="216" width="160" height="48" rx="24" fill="rgba(23,21,43,0.03)" stroke="rgba(23,21,43,0.30)" stroke-width="1"/>
        <text x="800" y="240" fill="#17152b" font-size="12" font-weight="600" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="middle">즉시 종결</text>
        <text x="800" y="254" fill="#68657b" font-size="12" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="middle" font-weight="400">안내 후 종결</text>

        <!-- Diamond 2: Reusable across projects? -->
        <polygon points="500,328 600,376 500,424 400,376" fill="#ffffff" stroke="#17152b" stroke-width="1"/>
        <text x="500" y="374" fill="#17152b" font-size="12" font-weight="500" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="middle">소관 부서</text>
        <text x="500" y="388" fill="#17152b" font-size="12" font-weight="500" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="middle">업무인가?</text>

        <!-- End oval: CLAUDE.md note -->
        <rect x="720" y="352" width="160" height="48" rx="24" fill="rgba(23,21,43,0.03)" stroke="rgba(23,21,43,0.30)" stroke-width="1"/>
        <text x="800" y="376" fill="#17152b" font-size="12" font-weight="600" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="middle">타 기관 이송</text>
        <text x="800" y="390" fill="#68657b" font-size="12" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="middle" font-weight="400">이송 통보</text>

        <!-- End oval: Write a skill (coral focal) -->
        <rect x="420" y="464" width="160" height="56" rx="28" fill="rgba(47,111,219,0.08)" stroke="#2f6fdb" stroke-width="1"/>
        <text x="500" y="492" fill="#17152b" font-size="12" font-weight="600" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="middle">부서 처리</text>
        <text x="500" y="508" fill="#68657b" font-size="12" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="middle" font-weight="400">14일 이내 회신</text>

        <!-- Legend -->
        <line x1="40" y1="540" x2="960" y2="540" stroke="rgba(23,21,43,0.10)" stroke-width="0.8"/>
        <text x="40" y="556" fill="#68657b" font-size="12" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" font-weight="500">범례 · 도형으로 유형 구분</text>

        <rect x="40" y="572" width="24" height="12" rx="6" fill="rgba(23,21,43,0.03)" stroke="rgba(23,21,43,0.30)" stroke-width="1"/>
        <text x="72" y="582" fill="#68657b" font-size="12" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" font-weight="500">시작·종료 (타원)</text>

        <rect x="220" y="572" width="24" height="12" rx="2" fill="#ffffff" stroke="#17152b" stroke-width="1"/>
        <text x="252" y="582" fill="#68657b" font-size="12" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" font-weight="500">단계 (사각형)</text>

        <polygon points="412,578 424,572 436,578 424,584" fill="#ffffff" stroke="#17152b" stroke-width="1"/>
        <text x="448" y="582" fill="#68657b" font-size="12" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" font-weight="500">판단 (마름모)</text>

        <line x1="604" y1="580" x2="632" y2="580" stroke="#2f6fdb" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <text x="640" y="582" fill="#68657b" font-size="12" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" font-weight="500">주 경로</text>

        <line x1="768" y1="580" x2="796" y2="580" stroke="#68657b" stroke-width="1.2" marker-end="url(#arrow)"/>
        <text x="804" y="582" fill="#68657b" font-size="12" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" font-weight="500">분기</text>
      </svg>
  </div>
</body>
</html>
