<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>체험판에서 유료 전환까지 첫 주</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #ffffff;
      --color-ink:     #17152b;
      --color-muted:   #68657b;
      --color-accent:  #2f6fdb;
      --font-sans:     'Geist', 'Pretendard', 'Noto Sans KR', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1280px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 960px; display: block; }
      /* mega: Korean h1 is set in sans */
    h1 { font-family: var(--font-sans); font-weight: 700; letter-spacing: -0.03em; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">User journey · mega-diagram</p>
    <h1>체험판에서 유료 전환까지 첫 주</h1>

    <svg viewBox="0 0 1200 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="journey-title journey-desc">
      <title id="journey-title">체험판에서 유료 전환까지 첫 주</title>
      <desc id="journey-desc">협업 도구 체험판 신규 사용자의 다섯 단계 여정과 행동, 접점, 감정 곡선을 보여 주며 사용 한도 단계에서 만족도가 떨어졌다가 유료 전환 후 회복되는 사용자 여정 지도.</desc>


      <!-- Stage headers -->
      <text x="164"  y="40" fill="#68657b" font-size="12" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="middle" font-weight="500">1단계</text>
      <text x="164"  y="60" fill="#17152b" font-size="12" font-weight="600" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="middle">가입</text>

      <text x="388"  y="40" fill="#68657b" font-size="12" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="middle" font-weight="500">2단계</text>
      <text x="388"  y="60" fill="#17152b" font-size="12" font-weight="600" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="middle">첫 사용</text>

      <text x="612"  y="40" fill="#68657b" font-size="12" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="middle" font-weight="500">3단계</text>
      <text x="612"  y="60" fill="#17152b" font-size="12" font-weight="600" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="middle">팀원 초대</text>

      <text x="836"  y="40" fill="#68657b" font-size="12" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="middle" font-weight="500">4단계</text>
      <text x="836"  y="60" fill="#17152b" font-size="12" font-weight="600" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="middle">한도 도달</text>

      <text x="1060" y="40" fill="#68657b" font-size="12" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="middle" font-weight="500">5단계</text>
      <text x="1060" y="60" fill="#17152b" font-size="12" font-weight="600" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="middle">유료 전환</text>

      <!-- Sentiment band: reference hairlines -->
      <line x1="64" y1="100" x2="1160" y2="100" stroke="rgba(23,21,43,0.10)" stroke-width="0.8"/>
      <line x1="64" y1="180" x2="1160" y2="180" stroke="rgba(23,21,43,0.10)" stroke-width="0.8"/>
      <line x1="64" y1="260" x2="1160" y2="260" stroke="rgba(23,21,43,0.10)" stroke-width="0.8"/>
      <text x="56" y="104" fill="#68657b" font-size="12" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="end" font-weight="500">높음</text>
      <text x="56" y="184" fill="#68657b" font-size="12" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="end" font-weight="500">보통</text>
      <text x="56" y="264" fill="#68657b" font-size="12" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="end" font-weight="500">낮음</text>

      <!-- Sentiment curve (data curve — not a connector, §6 rule 1 exempt) -->
      <polyline points="164,100 388,180 612,100" fill="none" stroke="#68657b" stroke-width="1.5" stroke-linejoin="round"/>
      <polyline points="612,100 836,260" fill="none" stroke="#2f6fdb" stroke-width="1.5" stroke-linejoin="round"/>
      <polyline points="836,260 1060,180" fill="none" stroke="#68657b" stroke-width="1.5" stroke-linejoin="round"/>

      <circle cx="164"  cy="100" r="5" fill="#68657b"/>
      <circle cx="388"  cy="180" r="5" fill="#68657b"/>
      <circle cx="612"  cy="100" r="5" fill="#68657b"/>
      <circle cx="836"  cy="260" r="5" fill="#2f6fdb"/>
      <circle cx="1060" cy="180" r="5" fill="#68657b"/>

      <!-- Row separators (full plot width) -->
      <line x1="64" y1="280" x2="1160" y2="280" stroke="rgba(23,21,43,0.10)" stroke-width="0.8"/>
      <line x1="64" y1="376" x2="1160" y2="376" stroke="rgba(23,21,43,0.10)" stroke-width="0.8"/>

      <!-- Row labels -->
      <text x="56" y="328" fill="#68657b" font-size="12" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="end" font-weight="500">행동</text>
      <text x="72" y="408" fill="#68657b" font-size="12" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="end" font-weight="500">접점</text>

      <!-- Actions -->
      <text x="164"  y="300" fill="#17152b" font-size="12" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="middle">워크스페이스 생성</text>
      <text x="388"  y="300" fill="#17152b" font-size="12" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="middle">첫 데이터 가져오기</text>
      <text x="612"  y="300" fill="#17152b" font-size="12" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="middle">팀원 3명 추가</text>
      <text x="836"  y="300" fill="#17152b" font-size="12" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="middle">보고서 작성 중 내보내기 차단</text>
      <text x="1060" y="300" fill="#17152b" font-size="12" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="middle">연간 요금제 선택</text>

      <!-- Pain markers (Hit the limit only) -->
      <rect x="744" y="312" width="184" height="16" rx="2" fill="rgba(47,111,219,0.08)" stroke="rgba(47,111,219,0.50)" stroke-width="0.8" stroke-dasharray="3,3"/>
      <text x="836" y="325" fill="#2f6fdb" font-size="12" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="middle" font-weight="500">80% 도달 시 경고 없음</text>

      <rect x="744" y="332" width="184" height="16" rx="2" fill="rgba(47,111,219,0.08)" stroke="rgba(47,111,219,0.50)" stroke-width="0.8" stroke-dasharray="3,3"/>
      <text x="836" y="345" fill="#2f6fdb" font-size="12" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="middle" font-weight="500">요금제 화면까지 3번 클릭</text>

      <!-- Touchpoints -->
      <text x="164"  y="412" fill="#68657b" font-size="12" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="middle" font-weight="500">가입 양식</text>
      <text x="388"  y="412" fill="#68657b" font-size="12" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="middle" font-weight="500">온보딩 안내</text>
      <text x="612"  y="412" fill="#68657b" font-size="12" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="middle" font-weight="500">초대 메일</text>
      <text x="836"  y="412" fill="#68657b" font-size="12" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="middle" font-weight="500">앱 내 팝업</text>
      <text x="1060" y="412" fill="#68657b" font-size="12" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="middle" font-weight="500">결제 화면</text>

      <!-- Legend -->
      <line x1="40" y1="464" x2="1160" y2="464" stroke="rgba(23,21,43,0.10)" stroke-width="0.8"/>
      <text x="40" y="480" fill="#68657b" font-size="12" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" font-weight="500">범례</text>

      <line x1="40" y1="496" x2="56" y2="496" stroke="#68657b" stroke-width="1.5"/>
      <circle cx="48" cy="496" r="3" fill="#68657b"/>
      <text x="64" y="500" fill="#68657b" font-size="12" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" font-weight="500">감정 곡선</text>

      <line x1="220" y1="496" x2="236" y2="496" stroke="#2f6fdb" stroke-width="1.5"/>
      <circle cx="228" cy="496" r="3" fill="#2f6fdb"/>
      <text x="244" y="500" fill="#68657b" font-size="12" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" font-weight="500">최저 단계</text>

      <rect x="384" y="492" width="16" height="8" rx="2" fill="rgba(47,111,219,0.08)" stroke="rgba(47,111,219,0.50)" stroke-width="0.8" stroke-dasharray="3,3"/>
      <text x="408" y="500" fill="#68657b" font-size="12" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" font-weight="500">불편 지점</text>
    </svg>
  </div>
</body>
</html>
