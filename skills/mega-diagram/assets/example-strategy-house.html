<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2030 공공서비스 디지털 전략 체계</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #ffffff;   /* paper */
      --color-ink:     #17152b;   /* mega ink */
      --color-muted:   #68657b;   /* mega muted */
      --color-accent:  #2f6fdb;   /* mega-diagram blue */
      --font-sans:     'Geist', 'Pretendard', 'Noto Sans KR', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-sans);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Strategy house · mega-diagram</p>
    <h1>2030 공공서비스 디지털 전략 체계</h1>

    <svg viewBox="0 0 1000 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="strategy-house-title strategy-house-desc">
      <title id="strategy-house-title">2030 공공서비스 디지털 전략 체계</title>
      <desc id="strategy-house-desc">비전 ‘데이터로 여는 모두의 공공서비스’ 아래 민원 처리 기간 30% 단축 등 목표 3개와 추진 전략 4개·전략별 과제 3개, 공통 추진 기반을 정리한 전략 체계도로, 데이터 개방·활용 전략을 핵심으로 강조한다.</desc>
      <!-- No connectors: tier order carries the hierarchy (비전 → 목표 → 전략 → 과제 → 기반). -->

      <!-- Tier labels (left margin) -->
      <text x="32" y="72" fill="#68657b" font-size="12" font-weight="500" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">비전</text>
      <text x="32" y="156" fill="#68657b" font-size="12" font-weight="500" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">목표</text>
      <text x="32" y="236" fill="#68657b" font-size="12" font-weight="500" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">추진 전략</text>
      <text x="32" y="314" fill="#68657b" font-size="12" font-weight="500" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">추진 과제</text>
      <text x="32" y="416" fill="#68657b" font-size="12" font-weight="500" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">기반</text>

      <!-- 비전 banner (FOCAL 1) -->
      <rect x="120" y="40" width="840" height="56" rx="6" fill="rgba(47,111,219,0.08)" stroke="#2f6fdb" stroke-width="1"/>
      <text x="540" y="74" fill="#17152b" font-size="16" font-weight="600" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="middle">데이터로 여는 모두의 공공서비스</text>
      <text x="944" y="72" fill="#2f6fdb" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.08em">2026~2030</text>

      <!-- 목표: 3 × 264, gap 24 -->
      <rect x="120" y="120" width="264" height="64" rx="6" fill="#ffffff" stroke="#17152b" stroke-width="1"/>
      <text x="136" y="162" fill="#17152b" font-size="28" font-weight="600" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">−30%</text>
      <text x="232" y="146" fill="#17152b" font-size="14" font-weight="600" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">민원 처리 기간</text>
      <text x="232" y="166" fill="#68657b" font-size="12" font-weight="500" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">현재 20일, 목표 14일</text>
      <rect x="408" y="120" width="264" height="64" rx="6" fill="#ffffff" stroke="#17152b" stroke-width="1"/>
      <text x="424" y="162" fill="#17152b" font-size="28" font-weight="600" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">85%</text>
      <text x="520" y="146" fill="#17152b" font-size="14" font-weight="600" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">공공데이터 개방률</text>
      <text x="520" y="166" fill="#68657b" font-size="12" font-weight="500" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">현재 62%, 2030년</text>
      <rect x="696" y="120" width="264" height="64" rx="6" fill="#ffffff" stroke="#17152b" stroke-width="1"/>
      <text x="712" y="162" fill="#17152b" font-size="28" font-weight="600" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">−15%</text>
      <text x="808" y="146" fill="#17152b" font-size="14" font-weight="600" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">행정 운영비</text>
      <text x="808" y="166" fill="#68657b" font-size="12" font-weight="500" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">2025년 대비</text>

      <!-- 추진 전략: 4 pillars × 192, gap 24; header 48 + 3 task rows × 36 -->
      <!-- S1 -->
      <rect x="120" y="208" width="192" height="156" rx="6" fill="rgba(23,21,43,0.03)" stroke="rgba(23,21,43,0.30)" stroke-width="1"/>
      <rect x="132" y="226" width="20" height="12" rx="2" fill="transparent" stroke="rgba(23,21,43,0.40)" stroke-width="0.8"/>
      <text x="142" y="235" fill="#68657b" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">S1</text>
      <text x="160" y="237" fill="#17152b" font-size="14" font-weight="600" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">민원 서비스 혁신</text>
      <line x1="120" y1="256" x2="312" y2="256" stroke="rgba(23,21,43,0.12)" stroke-width="1"/>
      <text x="136" y="278" fill="#8a879c" font-size="9" font-family="'Geist Mono', monospace">1-1</text>
      <text x="160" y="278" fill="#17152b" font-size="12" font-weight="600" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">원스톱 민원 창구</text>
      <line x1="132" y1="292" x2="300" y2="292" stroke="rgba(23,21,43,0.12)" stroke-width="0.8"/>
      <text x="136" y="314" fill="#8a879c" font-size="9" font-family="'Geist Mono', monospace">1-2</text>
      <text x="160" y="314" fill="#17152b" font-size="12" font-weight="600" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">모바일 전자증명</text>
      <line x1="132" y1="328" x2="300" y2="328" stroke="rgba(23,21,43,0.12)" stroke-width="0.8"/>
      <text x="136" y="350" fill="#8a879c" font-size="9" font-family="'Geist Mono', monospace">1-3</text>
      <text x="160" y="350" fill="#17152b" font-size="12" font-weight="600" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">민원 진행 알림</text>
      <!-- S2 (FOCAL 2) -->
      <rect x="336" y="208" width="192" height="156" rx="6" fill="rgba(47,111,219,0.08)" stroke="#2f6fdb" stroke-width="1"/>
      <rect x="348" y="226" width="20" height="12" rx="2" fill="transparent" stroke="rgba(47,111,219,0.50)" stroke-width="0.8"/>
      <text x="358" y="235" fill="#2f6fdb" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">S2</text>
      <text x="376" y="237" fill="#17152b" font-size="14" font-weight="600" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">데이터 개방·활용</text>
      <line x1="336" y1="256" x2="528" y2="256" stroke="#2f6fdb" stroke-width="1"/>
      <text x="352" y="278" fill="#8a879c" font-size="9" font-family="'Geist Mono', monospace">2-1</text>
      <text x="376" y="278" fill="#17152b" font-size="12" font-weight="600" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">핵심 데이터 전면 개방</text>
      <line x1="348" y1="292" x2="516" y2="292" stroke="rgba(23,21,43,0.12)" stroke-width="0.8"/>
      <text x="352" y="314" fill="#8a879c" font-size="9" font-family="'Geist Mono', monospace">2-2</text>
      <text x="376" y="314" fill="#17152b" font-size="12" font-weight="600" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">기관 간 데이터 연계</text>
      <line x1="348" y1="328" x2="516" y2="328" stroke="rgba(23,21,43,0.12)" stroke-width="0.8"/>
      <text x="352" y="350" fill="#8a879c" font-size="9" font-family="'Geist Mono', monospace">2-3</text>
      <text x="376" y="350" fill="#17152b" font-size="12" font-weight="600" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">민간 활용 지원</text>
      <!-- S3 -->
      <rect x="552" y="208" width="192" height="156" rx="6" fill="rgba(23,21,43,0.03)" stroke="rgba(23,21,43,0.30)" stroke-width="1"/>
      <rect x="564" y="226" width="20" height="12" rx="2" fill="transparent" stroke="rgba(23,21,43,0.40)" stroke-width="0.8"/>
      <text x="574" y="235" fill="#68657b" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">S3</text>
      <text x="592" y="237" fill="#17152b" font-size="14" font-weight="600" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">지능형 행정 전환</text>
      <line x1="552" y1="256" x2="744" y2="256" stroke="rgba(23,21,43,0.12)" stroke-width="1"/>
      <text x="568" y="278" fill="#8a879c" font-size="9" font-family="'Geist Mono', monospace">3-1</text>
      <text x="592" y="278" fill="#17152b" font-size="12" font-weight="600" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">AI 민원 상담</text>
      <line x1="564" y1="292" x2="732" y2="292" stroke="rgba(23,21,43,0.12)" stroke-width="0.8"/>
      <text x="568" y="314" fill="#8a879c" font-size="9" font-family="'Geist Mono', monospace">3-2</text>
      <text x="592" y="314" fill="#17152b" font-size="12" font-weight="600" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">반복 업무 자동화</text>
      <line x1="564" y1="328" x2="732" y2="328" stroke="rgba(23,21,43,0.12)" stroke-width="0.8"/>
      <text x="568" y="350" fill="#8a879c" font-size="9" font-family="'Geist Mono', monospace">3-3</text>
      <text x="592" y="350" fill="#17152b" font-size="12" font-weight="600" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">예측 기반 정책</text>
      <!-- S4 -->
      <rect x="768" y="208" width="192" height="156" rx="6" fill="rgba(23,21,43,0.03)" stroke="rgba(23,21,43,0.30)" stroke-width="1"/>
      <rect x="780" y="226" width="20" height="12" rx="2" fill="transparent" stroke="rgba(23,21,43,0.40)" stroke-width="0.8"/>
      <text x="790" y="235" fill="#68657b" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">S4</text>
      <text x="808" y="237" fill="#17152b" font-size="14" font-weight="600" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">디지털 포용 확대</text>
      <line x1="768" y1="256" x2="960" y2="256" stroke="rgba(23,21,43,0.12)" stroke-width="1"/>
      <text x="784" y="278" fill="#8a879c" font-size="9" font-family="'Geist Mono', monospace">4-1</text>
      <text x="808" y="278" fill="#17152b" font-size="12" font-weight="600" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">고령층 디지털 교육</text>
      <line x1="780" y1="292" x2="948" y2="292" stroke="rgba(23,21,43,0.12)" stroke-width="0.8"/>
      <text x="784" y="314" fill="#8a879c" font-size="9" font-family="'Geist Mono', monospace">4-2</text>
      <text x="808" y="314" fill="#17152b" font-size="12" font-weight="600" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">쉬운 화면 표준</text>
      <line x1="780" y1="328" x2="948" y2="328" stroke="rgba(23,21,43,0.12)" stroke-width="0.8"/>
      <text x="784" y="350" fill="#8a879c" font-size="9" font-family="'Geist Mono', monospace">4-3</text>
      <text x="808" y="350" fill="#17152b" font-size="12" font-weight="600" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">취약계층 대면 지원</text>

      <!-- 기반: full-width store bar; dividers sit in the pillar gutters -->
      <rect x="120" y="388" width="840" height="48" rx="6" fill="rgba(23,21,43,0.05)" stroke="#68657b" stroke-width="1"/>
      <line x1="324" y1="400" x2="324" y2="424" stroke="rgba(23,21,43,0.12)" stroke-width="1"/>
      <line x1="540" y1="400" x2="540" y2="424" stroke="rgba(23,21,43,0.12)" stroke-width="1"/>
      <line x1="756" y1="400" x2="756" y2="424" stroke="rgba(23,21,43,0.12)" stroke-width="1"/>
      <text x="216" y="416" fill="#17152b" font-size="12" font-weight="600" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="middle">추진 거버넌스</text>
      <text x="432" y="416" fill="#17152b" font-size="12" font-weight="600" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="middle">데이터 품질 관리</text>
      <text x="648" y="416" fill="#17152b" font-size="12" font-weight="600" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="middle">정보보호 체계</text>
      <text x="864" y="416" fill="#17152b" font-size="12" font-weight="600" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="middle">디지털 전문 인력</text>

      <!-- Legend strip -->
      <line x1="32" y1="468" x2="960" y2="468" stroke="rgba(23,21,43,0.10)" stroke-width="0.8"/>
      <text x="32" y="496" fill="#68657b" font-size="12" font-weight="500" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">범례</text>
      <rect x="120" y="486" width="14" height="10" rx="2" fill="rgba(47,111,219,0.08)" stroke="#2f6fdb" stroke-width="1"/>
      <text x="142" y="496" fill="#68657b" font-size="12" font-weight="500" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">비전·핵심 전략</text>
      <rect x="280" y="486" width="14" height="10" rx="2" fill="rgba(23,21,43,0.05)" stroke="#68657b" stroke-width="1"/>
      <text x="302" y="496" fill="#68657b" font-size="12" font-weight="500" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">공통 추진 기반</text>
    </svg>
  </div>
</body>
</html>
