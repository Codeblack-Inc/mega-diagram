<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>사내 소식지 발행 상태</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --color-paper:#ffffff; --color-ink:#17152b; --color-muted:#68657b; --color-accent:#2f6fdb; --font-sans:'Geist', 'Pretendard', 'Noto Sans KR', system-ui, sans-serif; --font-serif:'Instrument Serif',serif; --font-mono:'Geist Mono',ui-monospace,monospace; }
    body { font-family:var(--font-sans); background:var(--color-paper); color:var(--color-ink); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:3rem 2rem; }
    .frame { max-width:1200px; width:100%; overflow-x:auto; }
    .eyebrow { font-family:var(--font-mono); font-size:0.66rem; font-weight:500; letter-spacing:0.18em; text-transform:uppercase; color:var(--color-muted); margin-bottom:0.5rem; }
    h1 { font-family:var(--font-serif); font-size:clamp(1.5rem,2.4vw + 0.75rem,2rem); font-weight:400; letter-spacing:-0.02em; line-height:1.15; color:var(--color-ink); margin-bottom:1.5rem; }
    svg { width:100%; min-width:900px; display:block; }
    svg text { font-family:'Geist','Pretendard','Noto Sans KR',sans-serif; }
      /* mega: Korean h1 is set in sans */
    h1 { font-family: var(--font-sans); font-weight: 700; letter-spacing: -0.03em; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">State · Lifecycle phase map</p>
    <h1>사내 소식지 발행 상태</h1>

    <svg viewBox="0 0 1000 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="state-lifecycle-title state-lifecycle-desc">
      <title id="state-lifecycle-title">사내 소식지 발행 상태</title>
      <desc id="state-lifecycle-desc">사내 소식지가 초안, 편집, 발송 예약, 발송 중, 발송 완료로 이어지고 승인 대기와 재발송은 복구 구간에, 취소와 실패는 종료 결과로 표시한 상태 단계도.</desc>
      <defs>
        <pattern id="lifecycle-dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.9" fill="rgba(23,21,43,0.10)"/></pattern>
        <marker id="lifecycle-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#68657b"/></marker>
        <marker id="lifecycle-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#2f6fdb"/></marker>
      </defs>

      <rect x="24" y="44" width="952" height="120" rx="8" fill="rgba(104,101,123,0.035)" stroke="rgba(23,21,43,0.12)"/>
      <rect x="24" y="400" width="952" height="104" rx="8" fill="rgba(23,21,43,0.035)" stroke="rgba(23,21,43,0.12)"/>
      <text x="40" y="64" fill="#68657b" font-size="12" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" font-weight="500">대기·복구</text>
      <text x="40" y="208" fill="#68657b" font-size="12" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" font-weight="500">주요 단계</text>
      <text x="40" y="420" fill="#68657b" font-size="12" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" font-weight="500">종료 결과</text>

      <!-- Ten labeled transitions, drawn before states. -->
      <line x1="40" y1="256" x2="64" y2="256" stroke="#68657b" stroke-width="1.2" marker-end="url(#lifecycle-arrow)"/>
      <line x1="214" y1="256" x2="244" y2="256" stroke="#68657b" stroke-width="1.2" marker-end="url(#lifecycle-arrow)"/>
      <path d="M319 220 V176 H369 V140" fill="none" stroke="#68657b" stroke-width="1.2" marker-end="url(#lifecycle-arrow)"/>
      <path d="M449 140 V176 H499 V220" fill="none" stroke="#68657b" stroke-width="1.2" marker-end="url(#lifecycle-arrow)"/>
      <line x1="574" y1="256" x2="604" y2="256" stroke="#68657b" stroke-width="1.2" marker-end="url(#lifecycle-arrow)"/>
      <line x1="754" y1="256" x2="800" y2="256" stroke="#2f6fdb" stroke-width="1.4" marker-end="url(#lifecycle-arrow-accent)"/>
      <path d="M649 220 V176 H639 V140" fill="none" stroke="#68657b" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#lifecycle-arrow)"/>
      <path d="M719 140 V188 H709 V220" fill="none" stroke="#68657b" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#lifecycle-arrow)"/>
      <path d="M499 292 V416" fill="none" stroke="#68657b" stroke-width="1.2" marker-end="url(#lifecycle-arrow)"/>
      <path d="M604 104 H584 V380 H749 V416" fill="none" stroke="#68657b" stroke-width="1.2" marker-end="url(#lifecycle-arrow)"/>

      <!-- Opaque masks keep every transition label clear of its stroke. -->
      <g font-family="'Geist Mono',monospace" font-size="7" text-anchor="middle" letter-spacing="0.08em" fill="#68657b">
        <rect x="30" y="232" width="32" height="16" rx="2" fill="#ffffff"/><text x="46" y="244" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" font-size="12" font-weight="500">생성</text>
        <rect x="215" y="236" width="28" height="16" rx="2" fill="#ffffff"/><text x="229" y="248" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" font-size="12" font-weight="500">작성</text>
        <rect x="334" y="156" width="32" height="16" rx="2" fill="#ffffff"/><text x="350" y="168" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" font-size="12" font-weight="500">상신</text>
        <rect x="460" y="156" width="32" height="16" rx="2" fill="#ffffff"/><text x="476" y="168" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" font-size="12" font-weight="500">승인</text>
        <rect x="575" y="236" width="28" height="16" rx="2" fill="#ffffff"/><text x="589" y="248" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" font-size="12" font-weight="500">시작</text>
        <rect x="761" y="236" width="32" height="16" rx="2" fill="#ffffff"/><text x="777" y="248" fill="#2f6fdb" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" font-size="12" font-weight="500">전달</text>
        <rect x="627" y="156" width="32" height="16" rx="2" fill="#ffffff"/><text x="643" y="168" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" font-size="12" font-weight="500">오류</text>
        <rect x="699" y="178" width="44" height="16" rx="2" fill="#ffffff"/><text x="721" y="190" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" font-size="12" font-weight="500">재시도</text>
        <rect x="484" y="348" width="32" height="16" rx="2" fill="#ffffff"/><text x="500" y="360" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" font-size="12" font-weight="500">취소</text>
        <rect x="605" y="360" width="32" height="16" rx="2" fill="#ffffff"/><text x="621" y="372" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" font-size="12" font-weight="500">소진</text>
      </g>

      <circle cx="34" cy="256" r="6" fill="#17152b"/>

      <!-- Primary rail: five phases. -->
      <g font-family="'Geist',sans-serif" text-anchor="middle">
        <g><rect x="64" y="220" width="150" height="72" rx="8" fill="#fff" stroke="#17152b"/><text x="139" y="251" fill="#17152b" font-size="12" font-weight="600" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">초안</text><text x="139" y="270" fill="#68657b" font-size="12" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" font-weight="400">원고 작성됨</text></g>
        <g><rect x="244" y="220" width="150" height="72" rx="8" fill="#fff" stroke="#17152b"/><text x="319" y="251" fill="#17152b" font-size="12" font-weight="600" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">편집</text><text x="319" y="270" fill="#68657b" font-size="12" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" font-weight="400">담당자 수정</text></g>
        <g><rect x="424" y="220" width="150" height="72" rx="8" fill="#fff" stroke="#17152b"/><text x="499" y="251" fill="#17152b" font-size="12" font-weight="600" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">발송 예약</text><text x="499" y="270" fill="#68657b" font-size="12" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" font-weight="400">발송 시각 확정</text></g>
        <g><rect x="604" y="220" width="150" height="72" rx="8" fill="#fff" stroke="#17152b"/><text x="679" y="251" fill="#17152b" font-size="12" font-weight="600" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">발송 중</text><text x="679" y="270" fill="#68657b" font-size="12" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" font-weight="400">대행사 처리 중</text></g>
        <g><rect x="800" y="220" width="150" height="72" rx="8" fill="rgba(47,111,219,0.08)" stroke="#2f6fdb"/><circle cx="824" cy="244" r="7" fill="none" stroke="#2f6fdb"/><circle cx="824" cy="244" r="4" fill="#2f6fdb"/><text x="875" y="251" fill="#17152b" font-size="12" font-weight="600" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">발송 완료</text><text x="875" y="270" fill="#68657b" font-size="12" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" font-weight="400">전달 완료</text></g>
      </g>

      <!-- Supporting states. -->
      <g text-anchor="middle">
        <g><rect x="334" y="68" width="150" height="72" rx="8" fill="#ffffff" stroke="#68657b" stroke-dasharray="5,4"/><rect x="344" y="78" width="34" height="12" rx="2" fill="none" stroke="rgba(104,101,123,0.45)"/><text x="361" y="87" fill="#68657b" font-size="7" font-family="'Geist Mono',monospace">WAIT</text><text x="409" y="111" fill="#17152b" font-size="12" font-weight="600" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">승인 대기</text><text x="409" y="126" fill="#68657b" font-size="12" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" font-weight="400">편집장 결정</text></g>
        <g><rect x="604" y="68" width="150" height="72" rx="8" fill="#ffffff" stroke="#68657b" stroke-dasharray="5,4"/><rect x="614" y="78" width="52" height="12" rx="2" fill="none" stroke="rgba(104,101,123,0.45)"/><text x="640" y="87" fill="#68657b" font-size="7" font-family="'Geist Mono',monospace">RECOVERY</text><text x="679" y="111" fill="#17152b" font-size="12" font-weight="600" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">재발송</text><text x="679" y="126" fill="#68657b" font-size="12" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" font-weight="400">3회 중 1회차</text></g>
      </g>

      <!-- Terminal outcomes use text, shape, and dash differences. -->
      <g text-anchor="middle">
        <g><rect x="424" y="416" width="150" height="72" rx="8" fill="rgba(23,21,43,0.04)" stroke="#68657b"/><rect x="434" y="426" width="54" height="12" rx="2" fill="none" stroke="rgba(104,101,123,0.45)"/><text x="461" y="435" fill="#68657b" font-size="7" font-family="'Geist Mono',monospace">TERMINAL</text><text x="499" y="459" fill="#17152b" font-size="12" font-weight="600" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">취소</text><text x="499" y="474" fill="#68657b" font-size="12" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" font-weight="400">담당자 중단</text></g>
        <g><rect x="674" y="416" width="150" height="72" rx="8" fill="rgba(23,21,43,0.04)" stroke="#68657b" stroke-width="1.5" stroke-dasharray="3,3"/><rect x="684" y="426" width="54" height="12" rx="2" fill="none" stroke="rgba(104,101,123,0.45)"/><text x="711" y="435" fill="#68657b" font-size="7" font-family="'Geist Mono',monospace">TERMINAL</text><text x="749" y="459" fill="#17152b" font-size="12" font-weight="600" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">실패</text><text x="749" y="474" fill="#68657b" font-size="12" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" font-weight="400">재시도 소진</text></g>
      </g>
    </svg>
  </div>
</body>
</html>
