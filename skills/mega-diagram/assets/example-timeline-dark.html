<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>사업 추진 경과 · 타임라인</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #17152b;
      --color-ink:     #f6f5fa;
      --color-muted:   #d4d2de;
      --color-accent:  #6e9bea;
      --font-sans:     'Geist', 'Pretendard', 'Noto Sans KR', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
    /* mega: Korean h1 is set in sans */
    h1 { font-family: var(--font-sans); font-weight: 700; letter-spacing: -0.03em; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Timeline · mega-diagram</p>
    <h1>사업 추진 경과 · 14개월</h1>

    <svg viewBox="0 0 1000 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="timeline-dark-title timeline-dark-desc">
      <title id="timeline-dark-title">사업 추진 경과 · 14개월</title>
      <desc id="timeline-dark-desc">2025년 2월 사업 착수부터 기본계획 수립, 시범 서비스, 중간 평가를 거쳐 2026년 4월 본사업 전환까지 사업 추진 경과를 보여 주는 타임라인.</desc>
        <defs>
          <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r="0.9" fill="rgba(246,245,250,0.10)"/>
          </pattern>
        </defs>


        <!-- Year markers (background) -->
        <text x="60" y="340" fill="rgba(246,245,250,0.06)" font-size="72" font-weight="600" font-family="'Geist Mono', monospace">2025</text>
        <text x="700" y="340" fill="rgba(246,245,250,0.06)" font-size="72" font-weight="600" font-family="'Geist Mono', monospace">2026</text>

        <!-- Baseline -->
        <line x1="80" y1="240" x2="920" y2="240" stroke="rgba(150,146,138,0.45)" stroke-width="1"/>

        <!-- Year boundary tick (between 2025 and 2026) -->
        <line x1="680" y1="232" x2="680" y2="248" stroke="rgba(246,245,250,0.20)" stroke-width="1"/>
        <text x="680" y="260" fill="#9d9ab0" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">2026.01</text>

        <!-- Start / end caps -->
        <line x1="80" y1="232" x2="80" y2="248" stroke="rgba(246,245,250,0.20)" stroke-width="1"/>
        <line x1="920" y1="232" x2="920" y2="248" stroke="rgba(246,245,250,0.20)" stroke-width="1"/>

        <!-- Event 1: FEB 2025 · First post (below) -->
        <line x1="100" y1="240" x2="100" y2="296" stroke="rgba(246,245,250,0.30)" stroke-width="1"/>
        <circle cx="100" cy="240" r="4" fill="#f6f5fa"/>
        <text x="100" y="312" fill="#d4d2de" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">2025.02</text>
        <text x="100" y="328" fill="#f6f5fa" font-size="12" font-weight="600" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="middle">사업 착수</text>

        <!-- Event 2: APR 2025 · Design v1 (above) -->
        <line x1="240" y1="184" x2="240" y2="240" stroke="rgba(246,245,250,0.30)" stroke-width="1"/>
        <circle cx="240" cy="240" r="4" fill="#f6f5fa"/>
        <text x="240" y="156" fill="#d4d2de" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">2025.04</text>
        <text x="240" y="172" fill="#f6f5fa" font-size="12" font-weight="600" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="middle">기본계획 수립</text>

        <!-- Event 3: SEP 2025 · Design v2 (below) -->
        <line x1="500" y1="240" x2="500" y2="296" stroke="rgba(246,245,250,0.30)" stroke-width="1"/>
        <circle cx="500" cy="240" r="4" fill="#f6f5fa"/>
        <text x="500" y="312" fill="#d4d2de" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">2025.09</text>
        <text x="500" y="328" fill="#f6f5fa" font-size="12" font-weight="600" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="middle">시범 서비스 개시</text>
        <text x="500" y="346" fill="#d4d2de" font-size="12" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="middle" font-weight="500">3개 기관 참여</text>

        <!-- Event 4: JAN 2026 · Design v3 (above, coral major) -->
        <line x1="740" y1="160" x2="740" y2="240" stroke="#6e9bea" stroke-width="1"/>
        <circle cx="740" cy="240" r="6" fill="#6e9bea"/>
        <text x="740" y="112" fill="#6e9bea" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">2026.01</text>
        <text x="740" y="132" fill="#f6f5fa" font-size="14" font-weight="600" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="middle">중간 평가 통과</text>
        <text x="740" y="150" fill="#d4d2de" font-size="12" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="middle" font-weight="500">예산 12억 원 확보</text>

        <!-- Event 5: APR 2026 · now · mega-diagram skill (below, coral) -->
        <line x1="900" y1="240" x2="900" y2="296" stroke="#6e9bea" stroke-width="1"/>
        <circle cx="900" cy="240" r="6" fill="#6e9bea"/>
        <text x="900" y="312" fill="#6e9bea" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">2026.04</text>
        <text x="900" y="328" fill="#f6f5fa" font-size="12" font-weight="600" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="middle">본사업 전환</text>
        <text x="900" y="346" fill="#d4d2de" font-size="12" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="middle" font-weight="500">17개 시도 확산</text>

        <!-- Legend -->
        <line x1="40" y1="376" x2="960" y2="376" stroke="rgba(246,245,250,0.10)" stroke-width="0.8"/>
        <text x="40" y="392" fill="#d4d2de" font-size="12" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" font-weight="500">범례</text>

        <circle cx="52" cy="408" r="4" fill="#f6f5fa"/>
        <text x="68" y="412" fill="#d4d2de" font-size="12" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" font-weight="500">추진 사항</text>

        <circle cx="148" cy="408" r="6" fill="#6e9bea"/>
        <text x="164" y="412" fill="#d4d2de" font-size="12" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" font-weight="500">핵심 이정표</text>

        <text x="296" y="412" fill="#d4d2de" font-size="12" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" font-weight="500">간격은 실제 경과 기간에 비례</text>
      </svg>
  </div>
</body>
</html>
