<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>가온시 스마트 버스정류장 확대 사업 이해관계자 맵</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #ffffff;
      --color-ink:     #17152b;
      --color-muted:   #68657b;
      --color-accent:  #2f6fdb;
      --font-sans:     'Geist', 'Pretendard', 'Noto Sans KR', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-sans);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Stakeholder map · mega-diagram</p>
    <h1>스마트 버스정류장 확대 사업 이해관계자 맵</h1>

    <svg viewBox="0 0 1000 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="stakeholder-map-title stakeholder-map-desc">
      <title id="stakeholder-map-title">가온시 스마트 버스정류장 확대 사업 이해관계자 맵</title>
      <desc id="stakeholder-map-desc">스마트 버스정류장 확대 사업의 이해관계자 10곳을 영향력과 관심도에 따라 적극 관리, 만족 유지, 정보 제공, 모니터링 네 영역에 배치하고 버스운송사업조합을 핵심 협상 대상으로 표시한 맵.</desc>

      <!-- 적극 관리 영역: the only tinted quadrant -->
      <rect x="500" y="48" width="380" height="192" fill="rgba(47,111,219,0.04)"/>

      <!-- Axis cross -->
      <line x1="120" y1="240" x2="880" y2="240" stroke="rgba(23,21,43,0.45)" stroke-width="1"/>
      <line x1="500" y1="48" x2="500" y2="432" stroke="rgba(23,21,43,0.45)" stroke-width="1"/>

      <!-- Axis end labels -->
      <text x="512" y="60" fill="#68657b" font-size="12" font-weight="500" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">영향력 높음</text>
      <text x="512" y="428" fill="#68657b" font-size="12" font-weight="500" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">영향력 낮음</text>
      <text x="120" y="260" fill="#68657b" font-size="12" font-weight="500" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">관심도 낮음</text>
      <text x="880" y="260" fill="#68657b" font-size="12" font-weight="500" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="end">관심도 높음</text>

      <!-- Quadrant corners: 관리 전략 + one-line action -->
      <text x="864" y="72" fill="#2f6fdb" font-size="12" font-weight="600" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="end">적극 관리</text>
      <text x="864" y="90" fill="#8a879c" font-size="12" font-weight="400" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="end">정기 협의·의사결정 참여</text>
      <text x="136" y="72" fill="#17152b" font-size="12" font-weight="600" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">만족 유지</text>
      <text x="136" y="90" fill="#8a879c" font-size="12" font-weight="400" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">주요 결정 사전 보고</text>
      <text x="864" y="398" fill="#17152b" font-size="12" font-weight="600" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="end">정보 제공</text>
      <text x="864" y="416" fill="#8a879c" font-size="12" font-weight="400" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="end">설명회·소식지 정기 공유</text>
      <text x="136" y="398" fill="#17152b" font-size="12" font-weight="600" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">모니터링</text>
      <text x="136" y="416" fill="#8a879c" font-size="12" font-weight="400" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">동향 점검·최소 대응</text>

      <!-- Stakeholders: dot + name, name always right of the dot -->
      <circle cx="588" cy="184" r="4" fill="#17152b"/>
      <text x="600" y="188" fill="#68657b" font-size="12" font-weight="500" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">시의회 교통위원회</text>
      <circle cx="700" cy="128" r="6" fill="#2f6fdb"/>
      <text x="712" y="132" fill="#17152b" font-size="12" font-weight="600" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">버스운송사업조합</text>
      <circle cx="760" cy="200" r="4" fill="#17152b"/>
      <text x="772" y="204" fill="#68657b" font-size="12" font-weight="500" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">시내버스 노조</text>
      <circle cx="200" cy="144" r="4" fill="#17152b"/>
      <text x="212" y="148" fill="#68657b" font-size="12" font-weight="500" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">국토교통부</text>
      <circle cx="320" cy="196" r="4" fill="#17152b"/>
      <text x="332" y="200" fill="#68657b" font-size="12" font-weight="500" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">가온시 예산담당관</text>
      <circle cx="560" cy="296" r="4" fill="#17152b"/>
      <text x="572" y="300" fill="#68657b" font-size="12" font-weight="500" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">정류장 인근 상인회</text>
      <circle cx="680" cy="336" r="4" fill="#17152b"/>
      <text x="692" y="340" fill="#68657b" font-size="12" font-weight="500" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">시민 버스 이용자 모임</text>
      <circle cx="560" cy="376" r="4" fill="#17152b"/>
      <text x="572" y="380" fill="#68657b" font-size="12" font-weight="500" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">장애인 이동권 연대</text>
      <circle cx="220" cy="296" r="4" fill="#17152b"/>
      <text x="232" y="300" fill="#68657b" font-size="12" font-weight="500" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">지역 언론</text>
      <circle cx="340" cy="352" r="4" fill="#17152b"/>
      <text x="352" y="356" fill="#68657b" font-size="12" font-weight="500" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">개인택시조합</text>

      <!-- Legend -->
      <line x1="40" y1="464" x2="960" y2="464" stroke="rgba(23,21,43,0.12)" stroke-width="0.8"/>
      <text x="40" y="496" fill="#68657b" font-size="12" font-weight="500" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">범례</text>
      <circle cx="96" cy="490" r="6" fill="#2f6fdb"/>
      <text x="112" y="496" fill="#68657b" font-size="12" font-weight="500" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">핵심 협상 대상</text>
      <circle cx="232" cy="490" r="4" fill="#17152b"/>
      <text x="248" y="496" fill="#68657b" font-size="12" font-weight="500" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">이해관계자</text>
    </svg>
  </div>
</body>
</html>
