<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>클라우드 계정·VPC·서브넷 구조</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #ffffff;
      --color-ink:     #17152b;
      --color-muted:   #68657b;
      --color-accent:  #2f6fdb;
      --font-sans:     'Geist', 'Pretendard', 'Noto Sans KR', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-sans);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Nested · mega-diagram</p>
    <h1>클라우드 계정·VPC·서브넷 구조</h1>

    <svg viewBox="0 0 1000 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="nested-title nested-desc">
      <title id="nested-title">클라우드 계정·VPC·서브넷 구조</title>
      <desc id="nested-desc">전사 클라우드 조직부터 운영 계정, VPC, 가용 영역을 거쳐 프라이빗 서브넷의 주문 API 서버까지 상위 정책이 차례로 상속되는 중첩 구조.</desc>
        <defs>
          <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r="0.9" fill="rgba(23,21,43,0.10)"/>
          </pattern>
        </defs>


        <!-- Level 1: ~/.claude/ (global) — outermost -->
        <rect x="40" y="60" width="920" height="380" rx="8" fill="rgba(23,21,43,0.015)" stroke="rgba(23,21,43,0.30)" stroke-width="1"/>
        <!-- Level 2: ~/vault/ -->
        <rect x="72" y="96" width="856" height="308" rx="8" fill="rgba(23,21,43,0.02)" stroke="rgba(23,21,43,0.35)" stroke-width="1"/>
        <!-- Level 3: /business -->
        <rect x="104" y="132" width="792" height="236" rx="8" fill="rgba(23,21,43,0.025)" stroke="rgba(23,21,43,0.45)" stroke-width="1"/>
        <!-- Level 4: /marketing -->
        <rect x="136" y="168" width="728" height="164" rx="8" fill="rgba(23,21,43,0.03)" stroke="#68657b" stroke-width="1"/>
        <!-- Level 5: /project — innermost, coral focal -->
        <rect x="168" y="204" width="664" height="92" rx="8" fill="rgba(47,111,219,0.06)" stroke="#2f6fdb" stroke-width="1"/>

        <!-- Level labels on paper-colored masks -->
        <rect x="56" y="52" width="128" height="16" fill="#ffffff"/>
        <text x="64" y="64" fill="#68657b" font-size="12" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" font-weight="500">전사 클라우드 조직</text>

        <rect x="88" y="88" width="124" height="16" fill="#ffffff"/>
        <text x="96" y="100" fill="#68657b" font-size="12" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" font-weight="500">운영 계정 (prod)</text>

        <rect x="120" y="124" width="124" height="16" fill="#ffffff"/>
        <text x="128" y="136" fill="#68657b" font-size="12" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" font-weight="500">VPC 10.0.0.0/16</text>

        <rect x="152" y="160" width="204" height="16" fill="#ffffff"/>
        <text x="160" y="172" fill="#17152b" font-size="12" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" font-weight="500">가용 영역 ap-northeast-2a</text>

        <rect x="184" y="196" width="108" height="16" fill="#ffffff"/>
        <text x="192" y="208" fill="#2f6fdb" font-size="12" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" font-weight="600">프라이빗 서브넷</text>

        <!-- File-icon glyphs (simple rect with folded corner) inside each level -->
        <!-- Glyph in level 1 (bottom-right area of outer ring) -->
        <g transform="translate(908, 408)">
          <path d="M0 0 L16 0 L20 4 L20 20 L0 20 Z" fill="#ffffff" stroke="rgba(23,21,43,0.35)" stroke-width="1"/>
          <path d="M16 0 L16 4 L20 4" fill="none" stroke="rgba(23,21,43,0.35)" stroke-width="1"/>
        </g>
        <!-- Glyph in level 2 ring -->
        <g transform="translate(876, 372)">
          <path d="M0 0 L16 0 L20 4 L20 20 L0 20 Z" fill="#ffffff" stroke="rgba(23,21,43,0.40)" stroke-width="1"/>
          <path d="M16 0 L16 4 L20 4" fill="none" stroke="rgba(23,21,43,0.40)" stroke-width="1"/>
        </g>
        <!-- Glyph in level 3 ring -->
        <g transform="translate(844, 336)">
          <path d="M0 0 L16 0 L20 4 L20 20 L0 20 Z" fill="#ffffff" stroke="rgba(23,21,43,0.50)" stroke-width="1"/>
          <path d="M16 0 L16 4 L20 4" fill="none" stroke="rgba(23,21,43,0.50)" stroke-width="1"/>
        </g>
        <!-- Glyph in level 4 ring -->
        <g transform="translate(812, 300)">
          <path d="M0 0 L16 0 L20 4 L20 20 L0 20 Z" fill="#ffffff" stroke="#68657b" stroke-width="1"/>
          <path d="M16 0 L16 4 L20 4" fill="none" stroke="#68657b" stroke-width="1"/>
        </g>

        <!-- Innermost label — human readable -->
        <text x="500" y="248" fill="#17152b" font-size="16" font-weight="600" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="middle">주문 API 서버</text>
        <text x="500" y="272" fill="#68657b" font-size="12" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="middle" font-weight="400">상위 정책 모두 상속</text>

        <!-- Annotation top-right: italic callout with curved arrow -->
        <text x="904" y="36" fill="#17152b" font-size="12" font-weight="500" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="end">별도 연결 없이 자동 상속</text>
        <path d="M 820 44 Q 700 84 520 216" fill="none" stroke="rgba(23,21,43,0.40)" stroke-width="1" stroke-dasharray="4,3"/>
        <circle cx="520" cy="216" r="2" fill="#17152b"/>

        <!-- Annotation bottom-left: italic callout -->
        <text x="40" y="484" fill="#68657b" font-size="12" font-weight="500" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">구조가 곧 권한 범위</text>
      </svg>
  </div>
</body>
</html>
