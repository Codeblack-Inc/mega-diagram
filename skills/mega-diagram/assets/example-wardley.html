<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>민원 처리 서비스 · 워들리 맵</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #ffffff;
      --color-ink:     #17152b;
      --color-muted:   #68657b;
      --color-accent:  #2f6fdb;
      --font-sans:     'Geist', 'Pretendard', 'Noto Sans KR', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
    /* mega: Korean h1 is set in sans */
    h1 { font-family: var(--font-sans); font-weight: 700; letter-spacing: -0.03em; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Wardley map · mega-diagram</p>
    <h1>민원 처리 서비스 · 워들리 맵</h1>

    <svg viewBox="0 0 1000 460" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="wardley-title wardley-desc">
      <title id="wardley-title">민원 처리 서비스 · 워들리 맵</title>
      <desc id="wardley-desc">민원인이 체감하는 신속 처리부터 클라우드 기반까지 민원 서비스의 가치 사슬을 진화 단계 위에 놓고, 민원 자동 분류가 제품 단계로 이동 중임을 보여 주는 워들리 맵.</desc>
      <defs>
        <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
          <circle cx="1" cy="1" r="0.9" fill="rgba(23,21,43,0.10)"/>
        </pattern>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
          <polygon points="0 0, 8 3, 0 6" fill="#2f6fdb"/>
        </marker>
      </defs>


      <!-- Axis lines (value chain vertical, evolution horizontal) -->
      <line x1="120" y1="60" x2="120" y2="340" stroke="rgba(23,21,43,0.20)" stroke-width="1"/>
      <line x1="120" y1="340" x2="920" y2="340" stroke="rgba(23,21,43,0.20)" stroke-width="1"/>

      <!-- Evolution band separators -->
      <line x1="320" y1="60" x2="320" y2="340" stroke="rgba(23,21,43,0.10)" stroke-width="0.8" stroke-dasharray="4,4"/>
      <line x1="520" y1="60" x2="520" y2="340" stroke="rgba(23,21,43,0.10)" stroke-width="0.8" stroke-dasharray="4,4"/>
      <line x1="720" y1="60" x2="720" y2="340" stroke="rgba(23,21,43,0.10)" stroke-width="0.8" stroke-dasharray="4,4"/>

      <!-- Band labels -->
      <text x="220" y="358" fill="#68657b" font-size="12" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="middle" font-weight="500">기원</text>
      <text x="420" y="358" fill="#68657b" font-size="12" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="middle" font-weight="500">맞춤형</text>
      <text x="620" y="358" fill="#68657b" font-size="12" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="middle" font-weight="500">제품</text>
      <text x="820" y="358" fill="#68657b" font-size="12" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="middle" font-weight="500">범용</text>
      <text x="920" y="378" fill="#68657b" font-size="12" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="end" font-weight="500">진화 단계</text>

      <!-- Value-chain axis labels (stacked lines, never writing-mode) -->
      <text x="112" y="40" fill="#17152b" font-size="12" font-weight="500" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="end">가치 사슬</text>
      <text x="112" y="56" fill="#17152b" font-size="12" font-weight="500" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="end">사용자 접점</text>
      <text x="112" y="352" fill="#17152b" font-size="12" font-weight="500" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="end">내부 기반</text>

      <!-- Dependency links (exempt from the orthogonal-elbow rule — position is the data) -->
      <line x1="420" y1="92" x2="620" y2="124" stroke="#68657b" stroke-width="0.8"/>
      <line x1="620" y1="124" x2="420" y2="156" stroke="#68657b" stroke-width="0.8"/>
      <line x1="420" y1="156" x2="220" y2="188" stroke="#68657b" stroke-width="0.8"/>
      <line x1="420" y1="156" x2="620" y2="220" stroke="#68657b" stroke-width="0.8"/>
      <line x1="420" y1="156" x2="680" y2="252" stroke="#68657b" stroke-width="0.8"/>
      <line x1="620" y1="220" x2="820" y2="316" stroke="#68657b" stroke-width="0.8"/>
      <line x1="680" y1="252" x2="820" y2="284" stroke="#68657b" stroke-width="0.8"/>
      <line x1="220" y1="188" x2="680" y2="252" stroke="#68657b" stroke-width="0.8"/>

      <!-- Movement arrow (the 2nd accent element) -->
      <line x1="428" y1="156" x2="504" y2="156" stroke="#2f6fdb" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrow-accent)"/>

      <!-- Components -->
      <circle cx="420" cy="92" r="6" fill="#ffffff" stroke="#17152b" stroke-width="1"/>
      <text x="420" y="80" fill="#17152b" font-size="12" font-weight="600" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="middle">민원 신속 처리</text>

      <circle cx="620" cy="124" r="6" fill="#ffffff" stroke="#17152b" stroke-width="1"/>
      <text x="620" y="112" fill="#17152b" font-size="12" font-weight="600" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="middle">온라인 신청</text>

      <!-- Moving component (the 1st accent element) -->
      <circle cx="420" cy="156" r="6" fill="rgba(47,111,219,0.08)" stroke="#2f6fdb" stroke-width="1.5"/>
      <text x="420" y="144" fill="#17152b" font-size="12" font-weight="600" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="middle">민원 자동 분류</text>

      <circle cx="220" cy="188" r="6" fill="#ffffff" stroke="#17152b" stroke-width="1"/>
      <text x="220" y="176" fill="#17152b" font-size="12" font-weight="600" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="middle">답변 품질 평가</text>

      <circle cx="620" cy="220" r="6" fill="#ffffff" stroke="#17152b" stroke-width="1"/>
      <text x="620" y="208" fill="#17152b" font-size="12" font-weight="600" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="middle">민원 이력 DB</text>

      <circle cx="680" cy="252" r="6" fill="#ffffff" stroke="#17152b" stroke-width="1"/>
      <text x="692" y="244" fill="#17152b" font-size="12" font-weight="600" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="start">AI 언어 모델</text>

      <circle cx="820" cy="284" r="6" fill="#ffffff" stroke="#17152b" stroke-width="1"/>
      <text x="820" y="272" fill="#17152b" font-size="12" font-weight="600" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="middle">클라우드 서버</text>

      <circle cx="820" cy="316" r="6" fill="#ffffff" stroke="#17152b" stroke-width="1"/>
      <text x="836" y="320" fill="#17152b" font-size="12" font-weight="600" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="start">클라우드 저장소</text>

      <!-- Legend -->
      <line x1="40" y1="396" x2="960" y2="396" stroke="rgba(23,21,43,0.10)" stroke-width="0.8"/>
      <text x="40" y="412" fill="#68657b" font-size="12" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" font-weight="500">범례</text>

      <circle cx="48" cy="428" r="4" fill="#ffffff" stroke="#17152b" stroke-width="1"/>
      <text x="64" y="432" fill="#68657b" font-size="12" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" font-weight="500">구성 요소</text>

      <line x1="220" y1="428" x2="248" y2="428" stroke="#68657b" stroke-width="0.8"/>
      <text x="256" y="432" fill="#68657b" font-size="12" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" font-weight="500">의존 관계</text>

      <circle cx="404" cy="428" r="4" fill="rgba(47,111,219,0.08)" stroke="#2f6fdb" stroke-width="1.5"/>
      <line x1="416" y1="428" x2="440" y2="428" stroke="#2f6fdb" stroke-width="1.5" stroke-dasharray="5,4"/>
      <text x="448" y="432" fill="#68657b" font-size="12" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" font-weight="500">진화 이동</text>

      <text x="560" y="432" fill="#68657b" font-size="12" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" font-weight="500">가로 위치가 성숙도, 화살표는 범용화가 임박한 요소</text>
    </svg>
  </div>
</body>
</html>
