<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">

  <title>한빛유통 영업 보고 IT 현황 · 다크</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --paper:#17152b; --paper-2:#24223a; --ink:#f6f5fa; --muted:#d4d2de; --soft:#9d9ab0; --rule:rgba(246,245,250,0.12); --accent:#6e9bea; --link:#9a86ec; --sans:'Geist', 'Pretendard', 'Noto Sans KR', system-ui,sans-serif; --serif:'Instrument Serif',serif; --mono:'Geist Mono',ui-monospace,monospace; }
    body { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:3rem 2rem; background:var(--paper); color:var(--ink); font-family:var(--sans); }
    .frame { width:100%; max-width:1200px; }
    .eyebrow { margin-bottom:.5rem; color:var(--muted); font:500 .66rem/1 var(--mono); letter-spacing:.18em; text-transform:uppercase; }
    h1 { margin-bottom:.35rem; color:var(--ink); font:400 clamp(1.5rem,2.4vw + .75rem,2rem)/1.15 var(--serif); letter-spacing:-.02em; }
    .subtitle { margin-bottom:1.5rem; color:var(--muted); font-size:.9rem; line-height:1.5; }
    .diagram { overflow-x:auto; } svg { display:block; width:100%; min-width:920px; }
    svg .zone { fill:rgba(246,245,250,.04); stroke:rgba(246,245,250,.14); stroke-width:.8; }
    svg .zone-mask, svg .node-mask, svg .label-mask { fill:#17152b; }
    svg .zone-label, svg .arrow-label, svg .legend-label { font-family:'Geist Mono',monospace; }
    svg .zone-label { fill:rgba(246,245,250,.40); font-size:8px; letter-spacing:.14em; }
    svg .node { fill:rgba(246,245,250,.04); stroke:rgba(246,245,250,.32); stroke-width:1; }
    svg .node.external { stroke:#d4d2de; stroke-dasharray:4 3; }
    svg .node.focal { fill:rgba(110,155,234,.12); stroke:#6e9bea; stroke-width:1.4; }
    svg .node.survivor { fill:rgba(156,175,143,.10); stroke:rgba(156,175,143,.55); }
    svg .node-name { fill:#f6f5fa; font:600 12px 'Geist', 'Pretendard', 'Noto Sans KR', sans-serif; }
    svg .node-name.survivor { fill:#9caf8f; }
    svg .sub { fill:#d4d2de; font:400 10px 'Geist Mono',monospace; } svg .sub.focal { fill:#6e9bea; }
    svg .arrow-label { font-size:8px; font-weight:600; letter-spacing:.08em; } svg .legend-label { fill:#d4d2de; font-size:8px; }
    h1 { font-family: var(--sans); font-weight: 700; letter-spacing: -0.03em; }
    svg text.ko { font: 500 12px 'Geist', 'Pretendard', 'Noto Sans KR', sans-serif; letter-spacing: 0; }
  </style>
</head>
