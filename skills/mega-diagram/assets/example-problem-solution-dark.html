<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>가온 국가산업단지 안전관리 사업 추진 배경</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #17152b;
      --color-ink:     #f6f5fa;
      --color-muted:   #d4d2de;
      --color-accent:  #6e9bea;
      --font-sans:     'Geist', 'Pretendard', 'Noto Sans KR', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-sans);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Background · Rationale · mega-diagram</p>
    <h1>산단 통합 안전관리 사업 추진 배경</h1>

    <svg viewBox="0 0 1000 568" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="problem-solution-dark-title problem-solution-dark-desc">
      <title id="problem-solution-dark-title">가온 국가산업단지 안전관리 사업 추진 배경</title>
      <desc id="problem-solution-dark-desc">안전사고 증가·점검 인력 부족·초동 대응 지연이라는 세 가지 현황 문제를 개별 관리·수기 점검·감지 체계 부재라는 원인으로 짚고, 통합 데이터 허브·스마트 점검·실시간 감지로 데이터 기반 산단 안전관리 체계를 구축한다는 사업 목적을 도출하는 추진 배경도.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#d4d2de"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#6e9bea"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#9a86ec"/></marker>
      </defs>

      <!-- Column headers: the three reading steps -->
      <rect x="40" y="40" width="280" height="32" rx="6" fill="rgba(246,245,250,0.05)"/>
      <text x="52" y="60" fill="#9d9ab0" font-size="9" font-family="'Geist Mono', monospace">01</text>
      <text x="180" y="61" fill="#f6f5fa" font-size="12" font-weight="600" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="middle">현황 문제</text>
      <rect x="368" y="40" width="240" height="32" rx="6" fill="rgba(246,245,250,0.05)"/>
      <text x="380" y="60" fill="#9d9ab0" font-size="9" font-family="'Geist Mono', monospace">02</text>
      <text x="488" y="61" fill="#f6f5fa" font-size="12" font-weight="600" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="middle">원인</text>
      <rect x="656" y="40" width="304" height="32" rx="6" fill="rgba(246,245,250,0.05)"/>
      <text x="668" y="60" fill="#9d9ab0" font-size="9" font-family="'Geist Mono', monospace">03</text>
      <text x="808" y="61" fill="#f6f5fa" font-size="12" font-weight="600" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="middle">해결 방향 · 사업 목적</text>

      <!-- Cause-effect connectors: straight, row-aligned, drawn before boxes -->
      <line x1="320" y1="136" x2="368" y2="136" stroke="#d4d2de" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="608" y1="136" x2="656" y2="136" stroke="#d4d2de" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="320" y1="232" x2="368" y2="232" stroke="#d4d2de" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="608" y1="232" x2="656" y2="232" stroke="#d4d2de" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="320" y1="328" x2="368" y2="328" stroke="#d4d2de" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="608" y1="328" x2="656" y2="328" stroke="#d4d2de" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- 현황 문제: evidence number + name + basis -->
      <rect x="40" y="96" width="280" height="80" rx="6" fill="#17152b"/>
      <rect x="40" y="96" width="280" height="80" rx="6" fill="#24223a" stroke="#f6f5fa" stroke-width="1"/>
      <text x="56" y="146" fill="#f6f5fa" font-size="28" font-weight="600" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">142건</text>
      <text x="152" y="130" fill="#f6f5fa" font-size="14" font-weight="600" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">안전사고 증가</text>
      <text x="152" y="152" fill="#d4d2de" font-size="12" font-weight="400" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">최근 3년, 연 18% 증가</text>
      <rect x="40" y="192" width="280" height="80" rx="6" fill="#17152b"/>
      <rect x="40" y="192" width="280" height="80" rx="6" fill="#24223a" stroke="#f6f5fa" stroke-width="1"/>
      <text x="56" y="242" fill="#f6f5fa" font-size="28" font-weight="600" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">310곳</text>
      <text x="152" y="226" fill="#f6f5fa" font-size="14" font-weight="600" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">점검 인력 부족</text>
      <text x="152" y="248" fill="#d4d2de" font-size="12" font-weight="400" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">감독관 1인당 담당 사업장</text>
      <rect x="40" y="288" width="280" height="80" rx="6" fill="#17152b"/>
      <rect x="40" y="288" width="280" height="80" rx="6" fill="#24223a" stroke="#f6f5fa" stroke-width="1"/>
      <text x="56" y="338" fill="#f6f5fa" font-size="28" font-weight="600" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">47분</text>
      <text x="152" y="322" fill="#f6f5fa" font-size="14" font-weight="600" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">초동 대응 지연</text>
      <text x="152" y="344" fill="#d4d2de" font-size="12" font-weight="400" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">사고 인지부터 출동까지</text>

      <!-- 원인 -->
      <rect x="368" y="96" width="240" height="80" rx="6" fill="#17152b"/>
      <rect x="368" y="96" width="240" height="80" rx="6" fill="rgba(246,245,250,0.05)" stroke="#d4d2de" stroke-width="1"/>
      <text x="384" y="130" fill="#f6f5fa" font-size="14" font-weight="600" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">사업장별 개별 관리</text>
      <text x="384" y="152" fill="#d4d2de" font-size="12" font-weight="400" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">안전 정보 공유 체계 없음</text>
      <rect x="368" y="192" width="240" height="80" rx="6" fill="#17152b"/>
      <rect x="368" y="192" width="240" height="80" rx="6" fill="rgba(246,245,250,0.05)" stroke="#d4d2de" stroke-width="1"/>
      <text x="384" y="226" fill="#f6f5fa" font-size="14" font-weight="600" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">수기 점검·서면 보고</text>
      <text x="384" y="248" fill="#d4d2de" font-size="12" font-weight="400" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">점검 1건당 평균 2.5시간</text>
      <rect x="368" y="288" width="240" height="80" rx="6" fill="#17152b"/>
      <rect x="368" y="288" width="240" height="80" rx="6" fill="rgba(246,245,250,0.05)" stroke="#d4d2de" stroke-width="1"/>
      <text x="384" y="322" fill="#f6f5fa" font-size="14" font-weight="600" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">실시간 감지 체계 부재</text>
      <text x="384" y="344" fill="#d4d2de" font-size="12" font-weight="400" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">가스·화재 센서 설치율 12%</text>

      <!-- 해결 방향 + 사업 목적: one focal box, rows aligned with the causes -->
      <rect x="656" y="96" width="304" height="376" rx="6" fill="#17152b"/>
      <rect x="656" y="96" width="304" height="376" rx="6" fill="rgba(110,155,234,0.10)" stroke="#6e9bea" stroke-width="1.2"/>
      <text x="672" y="130" fill="#6e9bea" font-size="9" font-family="'Geist Mono', monospace">01</text>
      <text x="696" y="130" fill="#f6f5fa" font-size="14" font-weight="600" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">통합 안전 데이터 허브</text>
      <text x="696" y="152" fill="#d4d2de" font-size="12" font-weight="400" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">입주 기업 1,240곳 정보 연계</text>
      <text x="672" y="226" fill="#6e9bea" font-size="9" font-family="'Geist Mono', monospace">02</text>
      <text x="696" y="226" fill="#f6f5fa" font-size="14" font-weight="600" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">모바일 스마트 점검</text>
      <text x="696" y="248" fill="#d4d2de" font-size="12" font-weight="400" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">점검 1건당 40분 이내</text>
      <line x1="672" y1="184" x2="944" y2="184" stroke="rgba(246,245,250,0.12)" stroke-width="0.8"/>
      <text x="672" y="322" fill="#6e9bea" font-size="9" font-family="'Geist Mono', monospace">03</text>
      <text x="696" y="322" fill="#f6f5fa" font-size="14" font-weight="600" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">IoT 실시간 감지·경보</text>
      <text x="696" y="344" fill="#d4d2de" font-size="12" font-weight="400" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">센서 설치율 80%로 확대</text>
      <line x1="672" y1="280" x2="944" y2="280" stroke="rgba(246,245,250,0.12)" stroke-width="0.8"/>
      <line x1="672" y1="384" x2="944" y2="384" stroke="#6e9bea" stroke-opacity="0.5" stroke-width="0.8"/>
      <text x="672" y="408" fill="#6e9bea" font-size="12" font-weight="500" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">사업 목적</text>
      <text x="672" y="432" fill="#f6f5fa" font-size="14" font-weight="600" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">데이터 기반 산단 안전관리 체계 구축</text>
      <text x="672" y="456" fill="#d4d2de" font-size="12" font-weight="500" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">2028년 중대사고 50% 감축</text>

      <text x="40" y="456" fill="#9d9ab0" font-size="12" font-weight="400" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">자료: 가온 국가산업단지 안전사고 통계(2023~2025)</text>

      <!-- Legend -->
      <line x1="40" y1="504" x2="960" y2="504" stroke="rgba(246,245,250,0.12)" stroke-width="0.8"/>
      <text x="40" y="536" fill="#d4d2de" font-size="12" font-weight="500" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">범례</text>
      <rect x="88" y="524" width="16" height="12" rx="2" fill="#24223a" stroke="#f6f5fa" stroke-width="1"/>
      <text x="112" y="536" fill="#d4d2de" font-size="12" font-weight="500" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">현황 문제(근거 수치)</text>
      <rect x="264" y="524" width="16" height="12" rx="2" fill="rgba(246,245,250,0.05)" stroke="#d4d2de" stroke-width="1"/>
      <text x="288" y="536" fill="#d4d2de" font-size="12" font-weight="500" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">원인</text>
      <rect x="336" y="524" width="16" height="12" rx="2" fill="rgba(110,155,234,0.10)" stroke="#6e9bea" stroke-width="1"/>
      <text x="360" y="536" fill="#d4d2de" font-size="12" font-weight="500" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">해결 방향·사업 목적</text>
      <line x1="504" y1="530" x2="520" y2="530" stroke="#d4d2de" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="528" y="536" fill="#d4d2de" font-size="12" font-weight="500" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">인과 관계</text>
    </svg>
  </div>
</body>
</html>
