<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>공공 데이터 플랫폼 기능 분류</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #ffffff;
      --color-ink:     #17152b;
      --color-muted:   #68657b;
      --color-accent:  #2f6fdb;
      --font-sans:     'Geist', 'Pretendard', 'Noto Sans KR', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
    /* mega: Korean h1 is set in sans */
    h1 { font-family: var(--font-sans); font-weight: 700; letter-spacing: -0.03em; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Tree · mega-diagram</p>
    <h1>공공 데이터 플랫폼 기능 분류</h1>

    <svg viewBox="0 0 1000 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="tree-title tree-desc">
      <title id="tree-title">공공 데이터 플랫폼 기능 분류</title>
      <desc id="tree-desc">공공 데이터 플랫폼을 데이터 수집, 데이터 관리, 데이터 개방 세 대분류와 그 아래 세부 기능으로 나눈 트리.</desc>
        <defs>
          <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r="0.9" fill="rgba(23,21,43,0.10)"/>
          </pattern>
        </defs>


        <!-- Tier tags (left margin) -->
        <text x="40" y="108" fill="#68657b" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">TIER 0 · ROOT</text>
        <text x="40" y="224" fill="#68657b" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em" text-anchor="start">TIER 1</text>
        <text x="40" y="324" fill="#68657b" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em" text-anchor="start">TIER 2</text>

        <!-- Connectors drawn first (behind nodes) -->
        <!-- Root → Tier 1 bus -->
        <path d="M 500 128 L 500 168 L 220 168 L 220 208" fill="none" stroke="#68657b" stroke-width="1"/>
        <path d="M 500 168 L 500 208" fill="none" stroke="#68657b" stroke-width="1"/>
        <path d="M 500 168 L 780 168 L 780 208" fill="none" stroke="#68657b" stroke-width="1"/>

        <!-- Design → leaves -->
        <path d="M 220 256 L 220 296 L 140 296 L 140 336" fill="none" stroke="#68657b" stroke-width="1"/>
        <path d="M 220 296 L 300 296 L 300 336" fill="none" stroke="#68657b" stroke-width="1"/>

        <!-- Engineering → leaves -->
        <path d="M 500 256 L 500 296 L 480 296 L 480 336" fill="none" stroke="#68657b" stroke-width="1"/>
        <path d="M 500 296 L 660 296 L 660 336" fill="none" stroke="#68657b" stroke-width="1"/>

        <!-- Research → single leaf -->
        <path d="M 780 256 L 780 296 L 840 296 L 840 336" fill="none" stroke="#68657b" stroke-width="1"/>

        <!-- Root node: Skills (coral focal) -->
        <rect x="420" y="80" width="160" height="48" rx="6" fill="#ffffff"/>
        <rect x="420" y="80" width="160" height="48" rx="6" fill="rgba(47,111,219,0.08)" stroke="#2f6fdb" stroke-width="1"/>
        <rect x="428" y="88" width="32" height="12" rx="2" fill="transparent" stroke="rgba(47,111,219,0.50)" stroke-width="0.8"/>
        <text x="444" y="97" fill="#2f6fdb" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ROOT</text>
        <text x="500" y="118" fill="#17152b" font-size="12" font-weight="600" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="middle">공공 데이터 플랫폼</text>

        <!-- Tier 1: Design -->
        <rect x="140" y="208" width="160" height="48" rx="6" fill="#ffffff"/>
        <rect x="140" y="208" width="160" height="48" rx="6" fill="#ffffff" stroke="#17152b" stroke-width="1"/>
        <rect x="148" y="216" width="28" height="12" rx="2" fill="transparent" stroke="rgba(23,21,43,0.40)" stroke-width="0.8"/>
        <text x="162" y="225" fill="#17152b" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CAT</text>
        <text x="220" y="240" fill="#17152b" font-size="12" font-weight="600" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="middle">데이터 수집</text>
        <text x="220" y="252" fill="#68657b" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">ingest · ETL · CDC</text>

        <!-- Tier 1: Engineering -->
        <rect x="420" y="208" width="160" height="48" rx="6" fill="#ffffff"/>
        <rect x="420" y="208" width="160" height="48" rx="6" fill="#ffffff" stroke="#17152b" stroke-width="1"/>
        <rect x="428" y="216" width="28" height="12" rx="2" fill="transparent" stroke="rgba(23,21,43,0.40)" stroke-width="0.8"/>
        <text x="442" y="225" fill="#17152b" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CAT</text>
        <text x="500" y="240" fill="#17152b" font-size="12" font-weight="600" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="middle">데이터 관리</text>
        <text x="500" y="252" fill="#68657b" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">quality · meta · audit</text>

        <!-- Tier 1: Research -->
        <rect x="700" y="208" width="160" height="48" rx="6" fill="#ffffff"/>
        <rect x="700" y="208" width="160" height="48" rx="6" fill="#ffffff" stroke="#17152b" stroke-width="1"/>
        <rect x="708" y="216" width="28" height="12" rx="2" fill="transparent" stroke="rgba(23,21,43,0.40)" stroke-width="0.8"/>
        <text x="722" y="225" fill="#17152b" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CAT</text>
        <text x="780" y="240" fill="#17152b" font-size="12" font-weight="600" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="middle">데이터 개방</text>
        <text x="780" y="252" fill="#68657b" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">portal · Open API</text>

        <!-- Tier 2: polish -->
        <rect x="60" y="336" width="160" height="48" rx="6" fill="#ffffff"/>
        <rect x="60" y="336" width="160" height="48" rx="6" fill="rgba(23,21,43,0.05)" stroke="#68657b" stroke-width="0.8"/>
        <text x="140" y="360" fill="#17152b" font-size="12" font-weight="600" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="middle">기관 연계</text>
        <text x="140" y="372" fill="#68657b" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">REST · SFTP · batch</text>

        <!-- Tier 2: critique -->
        <rect x="220" y="336" width="160" height="48" rx="6" fill="#ffffff"/>
        <rect x="220" y="336" width="160" height="48" rx="6" fill="rgba(23,21,43,0.05)" stroke="#68657b" stroke-width="0.8"/>
        <text x="300" y="360" fill="#17152b" font-size="12" font-weight="600" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="middle">파일 등록</text>
        <text x="300" y="372" fill="#68657b" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">CSV · XLSX · JSON</text>

        <!-- Tier 2: review -->
        <rect x="400" y="336" width="160" height="48" rx="6" fill="#ffffff"/>
        <rect x="400" y="336" width="160" height="48" rx="6" fill="rgba(23,21,43,0.05)" stroke="#68657b" stroke-width="0.8"/>
        <text x="480" y="360" fill="#17152b" font-size="12" font-weight="600" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="middle">품질 검증</text>
        <text x="480" y="372" fill="#68657b" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">rules · schema · log</text>

        <!-- Tier 2: ship -->
        <rect x="580" y="336" width="160" height="48" rx="6" fill="#ffffff"/>
        <rect x="580" y="336" width="160" height="48" rx="6" fill="rgba(23,21,43,0.05)" stroke="#68657b" stroke-width="0.8"/>
        <text x="660" y="360" fill="#17152b" font-size="12" font-weight="600" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="middle">메타데이터</text>
        <text x="660" y="372" fill="#68657b" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">DCAT · catalog</text>

        <!-- Tier 2: investigate -->
        <rect x="760" y="336" width="160" height="48" rx="6" fill="#ffffff"/>
        <rect x="760" y="336" width="160" height="48" rx="6" fill="rgba(23,21,43,0.05)" stroke="#68657b" stroke-width="0.8"/>
        <text x="840" y="360" fill="#17152b" font-size="12" font-weight="600" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="middle">API 서비스</text>
        <text x="840" y="372" fill="#68657b" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">REST · key · quota</text>

        <!-- Legend strip -->
        <line x1="40" y1="412" x2="960" y2="412" stroke="rgba(23,21,43,0.10)" stroke-width="0.8"/>
        <text x="40" y="428" fill="#68657b" font-size="12" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" font-weight="500">범례</text>

        <rect x="40" y="444" width="14" height="10" rx="2" fill="rgba(47,111,219,0.08)" stroke="#2f6fdb" stroke-width="1"/>
        <text x="60" y="452" fill="#68657b" font-size="12" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" font-weight="500">플랫폼 · 초점</text>

        <rect x="180" y="444" width="14" height="10" rx="2" fill="#ffffff" stroke="#17152b" stroke-width="1"/>
        <text x="200" y="452" fill="#68657b" font-size="12" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" font-weight="500">대분류</text>

        <rect x="340" y="444" width="14" height="10" rx="2" fill="rgba(23,21,43,0.05)" stroke="#68657b" stroke-width="0.8"/>
        <text x="360" y="452" fill="#68657b" font-size="12" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" font-weight="500">세부 기능</text>

        <text x="500" y="452" fill="#68657b" font-size="12" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" font-weight="500">직교 연결선만 사용 · 강조색은 루트에만</text>
      </svg>
  </div>
</body>
</html>
