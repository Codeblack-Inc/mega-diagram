<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>스마트공장 고도화 사업 기대효과</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #17152b;   /* deep warm charcoal */
      --color-ink:     #f6f5fa;   /* warm off-white */
      --color-muted:   #d4d2de;
      --color-accent:  #6e9bea;
      --font-sans:     'Geist', 'Pretendard', 'Noto Sans KR', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-sans);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Expected effects · mega-diagram</p>
    <h1>스마트공장 고도화 사업 기대효과</h1>

    <svg viewBox="0 0 1000 496" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="expected-effects-dark-title expected-effects-dark-desc">
      <title id="expected-effects-dark-title">스마트공장 고도화 사업 기대효과</title>
      <desc id="expected-effects-dark-desc">(주)한결정밀 스마트공장 고도화 사업의 기대효과를 정량적 효과 3개(불량률 32% 감소, 연간 원가 4.8억 원 절감, 설비종합효율 12%p 향상)와 산출 근거, 정성적 효과 3개, 경제·사회·기술 파급 효과로 정리하고 원가 절감을 핵심 효과로 강조한 그림.</desc>
      <!-- No connectors: the two panels sit side by side, the ripple band spans both. -->

      <!-- 정량적 효과 panel: header 48 + 3 KPI rows × 80 -->
      <rect x="32" y="24" width="552" height="288" rx="6" fill="#17152b" stroke="rgba(246,245,250,0.3)" stroke-width="1"/>
      <text x="48" y="54" fill="#f6f5fa" font-size="14" font-weight="600" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">정량적 효과</text>
      <text x="568" y="53" fill="#d4d2de" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.14em">QUANTITATIVE</text>
      <line x1="32" y1="72" x2="584" y2="72" stroke="rgba(246,245,250,0.12)" stroke-width="1"/>
      <line x1="48" y1="152" x2="568" y2="152" stroke="rgba(246,245,250,0.12)" stroke-width="0.8"/>
      <line x1="48" y1="232" x2="568" y2="232" stroke="rgba(246,245,250,0.12)" stroke-width="0.8"/>
      <text x="56" y="122" fill="#f6f5fa" font-size="28" font-weight="600" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">−32%</text>
      <text x="224" y="106" fill="#f6f5fa" font-size="14" font-weight="600" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">제품 불량률 감소</text>
      <text x="224" y="128" fill="#d4d2de" font-size="12" font-weight="500" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">불량률 2.5% → 1.7%, 연 생산 120만 개 기준</text>
      <!-- Focal effect (accent 1): the number the business case rests on -->
      <rect x="40" y="160" width="536" height="64" rx="4" fill="rgba(110,155,234,0.10)" stroke="#6e9bea" stroke-width="1"/>
      <text x="56" y="202" fill="#6e9bea" font-size="28" font-weight="600" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">4.8억 원</text>
      <text x="224" y="186" fill="#f6f5fa" font-size="14" font-weight="600" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">연간 제조원가 절감</text>
      <text x="224" y="208" fill="#d4d2de" font-size="12" font-weight="500" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">불량 손실 1.9억 + 에너지 1.2억 + 인건비 1.7억</text>
      <text x="56" y="282" fill="#f6f5fa" font-size="28" font-weight="600" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">+12%p</text>
      <text x="224" y="266" fill="#f6f5fa" font-size="14" font-weight="600" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">설비종합효율 향상</text>
      <text x="224" y="288" fill="#d4d2de" font-size="12" font-weight="500" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">OEE 68% → 80%, 설비 42대 실시간 모니터링</text>

      <!-- 정성적 효과 panel: same header and row pitch -->
      <rect x="608" y="24" width="360" height="288" rx="6" fill="#17152b" stroke="rgba(246,245,250,0.3)" stroke-width="1"/>
      <text x="624" y="54" fill="#f6f5fa" font-size="14" font-weight="600" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">정성적 효과</text>
      <text x="952" y="53" fill="#d4d2de" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.14em">QUALITATIVE</text>
      <line x1="608" y1="72" x2="968" y2="72" stroke="rgba(246,245,250,0.12)" stroke-width="1"/>
      <line x1="624" y1="152" x2="952" y2="152" stroke="rgba(246,245,250,0.12)" stroke-width="0.8"/>
      <line x1="624" y1="232" x2="952" y2="232" stroke="rgba(246,245,250,0.12)" stroke-width="0.8"/>
      <rect x="624" y="99" width="4" height="4" rx="0" fill="#d4d2de"/>
      <text x="636" y="106" fill="#f6f5fa" font-size="14" font-weight="600" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">품질 신뢰도 향상</text>
      <text x="636" y="128" fill="#d4d2de" font-size="12" font-weight="500" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">납품처 품질 감사 등급 B → A 상향</text>
      <rect x="624" y="179" width="4" height="4" rx="0" fill="#d4d2de"/>
      <text x="636" y="186" fill="#f6f5fa" font-size="14" font-weight="600" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">현장 작업 표준화</text>
      <text x="636" y="208" fill="#d4d2de" font-size="12" font-weight="500" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">숙련공 노하우 데이터화, 교육 기간 단축</text>
      <rect x="624" y="259" width="4" height="4" rx="0" fill="#d4d2de"/>
      <text x="636" y="266" fill="#f6f5fa" font-size="14" font-weight="600" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">데이터 기반 의사결정</text>
      <text x="636" y="288" fill="#d4d2de" font-size="12" font-weight="500" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">생산·설비 일일 리포트 자동 생성</text>

      <!-- 파급 효과 band: row header + 3 cells × 256, gap 16 -->
      <rect x="32" y="336" width="120" height="88" rx="6" fill="rgba(246,245,250,0.05)"/>
      <text x="92" y="378" fill="#f6f5fa" font-size="12" font-weight="600" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="middle">파급 효과</text>
      <text x="92" y="394" fill="#d4d2de" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">RIPPLE</text>
      <rect x="168" y="336" width="256" height="88" rx="6" fill="#17152b" stroke="rgba(246,245,250,0.12)" stroke-width="1"/>
      <text x="184" y="364" fill="#f6f5fa" font-size="12" font-weight="600" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">경제</text>
      <text x="408" y="363" fill="#d4d2de" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.14em">ECONOMY</text>
      <rect x="184" y="381" width="4" height="4" rx="0" fill="#d4d2de"/>
      <text x="196" y="388" fill="#f6f5fa" font-size="12" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">협력사 매출 증대 12억 원</text>
      <rect x="184" y="401" width="4" height="4" rx="0" fill="#d4d2de"/>
      <text x="196" y="408" fill="#f6f5fa" font-size="12" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">신규 고용 8명 창출</text>
      <rect x="440" y="336" width="256" height="88" rx="6" fill="#17152b" stroke="rgba(246,245,250,0.12)" stroke-width="1"/>
      <text x="456" y="364" fill="#f6f5fa" font-size="12" font-weight="600" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">사회</text>
      <text x="680" y="363" fill="#d4d2de" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.14em">SOCIETY</text>
      <rect x="456" y="381" width="4" height="4" rx="0" fill="#d4d2de"/>
      <text x="468" y="388" fill="#f6f5fa" font-size="12" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">야간·위험 작업 30% 감소</text>
      <rect x="456" y="401" width="4" height="4" rx="0" fill="#d4d2de"/>
      <text x="468" y="408" fill="#f6f5fa" font-size="12" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">지역 제조 인력 재교육</text>
      <rect x="712" y="336" width="256" height="88" rx="6" fill="#17152b" stroke="rgba(246,245,250,0.12)" stroke-width="1"/>
      <text x="728" y="364" fill="#f6f5fa" font-size="12" font-weight="600" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">기술</text>
      <text x="952" y="363" fill="#d4d2de" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.14em">TECHNOLOGY</text>
      <rect x="728" y="381" width="4" height="4" rx="0" fill="#d4d2de"/>
      <text x="740" y="388" fill="#f6f5fa" font-size="12" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">MES·비전 검사 기술 내재화</text>
      <rect x="728" y="401" width="4" height="4" rx="0" fill="#d4d2de"/>
      <text x="740" y="408" fill="#f6f5fa" font-size="12" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">동종 업계 확산 모델 제시</text>

      <!-- Legend strip -->
      <line x1="32" y1="448" x2="968" y2="448" stroke="rgba(246,245,250,0.1)" stroke-width="0.8"/>
      <text x="32" y="476" fill="#d4d2de" font-size="12" font-weight="500" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">범례</text>
      <rect x="88" y="466" width="16" height="12" rx="2" fill="rgba(110,155,234,0.10)" stroke="#6e9bea" stroke-width="1"/>
      <text x="112" y="476" fill="#d4d2de" font-size="12" font-weight="500" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">핵심 효과</text>
      <rect x="208" y="466" width="16" height="12" rx="2" fill="#17152b" stroke="rgba(246,245,250,0.3)" stroke-width="1"/>
      <text x="232" y="476" fill="#d4d2de" font-size="12" font-weight="500" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">효과 구분</text>
      <rect x="328" y="466" width="16" height="12" rx="2" fill="rgba(246,245,250,0.05)"/>
      <text x="352" y="476" fill="#d4d2de" font-size="12" font-weight="500" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">파급 영역</text>
    </svg>
  </div>
</body>
</html>
