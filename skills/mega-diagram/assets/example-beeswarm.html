    <h1>중앙값은 꼬리를 가린다</h1>

    <!-- Value axis: 0-440ms over 880px, x = 80 + 2*ms, linear from zero.
         The vertical (swarm) axis carries NO meaning: each dot's y offset is
         greedy packing at pitch 10 (2r+2) around the y=230 midline, first
         free slot alternating above/below, and overlap is never resolved by
         moving a dot along the value axis. scripts/verify-beeswarm.py derives
         the value scale from the dots themselves and flags any dot that
         disagrees with its peers, any overlapping pair, and any second dot
         radius or non-focal fill. -->
    <svg viewBox="0 0 1000 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="beeswarm-title beeswarm-desc">
      <title id="beeswarm-title">중앙값은 꼬리를 가린다</title>
      <desc id="beeswarm-desc">결제 API 한 곳의 요청 138건 응답 시간을 0부터 시작하는 선형 축에 찍은 비스웜으로, 세로 퍼짐은 배치일 뿐 값이 없고 380ms를 넘는 요청 3건이 p99 꼬리를 이룬다.</desc>
      <defs>
        <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
          <circle cx="1" cy="1" r="0.9" fill="rgba(23,21,43,0.10)"/>
        </pattern>
      </defs>


      <!-- Axis caption -->
      <text x="520" y="457" fill="#68657b" font-size="12" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="middle" font-weight="500">요청별 응답 시간(ms)</text>

      <!-- Vertical gridlines only: the swarm axis has no scale to grid.
           A horizontal rule through the band would invite reading the
           packing offsets as values, which they are not. -->
      <line x1="280" y1="40" x2="280" y2="420" stroke="rgba(23,21,43,0.08)" stroke-width="0.8"/>
      <line x1="480" y1="40" x2="480" y2="420" stroke="rgba(23,21,43,0.08)" stroke-width="0.8"/>
      <line x1="680" y1="40" x2="680" y2="420" stroke="rgba(23,21,43,0.08)" stroke-width="0.8"/>
      <line x1="880" y1="40" x2="880" y2="420" stroke="rgba(23,21,43,0.08)" stroke-width="0.8"/>

      <!-- Value axis, from zero. -->
      <line x1="80" y1="420" x2="960" y2="420" stroke="rgba(23,21,43,0.25)" stroke-width="1"/>

      <!-- Tick labels are BOUND: data-tick names the (one) value axis and
           data-value the number the tick claims to sit at. verify-beeswarm.py
           cross-checks each against the scale the dots themselves describe. -->
      <text data-tick="x" data-value="0" x="80" y="440" fill="#68657b" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">0</text>
      <text data-tick="x" data-value="100" x="280" y="440" fill="#68657b" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">100</text>
      <text data-tick="x" data-value="200" x="480" y="440" fill="#68657b" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">200</text>
      <text data-tick="x" data-value="300" x="680" y="440" fill="#68657b" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">300</text>
      <text data-tick="x" data-value="400" x="880" y="440" fill="#68657b" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">400</text>
