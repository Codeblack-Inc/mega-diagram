<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>(주)누리핏 유료 전환율 하락 원인 이슈 트리</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #17152b;
      --color-ink:     #f6f5fa;
      --color-muted:   #d4d2de;
      --color-accent:  #6e9bea;
      --font-sans:     'Geist', 'Pretendard', 'Noto Sans KR', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-sans);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Issue tree · mega-diagram</p>
    <h1>유료 전환율 하락 원인 이슈 트리</h1>

    <svg viewBox="0 0 1000 624" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="issue-tree-dark-title issue-tree-dark-desc">
      <title id="issue-tree-dark-title">(주)누리핏 유료 전환율 하락 원인 이슈 트리</title>
      <desc id="issue-tree-dark-desc">유료 전환율이 4.8%에서 3.1%로 떨어진 원인을 유입 고객의 질, 무료 체험 경험, 가격·결제 장벽 세 하위 이슈로 나누고 각각 가설 세 개와 분석 항목을 연결한 이슈 트리이며, 무료 체험 경험 악화를 우선 검증 이슈로 강조.</desc>

      <!-- Column captions -->
      <text x="40" y="36" fill="#9d9ab0" font-size="12" font-weight="500" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">핵심 질문</text>
      <text x="320" y="36" fill="#9d9ab0" font-size="12" font-weight="500" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">하위 이슈 · MECE</text>
      <text x="600" y="36" fill="#9d9ab0" font-size="12" font-weight="500" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">가설</text>
      <text x="944" y="36" fill="#9d9ab0" font-size="12" font-weight="500" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="end">분석 항목</text>

      <!-- Connectors first: stem + bus + branches, r=8, no arrowheads -->
      <path d="M 280,296 V 136 Q 280,128 288,128 H 320" fill="none" stroke="#d4d2de" stroke-width="1"/>
      <path d="M 560,128 V 84 Q 560,76 568,76 H 600" fill="none" stroke="#d4d2de" stroke-width="1"/>
      <path d="M 520,128 H 600" fill="none" stroke="#d4d2de" stroke-width="1"/>
      <path d="M 560,128 V 172 Q 560,180 568,180 H 600" fill="none" stroke="#d4d2de" stroke-width="1"/>
      <path d="M 240,296 H 320" fill="none" stroke="#6e9bea" stroke-width="1.4"/>
      <path d="M 560,296 V 252 Q 560,244 568,244 H 600" fill="none" stroke="#6e9bea" stroke-width="1.4"/>
      <path d="M 520,296 H 600" fill="none" stroke="#6e9bea" stroke-width="1.4"/>
      <path d="M 560,296 V 340 Q 560,348 568,348 H 600" fill="none" stroke="#6e9bea" stroke-width="1.4"/>
      <path d="M 280,296 V 456 Q 280,464 288,464 H 320" fill="none" stroke="#d4d2de" stroke-width="1"/>
      <path d="M 560,464 V 420 Q 560,412 568,412 H 600" fill="none" stroke="#d4d2de" stroke-width="1"/>
      <path d="M 520,464 H 600" fill="none" stroke="#d4d2de" stroke-width="1"/>
      <path d="M 560,464 V 508 Q 560,516 568,516 H 600" fill="none" stroke="#d4d2de" stroke-width="1"/>

      <!-- Root question -->
      <rect x="40" y="248" width="200" height="96" rx="6" fill="#17152b"/>
      <rect x="40" y="248" width="200" height="96" rx="6" fill="rgba(246,245,250,0.04)" stroke="#f6f5fa" stroke-width="1.2"/>
      <text x="56" y="290" fill="#f6f5fa" font-size="14" font-weight="600" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">유료 전환율은 왜</text>
      <text x="56" y="312" fill="#f6f5fa" font-size="14" font-weight="600" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">4.8%→3.1%로 떨어졌나</text>

      <!-- Sub-issues and leaves -->
      <!-- 이슈 A · 유입 -->
      <rect x="320" y="100" width="200" height="56" rx="6" fill="#17152b"/>
      <rect x="320" y="100" width="200" height="56" rx="6" fill="#24223a" stroke="#f6f5fa" stroke-width="1"/>
      <text x="336" y="122" fill="#9d9ab0" font-size="12" font-weight="500" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">이슈 A · 유입</text>
      <text x="336" y="142" fill="#f6f5fa" font-size="12" font-weight="600" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">유입 고객의 질 저하</text>
      <rect x="600" y="56" width="360" height="40" rx="6" fill="#17152b" stroke="rgba(246,245,250,0.3)" stroke-width="0.8"/>
      <text x="616" y="81" fill="#f6f5fa" font-size="12" font-weight="500" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">숏폼 광고 비중 확대로 저의향 유입</text>
      <text x="944" y="81" fill="#9d9ab0" font-size="12" font-weight="400" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="end">채널별 전환율</text>
      <rect x="600" y="108" width="360" height="40" rx="6" fill="#17152b" stroke="rgba(246,245,250,0.3)" stroke-width="0.8"/>
      <text x="616" y="133" fill="#f6f5fa" font-size="12" font-weight="500" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">무료 체험 쿠폰 과다 배포</text>
      <text x="944" y="133" fill="#9d9ab0" font-size="12" font-weight="400" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="end">쿠폰 코호트</text>
      <rect x="600" y="160" width="360" height="40" rx="6" fill="#17152b" stroke="rgba(246,245,250,0.3)" stroke-width="0.8"/>
      <text x="616" y="185" fill="#f6f5fa" font-size="12" font-weight="500" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">검색 유입 감소</text>
      <text x="944" y="185" fill="#9d9ab0" font-size="12" font-weight="400" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="end">키워드 순위</text>
      <!-- 이슈 B · 체험 -->
      <rect x="320" y="268" width="200" height="56" rx="6" fill="#17152b"/>
      <rect x="320" y="268" width="200" height="56" rx="6" fill="rgba(110,155,234,0.10)" stroke="#6e9bea" stroke-width="1"/>
      <text x="336" y="290" fill="#6e9bea" font-size="12" font-weight="500" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">이슈 B · 체험</text>
      <text x="336" y="310" fill="#f6f5fa" font-size="12" font-weight="600" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">무료 체험 경험 악화</text>
      <rect x="600" y="224" width="360" height="40" rx="6" fill="#17152b" stroke="rgba(246,245,250,0.3)" stroke-width="0.8"/>
      <text x="616" y="249" fill="#f6f5fa" font-size="12" font-weight="500" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">체험 7일 내 첫 운동 완료율 하락</text>
      <text x="944" y="249" fill="#9d9ab0" font-size="12" font-weight="400" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="end">온보딩 퍼널</text>
      <rect x="600" y="276" width="360" height="40" rx="6" fill="#17152b" stroke="rgba(246,245,250,0.3)" stroke-width="0.8"/>
      <text x="616" y="301" fill="#f6f5fa" font-size="12" font-weight="500" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">8월 개편 후 루틴 추천 오류</text>
      <text x="944" y="301" fill="#9d9ab0" font-size="12" font-weight="400" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="end">오류 로그·리뷰</text>
      <rect x="600" y="328" width="360" height="40" rx="6" fill="#17152b" stroke="rgba(246,245,250,0.3)" stroke-width="0.8"/>
      <text x="616" y="353" fill="#f6f5fa" font-size="12" font-weight="500" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">코치 피드백 응답 지연</text>
      <text x="944" y="353" fill="#9d9ab0" font-size="12" font-weight="400" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="end">응답 시간 분포</text>
      <!-- 이슈 C · 가격 -->
      <rect x="320" y="436" width="200" height="56" rx="6" fill="#17152b"/>
      <rect x="320" y="436" width="200" height="56" rx="6" fill="#24223a" stroke="#f6f5fa" stroke-width="1"/>
      <text x="336" y="458" fill="#9d9ab0" font-size="12" font-weight="500" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">이슈 C · 가격</text>
      <text x="336" y="478" fill="#f6f5fa" font-size="12" font-weight="600" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">가격·결제 장벽</text>
      <rect x="600" y="392" width="360" height="40" rx="6" fill="#17152b" stroke="rgba(246,245,250,0.3)" stroke-width="0.8"/>
      <text x="616" y="417" fill="#f6f5fa" font-size="12" font-weight="500" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">연간권 9.9만→12.9만 원 인상</text>
      <text x="944" y="417" fill="#9d9ab0" font-size="12" font-weight="400" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="end">가격 탄력성</text>
      <rect x="600" y="444" width="360" height="40" rx="6" fill="#17152b" stroke="rgba(246,245,250,0.3)" stroke-width="0.8"/>
      <text x="616" y="469" fill="#f6f5fa" font-size="12" font-weight="500" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">간편결제 수단 부족</text>
      <text x="944" y="469" fill="#9d9ab0" font-size="12" font-weight="400" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="end">결제 이탈률</text>
      <rect x="600" y="496" width="360" height="40" rx="6" fill="#17152b" stroke="rgba(246,245,250,0.3)" stroke-width="0.8"/>
      <text x="616" y="521" fill="#f6f5fa" font-size="12" font-weight="500" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">경쟁 앱 할인 공세</text>
      <text x="944" y="521" fill="#9d9ab0" font-size="12" font-weight="400" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="end">경쟁사 가격 조사</text>

      <!-- Legend -->
      <line x1="40" y1="568" x2="960" y2="568" stroke="rgba(246,245,250,0.12)" stroke-width="0.8"/>
      <text x="40" y="600" fill="#d4d2de" font-size="12" font-weight="500" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">범례</text>
      <rect x="88" y="588" width="16" height="12" rx="2" fill="rgba(246,245,250,0.04)" stroke="#f6f5fa" stroke-width="1.2"/>
      <text x="112" y="600" fill="#d4d2de" font-size="12" font-weight="500" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">핵심 질문</text>
      <rect x="192" y="588" width="16" height="12" rx="2" fill="#24223a" stroke="#f6f5fa" stroke-width="1"/>
      <text x="216" y="600" fill="#d4d2de" font-size="12" font-weight="500" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">하위 이슈</text>
      <rect x="296" y="588" width="16" height="12" rx="2" fill="#17152b" stroke="rgba(246,245,250,0.3)" stroke-width="0.8"/>
      <text x="320" y="600" fill="#d4d2de" font-size="12" font-weight="500" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">가설·분석 항목</text>
      <rect x="432" y="588" width="16" height="12" rx="2" fill="rgba(110,155,234,0.10)" stroke="#6e9bea" stroke-width="1"/>
      <text x="456" y="600" fill="#d4d2de" font-size="12" font-weight="500" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">우선 검증 이슈</text>
    </svg>
  </div>
</body>
</html>
