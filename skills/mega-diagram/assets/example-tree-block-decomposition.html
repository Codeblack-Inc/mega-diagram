<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>결제 게이트웨이 블록 분해</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #ffffff;
      --color-ink:     #17152b;
      --color-muted:   #68657b;
      --color-accent:  #2f6fdb;
      --font-sans:     'Geist', 'Pretendard', 'Noto Sans KR', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1100px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
    /* mega: Korean h1 is set in sans */
    h1 { font-family: var(--font-sans); font-weight: 700; letter-spacing: -0.03em; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Semantic pattern · Traceable block decomposition</p>
    <h1>결제 게이트웨이 블록 분해</h1>

    <svg viewBox="0 0 1000 320" xmlns="http://www.w3.org/2000/svg" role="img"
         aria-labelledby="tree-block-decomposition-title tree-block-decomposition-desc">
      <title id="tree-block-decomposition-title">결제 게이트웨이 블록 분해</title>
      <desc id="tree-block-decomposition-desc">결제 게이트웨이를 카드 승인, 이상거래 탐지, 정산 원장으로 나누고 블록마다 고정 ID, 입력, 출력, 제약, 구현 경로를 메타데이터로 담은 추적 가능한 블록 분해도.</desc>
      <defs>
        <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
          <circle cx="1" cy="1" r="0.9" fill="rgba(23,21,43,0.10)"/>
        </pattern>
      </defs>


      <!-- Tier tags (left margin) -->
      <text x="40" y="70" fill="#68657b" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">TIER 0 · ROOT</text>
      <text x="40" y="210" fill="#68657b" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">TIER 1</text>

      <!-- Connectors first (§5 paint order), orthogonal elbow, 1px muted stroke -->
      <path d="M 500 92 V 130 H 280 V 180" fill="none" stroke="#68657b" stroke-width="1"/>
      <path d="M 500 92 V 180" fill="none" stroke="#68657b" stroke-width="1"/>
      <path d="M 500 92 V 130 H 720 V 180" fill="none" stroke="#68657b" stroke-width="1"/>

      <!-- Root: PAY-001 Payment Gateway (coral focal) -->
      <rect x="420" y="40" width="160" height="52" rx="6" fill="#ffffff"/>
      <rect x="420" y="40" width="160" height="52" rx="6" fill="rgba(47,111,219,0.08)" stroke="#2f6fdb" stroke-width="1"
            data-block-id="PAY-001" data-block-name="결제 게이트웨이"
            data-block-output="정산 완료 거래 기록"
            data-block-constraint="모든 거래는 정확히 하나의 최종 상태로 종료"
            data-block-impl="src/payments/gateway/"/>
      <rect x="428" y="46" width="46" height="12" rx="2" fill="transparent" stroke="rgba(47,111,219,0.50)" stroke-width="0.8"/>
      <text x="451" y="55" fill="#2f6fdb" font-size="7" font-family="'Geist Mono', monospace"
            text-anchor="middle" letter-spacing="0.08em">PAY-001</text>
      <text x="500" y="70" fill="#17152b" font-size="12" font-weight="600"
            font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="middle">결제 게이트웨이</text>
      <text x="500" y="86" fill="#68657b" font-size="9"
            font-family="'Geist Mono', monospace" text-anchor="middle">request → settlement</text>

      <!-- Child: PAY-001-01 Card Authorization -->
      <rect x="200" y="180" width="160" height="52" rx="6" fill="#ffffff"/>
      <rect x="200" y="180" width="160" height="52" rx="6" fill="#ffffff" stroke="#17152b" stroke-width="1"
            data-block-id="PAY-001-01" data-block-parent="PAY-001" data-block-name="카드 승인"
            data-block-input="결제 화면에서 받은 카드 원본 정보"
            data-block-output="승인 토큰 또는 거절"
            data-block-constraint="카드 번호 원문 저장 금지"
            data-block-assumption="PCI DSS 적용 구간 안에서 실행"
            data-block-impl="src/payments/authorization/"/>
      <rect x="208" y="186" width="62" height="12" rx="2" fill="transparent" stroke="rgba(23,21,43,0.40)" stroke-width="0.8"/>
      <text x="239" y="195" fill="#17152b" font-size="7" font-family="'Geist Mono', monospace"
            text-anchor="middle" letter-spacing="0.08em">PAY-001-01</text>
      <text x="280" y="210" fill="#17152b" font-size="12" font-weight="600"
            font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="middle">카드 승인</text>
      <text x="280" y="226" fill="#68657b" font-size="9"
            font-family="'Geist Mono', monospace" text-anchor="middle">card → token</text>

      <!-- Child: PAY-001-02 Fraud Screening -->
      <rect x="420" y="180" width="160" height="52" rx="6" fill="#ffffff"/>
      <rect x="420" y="180" width="160" height="52" rx="6" fill="#ffffff" stroke="#17152b" stroke-width="1"
            data-block-id="PAY-001-02" data-block-parent="PAY-001" data-block-name="이상거래 탐지"
            data-block-input="승인 토큰"
            data-block-output="위험 점수와 보류·해제 판정"
            data-block-constraint="설정 임계값 초과 시 해제 차단"
            data-block-impl="src/payments/fraud/"/>
      <rect x="428" y="186" width="62" height="12" rx="2" fill="transparent" stroke="rgba(23,21,43,0.40)" stroke-width="0.8"/>
      <text x="459" y="195" fill="#17152b" font-size="7" font-family="'Geist Mono', monospace"
            text-anchor="middle" letter-spacing="0.08em">PAY-001-02</text>
      <text x="500" y="210" fill="#17152b" font-size="12" font-weight="600"
            font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="middle">이상거래 탐지</text>
      <text x="500" y="226" fill="#68657b" font-size="9"
            font-family="'Geist Mono', monospace" text-anchor="middle">token → score</text>

      <!-- Child: PAY-001-03 Settlement Ledger -->
      <rect x="640" y="180" width="160" height="52" rx="6" fill="#ffffff"/>
      <rect x="640" y="180" width="160" height="52" rx="6" fill="#ffffff" stroke="#17152b" stroke-width="1"
            data-block-id="PAY-001-03" data-block-parent="PAY-001" data-block-name="정산 원장"
            data-block-input="해제된 승인 건"
            data-block-output="정산 완료 거래 기록"
            data-block-constraint="추가 전용 · 기록 후 원장 행 수정 금지"
            data-block-impl="src/payments/ledger/"/>
      <rect x="648" y="186" width="62" height="12" rx="2" fill="transparent" stroke="rgba(23,21,43,0.40)" stroke-width="0.8"/>
      <text x="679" y="195" fill="#17152b" font-size="7" font-family="'Geist Mono', monospace"
            text-anchor="middle" letter-spacing="0.08em">PAY-001-03</text>
      <text x="720" y="210" fill="#17152b" font-size="12" font-weight="600"
            font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="middle">정산 원장</text>
      <text x="720" y="226" fill="#68657b" font-size="9"
            font-family="'Geist Mono', monospace" text-anchor="middle">release → ledger</text>
    </svg>
  </div>
</body>
</html>
