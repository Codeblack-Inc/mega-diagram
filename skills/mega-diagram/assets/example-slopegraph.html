<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>캐시 도입 전후 서비스별 p95 · 슬로프 그래프</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:  #ffffff;
      --color-ink:    #17152b;
      --color-muted:  #68657b;
      --color-accent: #2f6fdb;
      --font-sans:    'Geist', 'Pretendard', 'Noto Sans KR', system-ui, sans-serif;
      --font-serif:   'Instrument Serif', serif;
      --font-mono:    'Geist Mono', ui-monospace, monospace;
    }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 760px; display: block; }
      /* mega: Korean h1 is set in sans */
    h1 { font-family: var(--font-sans); font-weight: 700; letter-spacing: -0.03em; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Slopegraph · mega-diagram</p>
    <h1>한 서비스만 거꾸로 갔다</h1>

    <svg viewBox="0 0 1000 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="slopegraph-title slopegraph-desc">
      <title id="slopegraph-title">한 서비스만 거꾸로 갔다</title>
      <desc id="slopegraph-desc">캐시 계층 도입 전후 서비스별 p95 응답 시간을 100~550ms 공통 척도로 비교한 슬로프 그래프로, 네 서비스는 빨라지고 추천만 느려져 세 서비스와 교차한다.</desc>
      <defs>
        <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
          <circle cx="1" cy="1" r="0.9" fill="rgba(23,21,43,0.10)"/>
        </pattern>
      </defs>


      <!-- Both axes carry the SAME 100-550 ms scale. That is the whole claim of a
           slopegraph and the only thing that makes one slope comparable with
           another; scripts/verify-slopegraph.py enforces it against the values
           each line declares. -->
      <text transform="rotate(-90 24 230)" x="24" y="230" fill="#68657b" font-size="12" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="middle" font-weight="500">p95 응답 시간(ms)</text>

      <!-- No gridlines: every endpoint prints its own value, so a gridline would
           be ink carrying nothing. The two axis rules are the scale. -->
      <line x1="320" y1="40" x2="320" y2="420" stroke="rgba(23,21,43,0.25)" stroke-width="1"/>
      <text data-axis="from" data-state="도입 전" x="320" y="440" fill="#68657b" font-size="12" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="middle">도입 전</text>
      <line x1="680" y1="40" x2="680" y2="420" stroke="rgba(23,21,43,0.25)" stroke-width="1"/>
      <text data-axis="to" data-state="도입 후" x="680" y="440" fill="#68657b" font-size="12" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="middle">도입 후</text>

      <line data-series="검색" data-from="512" data-to="208" x1="320" y1="72.1" x2="680" y2="328.8" stroke="rgba(23,21,43,0.80)" stroke-width="1.2"/>
      <circle cx="320" cy="72.1" r="3" fill="rgba(23,21,43,0.80)"/>
      <circle cx="680" cy="328.8" r="3" fill="rgba(23,21,43,0.80)"/>
      <text data-series="검색" data-end="from" data-role="name" x="272" y="75.6" fill="#17152b" font-size="12" font-weight="500" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="end">검색</text>
      <text data-series="검색" data-end="from" x="304" y="75.6" fill="#68657b" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">512</text>
      <text data-series="검색" data-end="to" x="696" y="332.3" fill="#68657b" font-size="9" font-family="'Geist Mono', monospace">208</text>
      <text data-series="검색" data-end="to" data-role="name" x="728" y="332.3" fill="#17152b" font-size="12" font-weight="500" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">검색</text>

      <line data-series="카탈로그" data-from="376" data-to="164" x1="320" y1="186.9" x2="680" y2="366" stroke="rgba(23,21,43,0.74)" stroke-width="1.2"/>
      <circle cx="320" cy="186.9" r="3" fill="rgba(23,21,43,0.74)"/>
      <circle cx="680" cy="366" r="3" fill="rgba(23,21,43,0.74)"/>
      <text data-series="카탈로그" data-end="from" data-role="name" x="272" y="190.4" fill="#17152b" font-size="12" font-weight="500" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="end">카탈로그</text>
      <text data-series="카탈로그" data-end="from" x="304" y="190.4" fill="#68657b" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">376</text>
      <text data-series="카탈로그" data-end="to" x="696" y="369.5" fill="#68657b" font-size="9" font-family="'Geist Mono', monospace">164</text>
      <text data-series="카탈로그" data-end="to" data-role="name" x="728" y="369.5" fill="#17152b" font-size="12" font-weight="500" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">카탈로그</text>

      <line data-series="결제" data-from="291" data-to="143" x1="320" y1="258.7" x2="680" y2="383.7" stroke="rgba(23,21,43,0.68)" stroke-width="1.2"/>
      <circle cx="320" cy="258.7" r="3" fill="rgba(23,21,43,0.68)"/>
      <circle cx="680" cy="383.7" r="3" fill="rgba(23,21,43,0.68)"/>
      <text data-series="결제" data-end="from" data-role="name" x="272" y="262.2" fill="#17152b" font-size="12" font-weight="500" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="end">결제</text>
      <text data-series="결제" data-end="from" x="304" y="262.2" fill="#68657b" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">291</text>
      <text data-series="결제" data-end="to" x="696" y="387.2" fill="#68657b" font-size="9" font-family="'Geist Mono', monospace">143</text>
      <text data-series="결제" data-end="to" data-role="name" x="728" y="387.2" fill="#17152b" font-size="12" font-weight="500" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">결제</text>

      <line data-series="인증" data-from="154" data-to="121" x1="320" y1="374.4" x2="680" y2="402.3" stroke="rgba(23,21,43,0.62)" stroke-width="1.2"/>
      <circle cx="320" cy="374.4" r="3" fill="rgba(23,21,43,0.62)"/>
      <circle cx="680" cy="402.3" r="3" fill="rgba(23,21,43,0.62)"/>
      <text data-series="인증" data-end="from" data-role="name" x="272" y="377.9" fill="#17152b" font-size="12" font-weight="500" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="end">인증</text>
      <text data-series="인증" data-end="from" x="304" y="377.9" fill="#68657b" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">154</text>
      <text data-series="인증" data-end="to" x="696" y="405.8" fill="#68657b" font-size="9" font-family="'Geist Mono', monospace">121</text>
      <text data-series="인증" data-end="to" data-role="name" x="728" y="405.8" fill="#17152b" font-size="12" font-weight="500" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">인증</text>

      <!-- Recommender FOCAL -- and it is the series that got WORSE. The accent marks
           the editorially focal line, never the winner. Focus is carried by STROKE
           WEIGHT, not tone: the accent measures 2.86:1 on light paper, so on tone
           alone the focal line would read fainter than the ink ramp it is meant to
           dominate. Its labels stay ink/muted for the same reason -- accent text
           misses AA at this size. Being the only ascending line it crosses three of
           the other four -- not Auth, which starts and ends below it, because moving
           the opposite way does not guarantee meeting. The crossings are left
           unannotated: two endpoints say nothing about WHEN the regression started. -->
      <line data-series="추천" data-from="238" data-to="431" x1="320" y1="303.5" x2="680" y2="140.5" stroke="#2f6fdb" stroke-width="2.4"/>
      <circle cx="320" cy="303.5" r="4" fill="#2f6fdb"/>
      <circle cx="680" cy="140.5" r="4" fill="#2f6fdb"/>
      <text data-series="추천" data-end="from" data-role="name" x="272" y="307" fill="#17152b" font-size="12" font-weight="600" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="end">추천</text>
      <text data-series="추천" data-end="from" x="304" y="307" fill="#68657b" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">238</text>
      <text data-series="추천" data-end="to" x="696" y="144" fill="#68657b" font-size="9" font-family="'Geist Mono', monospace">431</text>
      <text data-series="추천" data-end="to" data-role="name" x="728" y="144" fill="#17152b" font-size="12" font-weight="600" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">추천</text>

      <!-- Legend -->
      <line x1="40" y1="462" x2="960" y2="462" stroke="rgba(23,21,43,0.10)" stroke-width="0.8"/>
      <text x="40" y="478" fill="#68657b" font-size="12" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" font-weight="500">범례</text>
      <text x="960" y="478" fill="#68657b" font-size="12" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="end" font-weight="500">p95 응답 시간(ms), 낮을수록 좋음 · 양축 동일 척도 100–550 · 예시 수치</text>

      <line x1="40" y1="492" x2="64" y2="492" stroke="#2f6fdb" stroke-width="2.4"/>
      <circle cx="52" cy="492" r="4" fill="#2f6fdb"/>
      <text x="72" y="496" fill="#68657b" font-size="12" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" font-weight="500">추천 · 초점, 유일한 악화</text>
      <line x1="320" y1="492" x2="344" y2="492" stroke="rgba(23,21,43,0.80)" stroke-width="1.2"/>
      <circle cx="332" cy="492" r="3" fill="rgba(23,21,43,0.80)"/>
      <text x="352" y="496" fill="#68657b" font-size="12" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" font-weight="500">기타 서비스 · 진할수록 도입 전 느림</text>
    </svg>
  </div>
</body>
</html>
