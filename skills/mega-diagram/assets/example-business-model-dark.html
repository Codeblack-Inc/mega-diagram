<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 비전 검사 비즈니스 모델</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #17152b;   /* deep warm charcoal */
      --color-ink:     #f6f5fa;   /* warm off-white */
      --color-muted:   #d4d2de;
      --color-accent:  #6e9bea;
      --font-sans:     'Geist', 'Pretendard', 'Noto Sans KR', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-sans);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Business model · mega-diagram</p>
    <h1>AI 비전 검사 비즈니스 모델</h1>

    <svg viewBox="0 0 1000 608" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="business-model-dark-title business-model-dark-desc">
      <title id="business-model-dark-title">AI 비전 검사 비즈니스 모델</title>
      <desc id="business-model-dark-desc">자사 플랫폼 비전라인 클라우드가 중소 부품 제조사에 검사 SaaS와 장비 키트를 제공하고 월 90만 원 구독료를 받으며, 부품사에 대당 38만 원, SI 파트너사에 판매 수수료 15%를 지급하고, 스마트공장 보급사업이 고객 도입비 50%를 보조하는 수익 구조도.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#d4d2de"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#6e9bea"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#9a86ec"/></marker>
      </defs>

      <!-- Flows first (behind boxes). Solid = 서비스·가치, dashed = 돈. Each pair runs on its own axis, 40px apart. -->
      <line x1="400" y1="256" x2="240" y2="256" stroke="#d4d2de" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="240" y1="296" x2="400" y2="296" stroke="#6e9bea" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#arrow-accent)"/>
      <line x1="760" y1="256" x2="600" y2="256" stroke="#d4d2de" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="600" y1="296" x2="760" y2="296" stroke="#d4d2de" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <line x1="488" y1="128" x2="488" y2="208" stroke="#d4d2de" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="536" y1="208" x2="536" y2="128" stroke="#d4d2de" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <path d="M 400,84 H 148 Q 140,84 140,92 V 216" fill="none" stroke="#d4d2de" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="140" y1="432" x2="140" y2="328" stroke="#d4d2de" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>

      <!-- Flow labels: 16px masks, 8px clear of their stroke, in open canvas -->
      <rect x="268" y="232" width="100" height="16" rx="2" fill="#17152b"/>
        <text x="318" y="244" fill="#d4d2de" font-size="12" font-weight="500" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="middle">검사 SaaS·키트</text>
      <rect x="260" y="304" width="116" height="16" rx="2" fill="#17152b"/>
        <text x="318" y="316" fill="#6e9bea" font-size="12" font-weight="500" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="middle">구독료 월 90만 원</text>
      <rect x="624" y="232" width="108" height="16" rx="2" fill="#17152b"/>
        <text x="678" y="244" fill="#d4d2de" font-size="12" font-weight="500" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="middle">카메라·조명 부품</text>
      <rect x="636" y="304" width="88" height="16" rx="2" fill="#17152b"/>
        <text x="680" y="316" fill="#d4d2de" font-size="12" font-weight="500" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="middle">대당 38만 원</text>
      <rect x="384" y="160" width="96" height="16" rx="2" fill="#17152b"/>
        <text x="432" y="172" fill="#d4d2de" font-size="12" font-weight="500" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="middle">고객 발굴·설치</text>
      <rect x="544" y="160" width="104" height="16" rx="2" fill="#17152b"/>
        <text x="596" y="172" fill="#d4d2de" font-size="12" font-weight="500" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="middle">판매 수수료 15%</text>
      <rect x="224" y="60" width="96" height="16" rx="2" fill="#17152b"/>
        <text x="272" y="72" fill="#d4d2de" font-size="12" font-weight="500" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="middle">현장 설치·교육</text>
      <rect x="148" y="372" width="104" height="16" rx="2" fill="#17152b"/>
        <text x="200" y="384" fill="#d4d2de" font-size="12" font-weight="500" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="middle">도입비 50% 보조</text>

      <!-- Parties: paper mask, styled box, caption, name, divider, bullets -->
      <!-- 파트너 · SI 파트너사 8곳 -->
      <rect x="400" y="40" width="200" height="88" rx="6" fill="#17152b"/>
      <rect x="400" y="40" width="200" height="88" rx="6" fill="#24223a" stroke="#f6f5fa" stroke-width="1"/>
      <text x="416" y="62" fill="#9d9ab0" font-size="12" font-weight="500" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">파트너</text>
      <text x="416" y="82" fill="#f6f5fa" font-size="12" font-weight="600" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">SI 파트너사 8곳</text>
      <text x="416" y="106" fill="#d4d2de" font-size="12" font-weight="400" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">설치·영업 대행</text>
      <!-- 고객 · 중소 부품 제조사 -->
      <rect x="40" y="216" width="200" height="112" rx="6" fill="#17152b"/>
      <rect x="40" y="216" width="200" height="112" rx="6" fill="rgba(212,210,222,0.10)" stroke="#9d9ab0" stroke-width="1"/>
      <text x="56" y="238" fill="#9d9ab0" font-size="12" font-weight="500" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">고객</text>
      <text x="56" y="258" fill="#f6f5fa" font-size="12" font-weight="600" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">중소 부품 제조사</text>
      <line x1="56" y1="272" x2="224" y2="272" stroke="rgba(246,245,250,0.12)" stroke-width="0.8"/>
      <circle cx="60" cy="290" r="1.5" fill="#d4d2de"/>
      <text x="68" y="294" fill="#d4d2de" font-size="12" font-weight="400" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">목표 1,200곳</text>
      <circle cx="60" cy="308" r="1.5" fill="#d4d2de"/>
      <text x="68" y="312" fill="#d4d2de" font-size="12" font-weight="400" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">생산 라인당 구독</text>
      <!-- 자사 플랫폼 · 비전라인 클라우드 -->
      <rect x="400" y="208" width="200" height="128" rx="6" fill="#17152b"/>
      <rect x="400" y="208" width="200" height="128" rx="6" fill="rgba(110,155,234,0.10)" stroke="#6e9bea" stroke-width="1"/>
      <text x="416" y="230" fill="#6e9bea" font-size="12" font-weight="500" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">자사 플랫폼</text>
      <text x="416" y="250" fill="#f6f5fa" font-size="12" font-weight="600" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">비전라인 클라우드</text>
      <line x1="416" y1="264" x2="584" y2="264" stroke="rgba(246,245,250,0.12)" stroke-width="0.8"/>
      <circle cx="420" cy="282" r="1.5" fill="#d4d2de"/>
      <text x="428" y="286" fill="#d4d2de" font-size="12" font-weight="400" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">AI 검사 모델</text>
      <circle cx="420" cy="300" r="1.5" fill="#d4d2de"/>
      <text x="428" y="304" fill="#d4d2de" font-size="12" font-weight="400" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">원격 모니터링</text>
      <circle cx="420" cy="318" r="1.5" fill="#d4d2de"/>
      <text x="428" y="322" fill="#d4d2de" font-size="12" font-weight="400" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">현장 재학습</text>
      <!-- 공급자 · 카메라·조명 부품사 -->
      <rect x="760" y="216" width="200" height="112" rx="6" fill="#17152b"/>
      <rect x="760" y="216" width="200" height="112" rx="6" fill="rgba(246,245,250,0.03)" stroke="rgba(246,245,250,0.3)" stroke-width="1"/>
      <text x="776" y="238" fill="#9d9ab0" font-size="12" font-weight="500" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">공급자</text>
      <text x="776" y="258" fill="#f6f5fa" font-size="12" font-weight="600" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">카메라·조명 부품사</text>
      <line x1="776" y1="272" x2="944" y2="272" stroke="rgba(246,245,250,0.12)" stroke-width="0.8"/>
      <circle cx="780" cy="290" r="1.5" fill="#d4d2de"/>
      <text x="788" y="294" fill="#d4d2de" font-size="12" font-weight="400" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">산업용 카메라</text>
      <circle cx="780" cy="308" r="1.5" fill="#d4d2de"/>
      <text x="788" y="312" fill="#d4d2de" font-size="12" font-weight="400" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">LED 조명·브래킷</text>
      <!-- 공공 지원 · 스마트공장 보급사업 -->
      <rect x="40" y="432" width="200" height="88" rx="6" fill="#17152b"/>
      <rect x="40" y="432" width="200" height="88" rx="6" fill="rgba(246,245,250,0.03)" stroke="rgba(246,245,250,0.3)" stroke-width="1"/>
      <text x="56" y="454" fill="#9d9ab0" font-size="12" font-weight="500" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">공공 지원</text>
      <text x="56" y="474" fill="#f6f5fa" font-size="12" font-weight="600" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">스마트공장 보급사업</text>
      <text x="56" y="498" fill="#d4d2de" font-size="12" font-weight="400" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">중소벤처기업부</text>

      <!-- Revenue summary: what the dashed inflows add up to -->
      <rect x="400" y="432" width="560" height="88" rx="6" fill="rgba(246,245,250,0.03)" stroke="rgba(246,245,250,0.3)" stroke-width="1"/>
      <text x="416" y="454" fill="#9d9ab0" font-size="12" font-weight="500" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">2028년 매출 목표</text>
      <text x="944" y="454" fill="#f6f5fa" font-size="14" font-weight="600" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="end">연 172억 원</text>
      <text x="416" y="480" fill="#f6f5fa" font-size="12" font-weight="600" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">구독료</text>
      <text x="496" y="480" fill="#d4d2de" font-size="12" font-weight="400" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">월 90만 원 × 1,200곳 × 12개월</text>
      <text x="944" y="480" fill="#f6f5fa" font-size="12" font-weight="600" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="end">130억 원</text>
      <text x="416" y="504" fill="#f6f5fa" font-size="12" font-weight="600" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">장비 키트</text>
      <text x="496" y="504" fill="#d4d2de" font-size="12" font-weight="400" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">대당 350만 원 × 1,200대</text>
      <text x="944" y="504" fill="#f6f5fa" font-size="12" font-weight="600" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="end">42억 원</text>

      <!-- Legend strip -->
      <line x1="40" y1="552" x2="960" y2="552" stroke="rgba(246,245,250,0.1)" stroke-width="0.8"/>
      <text x="40" y="584" fill="#d4d2de" font-size="12" font-weight="500" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">범례</text>
      <rect x="96" y="572" width="16" height="12" rx="2" fill="rgba(110,155,234,0.10)" stroke="#6e9bea" stroke-width="1"/>
      <text x="124" y="584" fill="#d4d2de" font-size="12" font-weight="500" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">자사 플랫폼</text>
      <line x1="224" y1="578" x2="244" y2="578" stroke="#d4d2de" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="252" y="584" fill="#d4d2de" font-size="12" font-weight="500" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">서비스·가치</text>
      <line x1="352" y1="578" x2="372" y2="578" stroke="#d4d2de" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <text x="380" y="584" fill="#d4d2de" font-size="12" font-weight="500" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">돈 흐름</text>
      <line x1="456" y1="578" x2="476" y2="578" stroke="#6e9bea" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#arrow-accent)"/>
      <text x="484" y="584" fill="#d4d2de" font-size="12" font-weight="500" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">핵심 수익</text>
    </svg>
  </div>
</body>
</html>
