<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>데이터 인재 요건 · 업무 × 분석 × 개발</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #17152b;
      --color-ink:     #f6f5fa;
      --color-muted:   #d4d2de;
      --color-accent:  #6e9bea;
      --font-sans:     'Geist', 'Pretendard', 'Noto Sans KR', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
    /* mega: Korean h1 is set in sans */
    h1 { font-family: var(--font-sans); font-weight: 700; letter-spacing: -0.03em; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Venn · mega-diagram</p>
    <h1>데이터 인재 요건 · 업무 × 분석 × 개발</h1>

    <svg viewBox="0 0 1000 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="venn-dark-title venn-dark-desc">
      <title id="venn-dark-title">데이터 인재 요건 · 업무 × 분석 × 개발</title>
      <desc id="venn-dark-desc">업무 이해, 분석 역량, 개발 역량 세 가지가 모두 겹치는 영역을 핵심 인재로 표시한 벤 다이어그램.</desc>
        <defs>
          <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r="0.9" fill="rgba(246,245,250,0.10)"/>
          </pattern>
          <clipPath id="clip-center">
            <circle cx="500" cy="180" r="140"/>
          </clipPath>
          <clipPath id="clip-center-2">
            <circle cx="428" cy="320" r="140"/>
          </clipPath>
        </defs>


        <!-- Three set circles (stroke + very-low-opacity tint; tints compound in overlaps) -->
        <!-- Desirable — top, ink -->
        <circle cx="500" cy="180" r="140" fill="rgba(246,245,250,0.04)" stroke="#f6f5fa" stroke-width="1"/>
        <!-- Feasible — bottom-left, muted -->
        <circle cx="428" cy="320" r="140" fill="rgba(212,210,222,0.05)" stroke="#d4d2de" stroke-width="1"/>
        <!-- Viable — bottom-right, soft -->
        <circle cx="572" cy="320" r="140" fill="rgba(157,154,176,0.05)" stroke="#9d9ab0" stroke-width="1"/>

        <!-- Coral focal tint on the all-three intersection -->
        <g clip-path="url(#clip-center)">
          <g clip-path="url(#clip-center-2)">
            <circle cx="572" cy="320" r="140" fill="rgba(110,155,234,0.14)"/>
          </g>
        </g>

        <!-- Set labels -->
        <text x="500" y="20" fill="#f6f5fa" font-size="14" font-weight="600" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="middle">업무 이해</text>
        <text x="500" y="36" fill="#d4d2de" font-size="12" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="middle" font-weight="500">행정 현장 경험</text>

        <text x="152" y="400" fill="#d4d2de" font-size="14" font-weight="600" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="start">분석 역량</text>
        <text x="152" y="416" fill="#d4d2de" font-size="12" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="start" font-weight="500">통계·모델링</text>

        <text x="848" y="400" fill="#9d9ab0" font-size="14" font-weight="600" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="end">개발 역량</text>
        <text x="848" y="416" fill="#d4d2de" font-size="12" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="end" font-weight="500">시스템 구현</text>

        <!-- Pairwise intersection labels -->
        <text x="416" y="232" fill="#d4d2de" font-size="12" font-weight="600" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="middle">업무 분석가</text>
        <text x="416" y="248" fill="#d4d2de" font-size="12" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="middle" font-weight="400">자동화 불가</text>

        <text x="584" y="232" fill="#d4d2de" font-size="12" font-weight="600" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="middle">현업 개발자</text>
        <text x="584" y="248" fill="#d4d2de" font-size="12" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="middle" font-weight="400">근거 부족</text>

        <text x="500" y="368" fill="#d4d2de" font-size="12" font-weight="600" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="middle">기술 전문가</text>
        <text x="500" y="384" fill="#d4d2de" font-size="12" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="middle" font-weight="400">현장 이해 부족</text>

        <!-- Focal: all-three center -->
        <text x="500" y="260" fill="#6e9bea" font-size="14" font-weight="600" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="middle">핵심 인재</text>
        <text x="500" y="276" fill="#d4d2de" font-size="12" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="middle" font-weight="500">채용 1순위</text>

        <!-- Legend strip -->
        <line x1="40" y1="456" x2="960" y2="456" stroke="rgba(246,245,250,0.10)" stroke-width="0.8"/>
        <text x="40" y="472" fill="#d4d2de" font-size="12" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" font-weight="500">범례</text>

        <circle cx="52" cy="488" r="6" fill="none" stroke="#6e9bea" stroke-width="1.2"/>
        <text x="68" y="492" fill="#d4d2de" font-size="12" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" font-weight="500">세 역량 모두 갖춤</text>

        <circle cx="192" cy="488" r="6" fill="none" stroke="#d4d2de" stroke-width="1"/>
        <text x="208" y="492" fill="#d4d2de" font-size="12" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" font-weight="500">두 역량만 갖춤</text>

        <text x="380" y="492" fill="#d4d2de" font-size="12" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" font-weight="500">강조색은 채용할 교집합에만 쓰고, 나머지 칸은 보완할 공백을 표시한다.</text>
      </svg>
  </div>
</body>
</html>
