<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>세계 인구 · 트리맵 · 다크</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:  #17152b;
      --color-ink:    #f6f5fa;
      --color-muted:  #d4d2de;
      --color-accent: #6e9bea;
      --font-sans:    'Geist', 'Pretendard', 'Noto Sans KR', system-ui, sans-serif;
      --font-serif:   'Instrument Serif', serif;
      --font-mono:    'Geist Mono', ui-monospace, monospace;
    }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 760px; display: block; }
      /* mega: Korean h1 is set in sans */
    h1 { font-family: var(--font-sans); font-weight: 700; letter-spacing: -0.03em; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Treemap · mega-diagram</p>
    <h1>세계 인구 · 6개 대륙</h1>

    <svg viewBox="0 0 1000 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="treemap-dark-title treemap-dark-desc">
      <title id="treemap-dark-title">세계 인구 · 6개 대륙</title>
      <desc id="treemap-dark-desc">2023년 중반 대륙별 세계 인구를 칸 면적으로 나타낸 트리맵으로, 아시아가 전체의 약 59%를 차지하고 1% 미만인 오세아니아는 너무 작아 라벨을 생략했다.</desc>
      <defs>
        <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
          <circle cx="1" cy="1" r="0.9" fill="rgba(246,245,250,0.08)"/>
        </pattern>
      </defs>


      <!-- ─── CELLS ─── Squarified layout on a 4px grid. Area is the only
           encoding: every cell is within 2.7% of its true share, measured as
           RELATIVE error, because a 0.1pp slip is nothing on Asia and a third
           of Oceania. Verified by scripts/verify-treemap.py. The non-focal
           cells run a rank-ordered ink ramp, so their order survives greyscale;
           the focal cell is marked by its accent stroke, not by tone. ─── -->

      <!-- Asia FOCAL: 532×380 -->
      <rect x="40" y="40" width="532" height="380" rx="2" fill="#17152b"/>
      <rect x="40" y="40" width="532" height="380" rx="2" data-share="59.04" fill="rgba(110,155,234,0.16)" stroke="#6e9bea" stroke-width="1.5"/>
      <text x="56" y="68" fill="#f6f5fa" font-size="14" font-weight="600" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">아시아</text>
      <text x="56" y="88" fill="#d4d2de" font-size="12" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" font-weight="500">47.8억 명 · 세계의 59%</text>

      <!-- Africa: 252×252 -->
      <rect x="576" y="40" width="252" height="252" rx="2" fill="#17152b"/>
      <rect x="576" y="40" width="252" height="252" rx="2" data-share="18.29" fill="rgba(246,245,250,0.14)" stroke="rgba(246,245,250,0.30)" stroke-width="1"/>
      <text x="592" y="68" fill="#f6f5fa" font-size="13" font-weight="600" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">아프리카</text>
      <text x="592" y="88" fill="#d4d2de" font-size="12" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" font-weight="500">14.8억 명 · 18%</text>

      <!-- Europe: 124×252 -->
      <rect x="832" y="40" width="124" height="252" rx="2" fill="#17152b"/>
      <rect x="832" y="40" width="124" height="252" rx="2" data-share="9.23" fill="rgba(246,245,250,0.11)" stroke="rgba(246,245,250,0.30)" stroke-width="1"/>
      <text x="848" y="68" fill="#f6f5fa" font-size="13" font-weight="600" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">유럽</text>
      <text x="848" y="88" fill="#d4d2de" font-size="12" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" font-weight="500">7.5억 명 · 9%</text>

      <!-- North America: 208×124 -->
      <rect x="576" y="296" width="208" height="124" rx="2" fill="#17152b"/>
      <rect x="576" y="296" width="208" height="124" rx="2" data-share="7.52" fill="rgba(246,245,250,0.08)" stroke="rgba(246,245,250,0.30)" stroke-width="1"/>
      <text x="592" y="324" fill="#f6f5fa" font-size="12" font-weight="600" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">북아메리카</text>
      <text x="592" y="344" fill="#d4d2de" font-size="12" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" font-weight="500">6.1억 명 · 8%</text>

      <!-- South America: 148×124 -->
      <rect x="788" y="296" width="148" height="124" rx="2" fill="#17152b"/>
      <rect x="788" y="296" width="148" height="124" rx="2" data-share="5.35" fill="rgba(246,245,250,0.06)" stroke="rgba(246,245,250,0.30)" stroke-width="1"/>
      <text x="804" y="324" fill="#f6f5fa" font-size="12" font-weight="600" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">남아메리카</text>
      <text x="804" y="344" fill="#d4d2de" font-size="12" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" font-weight="500">4.3억 명 · 5%</text>

      <!-- Oceania: 16×124. Too narrow for a label, so it carries the info mark
           rather than sideways text — the only rotated glyph in the figure would
           read as a mistake. The cell keeps its honest area and is named in the
           legend: a treemap must not silently omit a part of the whole it claims
           to show, but it need not label what it cannot label well. -->
      <rect x="940" y="296" width="16" height="124" rx="2" fill="#17152b"/>
      <rect x="940" y="296" width="16" height="124" rx="2" data-share="0.56" fill="rgba(246,245,250,0.04)" stroke="rgba(246,245,250,0.30)" stroke-width="1"/>
      <circle cx="948" cy="320" r="5" fill="#f6f5fa"/>
      <text x="948" y="323" fill="#17152b" font-size="7" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">i</text>

      <!-- Legend -->
      <line x1="40" y1="462" x2="960" y2="462" stroke="rgba(246,245,250,0.08)" stroke-width="0.8"/>
      <text x="40" y="478" fill="#d4d2de" font-size="12" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" font-weight="500">범례</text>
      <text x="960" y="478" fill="#d4d2de" font-size="12" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="end" font-weight="500">면적 = 인구 · Our World in Data 대륙 구분(UN WPP) · 2023년 중반 · 총 80.9억 명 · 반올림으로 합계 불일치 가능</text>

      <rect x="40" y="488" width="16" height="10" rx="2" fill="rgba(110,155,234,0.16)" stroke="#6e9bea" stroke-width="1"/>
      <text x="64" y="497" fill="#d4d2de" font-size="12" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" font-weight="500">아시아 · 강조 대상</text>

      <rect x="240" y="488" width="16" height="10" rx="2" fill="rgba(246,245,250,0.14)" stroke="rgba(246,245,250,0.30)" stroke-width="1"/>
      <text x="264" y="497" fill="#d4d2de" font-size="12" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" font-weight="500">기타 대륙 · 대비가 강할수록 큼</text>

      <circle cx="516" cy="493" r="5" fill="#f6f5fa"/>
      <text x="516" y="496" fill="#17152b" font-size="7" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">i</text>
      <text x="532" y="497" fill="#d4d2de" font-size="12" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" font-weight="500">오세아니아 · 0.5억 명, 0.6% · 칸이 좁아 라벨 생략</text>
    </svg>
  </div>
</body>
</html>
