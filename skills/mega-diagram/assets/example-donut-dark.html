<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2026년 수소 저장 실증 과제 예산 구성</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #17152b;
      --color-ink:     #f6f5fa;
      --color-muted:   #d4d2de;
      --color-accent:  #6e9bea;
      --font-sans:     'Geist', 'Pretendard', 'Noto Sans KR', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1100px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-sans);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 800px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Donut · mega-diagram</p>
    <h1>2026년 수소 저장 실증 과제 예산 구성</h1>

    <svg viewBox="0 0 1000 448" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="donut-dark-title donut-dark-desc">
      <title id="donut-dark-title">2026년 수소 저장 실증 과제 예산 구성</title>
      <desc id="donut-dark-desc">한빛에너지연구원 수소 저장 실증 과제의 2026년 총 예산 50.0억 원을 인건비 19.0억 원(38.0%), 연구장비 13.5억 원(27.0%), 재료비 8.0억 원(16.0%), 위탁연구 5.5억 원(11.0%), 간접비 4.0억 원(8.0%)으로 나눈 도넛 차트로, 전년 대비 가장 크게 늘어난 연구장비를 강조한다.</desc>

      <!-- Segments: clockwise from the computed start angle, largest first; paper-stroke separators -->
      <path d="M605.31,302.21 A144,144 0 0 1 356,204.5 L408,204.32 A92,92 0 0 0 567.28,266.74 Z" fill="rgba(246,245,250,0.56)" stroke="#17152b" stroke-width="2"/>
      <!-- Focal segment: accent element 1 -->
      <path d="M356,204.5 A144,144 0 0 1 517.55,61.07 L511.21,112.69 A92,92 0 0 0 408,204.32 Z" fill="#6e9bea" stroke="#17152b" stroke-width="2"/>
      <path d="M517.55,61.07 A144,144 0 0 1 630.08,142.23 L583.11,164.54 A92,92 0 0 0 511.21,112.69 Z" fill="rgba(246,245,250,0.36)" stroke="#17152b" stroke-width="2"/>
      <path d="M630.08,142.23 A144,144 0 0 1 639.6,239.32 L589.19,226.57 A92,92 0 0 0 583.11,164.54 Z" fill="rgba(246,245,250,0.22)" stroke="#17152b" stroke-width="2"/>
      <path d="M639.6,239.32 A144,144 0 0 1 605.31,302.21 L567.28,266.74 A92,92 0 0 0 589.19,226.57 Z" fill="rgba(246,245,250,0.12)" stroke="#17152b" stroke-width="2"/>

      <!-- Center total -->
      <text x="500" y="192" fill="#d4d2de" font-size="12" font-weight="500" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="middle">2026년 총 예산</text>
      <text x="500" y="226" fill="#f6f5fa" font-size="28" font-weight="600" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="middle">50.0억 원</text>

      <!-- Direct labels: horizontal leaders from each arc midpoint -->
      <line x1="446.15" y1="344" x2="300" y2="344" stroke="#d4d2de" stroke-width="1"/>
      <circle cx="446.15" cy="344" r="2" fill="#d4d2de"/>
      <text x="292" y="348" fill="#f6f5fa" font-size="12" font-weight="600" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="end">인건비</text>
      <text x="292" y="366" fill="#d4d2de" font-size="12" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="end">19.0억 원 · 38.0%</text>
      <line x1="400.22" y1="92" x2="300" y2="92" stroke="#6e9bea" stroke-width="1"/>
      <circle cx="400.22" cy="92" r="2" fill="#6e9bea"/>
      <text x="292" y="96" fill="#6e9bea" font-size="12" font-weight="600" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="end">연구장비</text>
      <text x="292" y="114" fill="#6e9bea" font-size="12" font-weight="500" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="end">13.5억 원 · 27.0%</text>
      <line x1="587.27" y1="82" x2="700" y2="82" stroke="#d4d2de" stroke-width="1"/>
      <circle cx="587.27" cy="82" r="2" fill="#d4d2de"/>
      <text x="708" y="86" fill="#f6f5fa" font-size="12" font-weight="600" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="start">재료비</text>
      <text x="708" y="104" fill="#d4d2de" font-size="12" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="start">8.0억 원 · 16.0%</text>
      <line x1="649.25" y1="189" x2="700" y2="189" stroke="#d4d2de" stroke-width="1"/>
      <circle cx="649.25" cy="189" r="2" fill="#d4d2de"/>
      <text x="708" y="193" fill="#f6f5fa" font-size="12" font-weight="600" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="start">위탁연구</text>
      <text x="708" y="211" fill="#d4d2de" font-size="12" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="start">5.5억 원 · 11.0%</text>
      <line x1="631.59" y1="276" x2="700" y2="276" stroke="#d4d2de" stroke-width="1"/>
      <circle cx="631.59" cy="276" r="2" fill="#d4d2de"/>
      <text x="708" y="280" fill="#f6f5fa" font-size="12" font-weight="600" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="start">간접비</text>
      <text x="708" y="298" fill="#d4d2de" font-size="12" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="start">4.0억 원 · 8.0%</text>

      <!-- Legend -->
      <line x1="32" y1="384" x2="968" y2="384" stroke="rgba(246,245,250,0.1)" stroke-width="0.8"/>
      <text x="32" y="402" fill="#d4d2de" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>
      <rect x="32" y="414" width="12" height="12" rx="2" fill="#6e9bea"/>
      <text x="52" y="424" fill="#d4d2de" font-size="12" font-weight="500" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">중점 비목 (전년 대비 +42%)</text>
      <rect x="264" y="414" width="12" height="12" rx="2" fill="rgba(246,245,250,0.36)"/>
      <text x="284" y="424" fill="#d4d2de" font-size="12" font-weight="500" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">기타 비목</text>
      <text x="968" y="424" fill="#d4d2de" font-size="12" font-weight="500" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="end">단위: 억 원 · 비율은 총 예산 대비</text>
    </svg>
  </div>
</body>
</html>
