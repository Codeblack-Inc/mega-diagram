<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>보고서 도구 1차 출시 · 사용자 스토리 맵</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #ffffff;
      --color-ink:     #17152b;
      --color-muted:   #68657b;
      --color-accent:  #2f6fdb;
      --font-sans:     'Geist', 'Pretendard', 'Noto Sans KR', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
      /* mega: Korean h1 is set in sans */
    h1 { font-family: var(--font-sans); font-weight: 700; letter-spacing: -0.03em; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">User story map · mega-diagram</p>
    <h1>보고서 도구 1차 출시</h1>

    <svg viewBox="0 0 1032 540" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="story-map-title story-map-desc">
      <title id="story-map-title">보고서 도구 1차 출시 · 사용자 스토리 맵</title>
      <desc id="story-map-desc">사내 보고서 도구 1차 출시를 위한 사용자 스토리 맵으로, 데이터 찾기부터 신뢰 확인까지 네 가지 활동과 그 아래 단계, MVP·2차 출시·이후의 세 구간을 보여 준다.</desc>
      <defs>
        <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
          <circle cx="1" cy="1" r="0.9" fill="rgba(23,21,43,0.10)"/>
        </pattern>
      </defs>


      <!-- Release slice bands (alternating fill) -->
      <rect x="32" y="216" width="968" height="80" fill="rgba(23,21,43,0.02)"/>
      <rect x="32" y="376" width="968" height="80" fill="rgba(23,21,43,0.02)"/>

      <text x="48" y="260" fill="#68657b" font-size="12" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" font-weight="500">MVP</text>
      <text x="48" y="340" fill="#68657b" font-size="12" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" font-weight="500">2차 출시</text>
      <text x="48" y="420" fill="#68657b" font-size="12" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" font-weight="500">이후</text>

      <!-- Column separators: tie each card row to its activity column -->
      <line x1="116" y1="108" x2="116" y2="456" stroke="rgba(23,21,43,0.10)" stroke-width="0.8" stroke-dasharray="4,4"/>
      <line x1="340" y1="108" x2="340" y2="456" stroke="rgba(23,21,43,0.10)" stroke-width="0.8" stroke-dasharray="4,4"/>
      <line x1="564" y1="108" x2="564" y2="456" stroke="rgba(23,21,43,0.10)" stroke-width="0.8" stroke-dasharray="4,4"/>
      <line x1="788" y1="108" x2="788" y2="456" stroke="rgba(23,21,43,0.10)" stroke-width="0.8" stroke-dasharray="4,4"/>
      <line x1="1012" y1="108" x2="1012" y2="456" stroke="rgba(23,21,43,0.10)" stroke-width="0.8" stroke-dasharray="4,4"/>

      <!-- Backbone: 4 activities, narrative left-to-right order -->
      <rect x="128" y="40" width="200" height="64" rx="6" fill="rgba(23,21,43,0.05)" stroke="#68657b" stroke-width="1"/>
      <text x="228" y="68" fill="#17152b" font-size="12" font-weight="600" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="middle">데이터 찾기</text>
      <text x="228" y="88" fill="#68657b" font-size="12" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="middle" font-weight="500">활동 1</text>

      <rect x="352" y="40" width="200" height="64" rx="6" fill="rgba(23,21,43,0.05)" stroke="#68657b" stroke-width="1"/>
      <text x="452" y="68" fill="#17152b" font-size="12" font-weight="600" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="middle">보고서 작성</text>
      <text x="452" y="88" fill="#68657b" font-size="12" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="middle" font-weight="500">활동 2</text>

      <rect x="576" y="40" width="200" height="64" rx="6" fill="rgba(23,21,43,0.05)" stroke="#68657b" stroke-width="1"/>
      <text x="676" y="68" fill="#17152b" font-size="12" font-weight="600" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="middle">공유</text>
      <text x="676" y="88" fill="#68657b" font-size="12" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="middle" font-weight="500">활동 3</text>

      <rect x="800" y="40" width="200" height="64" rx="6" fill="rgba(23,21,43,0.05)" stroke="#68657b" stroke-width="1"/>
      <text x="900" y="68" fill="#17152b" font-size="12" font-weight="600" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="middle">신뢰 확인</text>
      <text x="900" y="88" fill="#68657b" font-size="12" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="middle" font-weight="500">활동 4</text>

      <!-- Walking skeleton: user steps under each activity -->
      <rect x="144" y="120" width="168" height="32" rx="4" fill="#ffffff" stroke="#17152b" stroke-width="0.8"/>
      <text x="156" y="140" fill="#17152b" font-size="12" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">데이터셋 검색</text>
      <rect x="144" y="160" width="168" height="32" rx="4" fill="#ffffff" stroke="#17152b" stroke-width="0.8"/>
      <text x="156" y="180" fill="#17152b" font-size="12" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">행 미리보기</text>

      <rect x="368" y="120" width="168" height="32" rx="4" fill="#ffffff" stroke="#17152b" stroke-width="0.8"/>
      <text x="380" y="140" fill="#17152b" font-size="12" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">열 선택</text>
      <rect x="368" y="160" width="168" height="32" rx="4" fill="#ffffff" stroke="#17152b" stroke-width="0.8"/>
      <text x="380" y="180" fill="#17152b" font-size="12" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">차트 추가</text>

      <rect x="592" y="120" width="168" height="32" rx="4" fill="#ffffff" stroke="#17152b" stroke-width="0.8"/>
      <text x="604" y="140" fill="#17152b" font-size="12" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">링크 전송</text>

      <rect x="816" y="120" width="168" height="32" rx="4" fill="#ffffff" stroke="#17152b" stroke-width="0.8"/>
      <text x="828" y="140" fill="#17152b" font-size="12" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">갱신 시점 확인</text>

      <!-- MVP row story cards -->
      <rect x="144" y="232" width="168" height="48" rx="4" fill="#ffffff" stroke="#17152b" stroke-width="1"/>
      <text x="156" y="250" fill="#17152b" font-size="12" font-weight="600" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">키워드 검색</text>
      <text x="156" y="266" fill="#68657b" font-size="9" font-family="'Geist Mono', monospace">RPT-101 · 3pt</text>

      <rect x="368" y="232" width="168" height="48" rx="4" fill="#ffffff" stroke="#17152b" stroke-width="1"/>
      <text x="380" y="250" fill="#17152b" font-size="12" font-weight="600" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">표 + 차트 1개</text>
      <text x="380" y="266" fill="#68657b" font-size="9" font-family="'Geist Mono', monospace">RPT-102 · 5pt</text>

      <rect x="592" y="232" width="168" height="48" rx="4" fill="#ffffff" stroke="#17152b" stroke-width="1"/>
      <text x="604" y="250" fill="#17152b" font-size="12" font-weight="600" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">공개 링크</text>
      <text x="604" y="266" fill="#68657b" font-size="9" font-family="'Geist Mono', monospace">RPT-103 · 2pt</text>

      <rect x="816" y="232" width="168" height="48" rx="4" fill="#ffffff" stroke="#17152b" stroke-width="1"/>
      <text x="828" y="250" fill="#17152b" font-size="12" font-weight="600" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">최종 갱신 표시</text>
      <text x="828" y="266" fill="#68657b" font-size="9" font-family="'Geist Mono', monospace">RPT-104 · 1pt</text>

      <!-- Release cut line — accent element 1 -->
      <line x1="32" y1="296" x2="1000" y2="296" stroke="#2f6fdb" stroke-width="1.5"/>
      <rect x="766" y="276" width="44" height="16" rx="2" fill="#ffffff"/>
      <text x="788" y="288" fill="#2f6fdb" font-size="12" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="middle" font-weight="500">출시선</text>

      <!-- Release 2 row story cards -->
      <rect x="144" y="312" width="168" height="48" rx="4" fill="#ffffff" stroke="#17152b" stroke-width="1"/>
      <text x="156" y="330" fill="#17152b" font-size="12" font-weight="600" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">필터 저장</text>
      <text x="156" y="346" fill="#68657b" font-size="9" font-family="'Geist Mono', monospace">RPT-110 · 3pt</text>

      <rect x="592" y="312" width="168" height="48" rx="4" fill="#ffffff" stroke="#17152b" stroke-width="1"/>
      <text x="604" y="330" fill="#17152b" font-size="12" font-weight="600" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">정기 메일 발송</text>
      <text x="604" y="346" fill="#68657b" font-size="9" font-family="'Geist Mono', monospace">RPT-112 · 5pt</text>

      <!-- Riskiest story — accent element 2 -->
      <rect x="816" y="312" width="168" height="48" rx="4" fill="rgba(47,111,219,0.05)" stroke="#2f6fdb" stroke-width="1" stroke-dasharray="4,4"/>
      <text x="828" y="330" fill="#17152b" font-size="12" font-weight="600" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">행 단위 권한</text>
      <text x="828" y="346" fill="#68657b" font-size="9" font-family="'Geist Mono', monospace">RPT-114 · 3pt</text>
      <rect x="936" y="336" width="40" height="12" rx="2" fill="transparent" stroke="#2f6fdb" stroke-width="0.8"/>
      <text x="956" y="345" fill="#2f6fdb" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">RISK</text>

      <!-- Later row story cards -->
      <rect x="144" y="392" width="168" height="48" rx="4" fill="#ffffff" stroke="#17152b" stroke-width="1"/>
      <text x="156" y="410" fill="#17152b" font-size="12" font-weight="600" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">자연어 질의</text>
      <text x="156" y="426" fill="#68657b" font-size="9" font-family="'Geist Mono', monospace">RPT-120 · 8pt</text>

      <rect x="816" y="392" width="168" height="48" rx="4" fill="#ffffff" stroke="#17152b" stroke-width="1"/>
      <text x="828" y="410" fill="#17152b" font-size="12" font-weight="600" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">이상치 알림</text>
      <text x="828" y="426" fill="#68657b" font-size="9" font-family="'Geist Mono', monospace">RPT-121 · 5pt</text>

      <!-- Legend -->
      <line x1="32" y1="480" x2="1000" y2="480" stroke="rgba(23,21,43,0.10)" stroke-width="0.8"/>
      <text x="32" y="496" fill="#68657b" font-size="12" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" font-weight="500">범례</text>

      <rect x="32" y="508" width="16" height="8" fill="#ffffff" stroke="#17152b" stroke-width="1"/>
      <text x="56" y="516" fill="#68657b" font-size="12" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" font-weight="500">스토리 카드</text>

      <rect x="232" y="508" width="16" height="8" fill="rgba(47,111,219,0.05)" stroke="#2f6fdb" stroke-width="1" stroke-dasharray="4,4"/>
      <text x="256" y="516" fill="#68657b" font-size="12" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" font-weight="500">최고 위험</text>

      <line x1="432" y1="512" x2="464" y2="512" stroke="#2f6fdb" stroke-width="1.5"/>
      <text x="480" y="516" fill="#68657b" font-size="12" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" font-weight="500">출시선</text>
    </svg>
  </div>
</body>
</html>
