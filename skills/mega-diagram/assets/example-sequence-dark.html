<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>기사 조회 · 캐시 미스</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #17152b;
      --color-ink:     #f6f5fa;
      --color-muted:   #d4d2de;
      --color-accent:  #6e9bea;
      --font-sans:     'Geist', 'Pretendard', 'Noto Sans KR', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
      /* mega: Korean h1 is set in sans */
    h1 { font-family: var(--font-sans); font-weight: 700; letter-spacing: -0.03em; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Sequence · Cold cache</p>
    <h1>기사 조회, 캐시 미스</h1>

    <svg viewBox="0 0 1000 584" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="sequence-dark-title sequence-dark-desc">
      <title id="sequence-dark-title">기사 조회, 캐시 미스</title>
      <desc id="sequence-dark-desc">캐시에 없는 기사를 요청했을 때 이용자 브라우저에서 Cloudflare, 원본 서버, 이용 통계 수집기까지 오가는 메시지를 보여 주는 시퀀스 다이어그램.</desc>
        <defs>
          <!-- Dot grid background -->
          <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r="0.9" fill="rgba(246,245,250,0.10)"/>
          </pattern>

          <!-- Arrow markers -->
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#d4d2de"/>
          </marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#6e9bea"/>
          </marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#9a86ec"/>
          </marker>
        </defs>

        <!-- Background: paper + dot grid -->

        <!-- =================================================================
             LIFELINES — dashed vertical lines from each actor, behind everything.
             Actor lifeline x-coords: 128, 352, 584, 800
             ================================================================= -->
        <line x1="128" y1="128" x2="128" y2="488" stroke="rgba(246,245,250,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="352" y1="128" x2="352" y2="488" stroke="rgba(246,245,250,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="584" y1="128" x2="584" y2="488" stroke="rgba(246,245,250,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="800" y1="128" x2="800" y2="488" stroke="rgba(246,245,250,0.22)" stroke-width="1" stroke-dasharray="3,3"/>

        <!-- =================================================================
             ACTIVATION BARS — w=8 rects on lifelines showing control duration.
             Drawn before message arrows so arrows land on their edges.
             ================================================================= -->
        <!-- Cloudflare activation: receives at y=176, responds at y=408 -->
        <rect x="348" y="180" width="8" height="232" fill="rgba(246,245,250,0.06)" stroke="#d4d2de" stroke-width="0.8"/>
        <!-- Astro activation: called at y=232, returns at y=352 -->
        <rect x="580" y="236" width="8" height="120" fill="rgba(246,245,250,0.06)" stroke="#d4d2de" stroke-width="0.8"/>

        <!-- =================================================================
             MESSAGE ARROWS — time flows top→down.
             Draw before labels so label masks cover the line.
             ================================================================= -->

        <!-- M1: Reader → Cloudflare  (HTTPS request · link-blue) -->
        <line x1="128" y1="176" x2="352" y2="176" stroke="#9a86ec" stroke-width="1.2" marker-end="url(#arrow-link)"/>

        <!-- M2: Cloudflare → Astro  (cache miss · muted) -->
        <line x1="352" y1="232" x2="580" y2="232" stroke="#d4d2de" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- M3: Astro self-message  (render MDX · muted U-loop) -->
        <path d="M 588 284 L 624 284 L 624 316 L 588 316" fill="none" stroke="#d4d2de" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- M4: Astro → Cloudflare  (return HTML · muted dashed) -->
        <line x1="580" y1="352" x2="356" y2="352" stroke="#d4d2de" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>

        <!-- M5: Cloudflare → Reader  (primary success · coral) -->
        <line x1="348" y1="408" x2="128" y2="408" stroke="#6e9bea" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

        <!-- M6: Reader → Analytics  (async beacon · muted dashed) -->
        <line x1="128" y1="464" x2="800" y2="464" stroke="#d4d2de" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>

        <!-- =================================================================
             MESSAGE LABELS — each with an opaque paper-colored mask.
             ================================================================= -->

        <!-- M1 label -->
        <rect x="188" y="160" width="104" height="12" rx="2" fill="#17152b"/>
        <text x="240" y="170" fill="#9a86ec" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">GET /ARTICLES/SLUG</text>

        <!-- M2 label -->
        <rect x="396" y="214" width="140" height="16" rx="2" fill="#17152b"/>
        <text x="466" y="226" fill="#d4d2de" font-size="12" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="middle" font-weight="500">캐시 미스 · 원본 요청</text>

        <!-- M3 label (to the right of the self-loop) -->
        <rect x="630" y="290" width="76" height="16" rx="2" fill="#17152b"/>
        <text x="668" y="302" fill="#d4d2de" font-size="12" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="middle" font-weight="500">MDX 렌더링</text>

        <!-- M4 label -->
        <rect x="420" y="336" width="96" height="12" rx="2" fill="#17152b"/>
        <text x="468" y="346" fill="#d4d2de" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">200 · HTML + MAX-AGE</text>

        <!-- M5 label (coral · primary response) -->
        <rect x="192" y="392" width="96" height="12" rx="2" fill="#17152b"/>
        <text x="240" y="402" fill="#6e9bea" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">200 · EDGE-CACHED</text>

        <!-- M6 label (placed between Astro and Analytics lifelines, a clear gap) -->
        <rect x="648" y="446" width="96" height="16" rx="2" fill="#17152b"/>
        <text x="696" y="458" fill="#d4d2de" font-size="12" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="middle" font-weight="500">조회 기록 전송</text>

        <!-- =================================================================
             ACTOR BOXES — drawn after arrows/labels.
             Each actor: 144–160 wide × 56 tall. Centers: 128, 352, 584, 800.
             ================================================================= -->

        <!-- Actor 1: Reader (external / soft) -->
        <rect x="56" y="72" width="144" height="56" rx="6" fill="#17152b"/>
        <rect x="56" y="72" width="144" height="56" rx="6" fill="rgba(212,210,222,0.10)" stroke="#9d9ab0" stroke-width="1"/>
        <rect x="64" y="80" width="28" height="12" rx="2" fill="transparent" stroke="rgba(157,154,176,0.40)" stroke-width="0.8"/>
        <text x="78" y="89" fill="#9d9ab0" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EXT</text>
        <text x="128" y="104" fill="#f6f5fa" font-size="12" font-weight="600" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="middle">이용자</text>
        <text x="128" y="119" fill="#d4d2de" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Browser</text>

        <!-- Actor 2: Cloudflare (cloud / muted) -->
        <rect x="280" y="72" width="144" height="56" rx="6" fill="#17152b"/>
        <rect x="280" y="72" width="144" height="56" rx="6" fill="rgba(246,245,250,0.03)" stroke="rgba(246,245,250,0.30)" stroke-width="1"/>
        <rect x="288" y="80" width="32" height="12" rx="2" fill="transparent" stroke="rgba(246,245,250,0.22)" stroke-width="0.8"/>
        <text x="304" y="89" fill="#9d9ab0" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EDGE</text>
        <text x="352" y="104" fill="#f6f5fa" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Cloudflare</text>
        <text x="352" y="119" fill="#d4d2de" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Pages · cache</text>

        <!-- Actor 3: Astro Origin (focal / coral) -->
        <rect x="504" y="72" width="160" height="56" rx="6" fill="#17152b"/>
        <rect x="504" y="72" width="160" height="56" rx="6" fill="rgba(110,155,234,0.08)" stroke="#6e9bea" stroke-width="1"/>
        <rect x="512" y="80" width="32" height="12" rx="2" fill="transparent" stroke="rgba(110,155,234,0.50)" stroke-width="0.8"/>
        <text x="528" y="89" fill="#6e9bea" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ORIG</text>
        <text x="584" y="104" fill="#f6f5fa" font-size="12" font-weight="600" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="middle">원본 서버</text>
        <text x="584" y="119" fill="#d4d2de" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">SSR + MDX</text>

        <!-- Actor 4: Analytics (optional / dashed) -->
        <rect x="728" y="72" width="144" height="56" rx="6" fill="#17152b"/>
        <rect x="728" y="72" width="144" height="56" rx="6" fill="rgba(246,245,250,0.02)" stroke="rgba(246,245,250,0.22)" stroke-width="1" stroke-dasharray="4,3"/>
        <rect x="736" y="80" width="28" height="12" rx="2" fill="transparent" stroke="rgba(246,245,250,0.22)" stroke-width="0.8"/>
        <text x="750" y="89" fill="#9d9ab0" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ASY</text>
        <text x="800" y="104" fill="#f6f5fa" font-size="12" font-weight="600" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="middle">이용 통계</text>
        <text x="800" y="119" fill="#d4d2de" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Beacon · async</text>

        <!-- =================================================================
             LEGEND — horizontal strip at the bottom.
             Separator at y=504, eyebrow at y=520, items at y=540–548.
             ================================================================= -->
        <line x1="56" y1="504" x2="944" y2="504" stroke="rgba(246,245,250,0.10)" stroke-width="0.8"/>
        <text x="56" y="520" fill="#d4d2de" font-size="12" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" font-weight="500">범례</text>

        <!-- Item 1: Actor swatch (coral focal) -->
        <rect x="56" y="540" width="14" height="10" rx="2" fill="rgba(110,155,234,0.08)" stroke="#6e9bea" stroke-width="1"/>
        <text x="76" y="548" fill="#d4d2de" font-size="12" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" font-weight="500">핵심 참여자</text>

        <!-- Item 2: Activation bar swatch -->
        <rect x="188" y="536" width="4" height="18" fill="rgba(246,245,250,0.06)" stroke="#d4d2de" stroke-width="0.8"/>
        <text x="200" y="548" fill="#d4d2de" font-size="12" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" font-weight="500">활성 구간</text>

        <!-- Item 3: Request arrow (link-blue) -->
        <line x1="308" y1="546" x2="336" y2="546" stroke="#9a86ec" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <text x="344" y="548" fill="#d4d2de" font-size="12" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" font-weight="500">HTTP 요청</text>

        <!-- Item 4: Return / async (muted dashed) -->
        <line x1="476" y1="546" x2="504" y2="546" stroke="#d4d2de" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <text x="512" y="548" fill="#d4d2de" font-size="12" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" font-weight="500">응답·비동기</text>

        <!-- Item 5: Primary response (coral) -->
        <line x1="652" y1="546" x2="680" y2="546" stroke="#6e9bea" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <text x="688" y="548" fill="#d4d2de" font-size="12" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" font-weight="500">주 응답</text>

      </svg>
  </div>
</body>
</html>
