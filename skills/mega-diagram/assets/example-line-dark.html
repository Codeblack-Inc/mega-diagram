<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>주간 신규 가입자 · 꺾은선 차트 · 다크</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --color-paper:#17152b; --color-ink:#f6f5fa; --color-muted:#d4d2de; --color-accent:#6e9bea; --font-sans:'Geist', 'Pretendard', 'Noto Sans KR', system-ui,sans-serif; --font-serif:'Instrument Serif',serif; --font-mono:'Geist Mono',ui-monospace,monospace; }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 760px; display: block; }
      /* mega: Korean h1 is set in sans */
    h1 { font-family: var(--font-sans); font-weight: 700; letter-spacing: -0.03em; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Line · mega-diagram</p>
    <h1>주간 신규 가입자 · 검색 유입이 성장 주도</h1>

    <svg viewBox="0 0 1000 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="line-dark-title line-dark-desc">
      <title id="line-dark-title">주간 신규 가입자 · 검색 유입이 성장 주도</title>
      <desc id="line-dark-desc">검색·직접·제휴 유입 채널별 주간 신규 가입자 수를 1주부터 8주까지 보여 주는 꺾은선 차트.</desc>
      <defs>
        <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
          <circle cx="1" cy="1" r="0.9" fill="rgba(246,245,250,0.10)"/>
        </pattern>
      </defs>


      <!-- Y-axis rotated label -->
      <text transform="rotate(-90 24 230)" x="24" y="230" fill="#d4d2de" font-size="12" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="middle" font-weight="500">주간 가입자(명)</text>

      <!-- Gridlines -->
      <line x1="80" y1="357" x2="960" y2="357" stroke="rgba(246,245,250,0.08)" stroke-width="0.8"/>
      <line x1="80" y1="293" x2="960" y2="293" stroke="rgba(246,245,250,0.08)" stroke-width="0.8"/>
      <line x1="80" y1="230" x2="960" y2="230" stroke="rgba(246,245,250,0.08)" stroke-width="0.8"/>
      <line x1="80" y1="167" x2="960" y2="167" stroke="rgba(246,245,250,0.08)" stroke-width="0.8"/>
      <line x1="80" y1="103" x2="960" y2="103" stroke="rgba(246,245,250,0.08)" stroke-width="0.8"/>
      <line x1="80" y1="40"  x2="960" y2="40"  stroke="rgba(246,245,250,0.06)" stroke-width="0.8"/>

      <!-- Axes -->
      <line x1="80" y1="40" x2="80" y2="420" stroke="rgba(246,245,250,0.20)" stroke-width="1"/>
      <line x1="80" y1="420" x2="960" y2="420" stroke="rgba(246,245,250,0.20)" stroke-width="1"/>

      <!-- Y-axis labels -->
      <text x="72" y="361" fill="#d4d2de" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">40</text>
      <text x="72" y="297" fill="#d4d2de" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">80</text>
      <text x="72" y="234" fill="#d4d2de" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">120</text>
      <text x="72" y="171" fill="#d4d2de" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">160</text>
      <text x="72" y="107" fill="#d4d2de" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">200</text>
      <text x="72" y="44"  fill="#d4d2de" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">240</text>

      <!-- ─── SERIES (non-focal drawn first) ─── -->
      <!-- Referral: [45,52,48,60,55,68,62,75] series-2 dusty-blue -->
      <polyline points="80,349 200,338 320,344 440,325 560,333 680,312 800,322 920,301"
                fill="none" stroke="#82a0c0" stroke-width="1.2" stroke-linejoin="round"/>

      <!-- Direct: [80,82,88,90,86,92,95,98] series-1 sage -->
      <polyline points="80,293 200,290 320,281 440,278 560,284 680,274 800,270 920,265"
                fill="none" stroke="#9caf8f" stroke-width="1.2" stroke-linejoin="round"/>

      <!-- Organic FOCAL area fill (subtle) -->
      <polygon points="80,230 200,206 320,186 440,164 560,175 680,138 800,111 920,88 920,420 80,420"
               fill="rgba(110,155,234,0.08)"/>

      <!-- Organic FOCAL line: [120,135,148,162,155,178,195,210] accent -->
      <polyline points="80,230 200,206 320,186 440,164 560,175 680,138 800,111 920,88"
                fill="none" stroke="#6e9bea" stroke-width="1.8" stroke-linejoin="round"/>

      <!-- Focal vertex dots -->
      <circle cx="80"  cy="230" r="4" fill="#6e9bea"/>
      <circle cx="200" cy="206" r="4" fill="#6e9bea"/>
      <circle cx="320" cy="186" r="4" fill="#6e9bea"/>
      <circle cx="440" cy="164" r="4" fill="#6e9bea"/>
      <circle cx="560" cy="175" r="4" fill="#6e9bea"/>
      <circle cx="680" cy="138" r="4" fill="#6e9bea"/>
      <circle cx="800" cy="111" r="4" fill="#6e9bea"/>
      <circle cx="920" cy="88"  r="4" fill="#6e9bea"/>

      <!-- X-axis labels -->
      <text x="80"  y="440" fill="#d4d2de" font-size="12" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="middle" font-weight="500">1주</text>
      <text x="200" y="440" fill="#d4d2de" font-size="12" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="middle" font-weight="500">2주</text>
      <text x="320" y="440" fill="#d4d2de" font-size="12" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="middle" font-weight="500">3주</text>
      <text x="440" y="440" fill="#d4d2de" font-size="12" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="middle" font-weight="500">4주</text>
      <text x="560" y="440" fill="#d4d2de" font-size="12" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="middle" font-weight="500">5주</text>
      <text x="680" y="440" fill="#d4d2de" font-size="12" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="middle" font-weight="500">6주</text>
      <text x="800" y="440" fill="#d4d2de" font-size="12" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="middle" font-weight="500">7주</text>
      <text x="920" y="440" fill="#d4d2de" font-size="12" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="middle" font-weight="500">8주</text>

      <!-- Legend -->
      <line x1="40" y1="462" x2="960" y2="462" stroke="rgba(246,245,250,0.10)" stroke-width="0.8"/>
      <text x="40" y="478" fill="#d4d2de" font-size="12" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" font-weight="500">범례</text>

      <line x1="40" y1="492" x2="64" y2="492" stroke="#6e9bea" stroke-width="1.8"/>
      <circle cx="52" cy="492" r="4" fill="#6e9bea"/>
      <text x="72" y="496" fill="#d4d2de" font-size="12" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" font-weight="500">검색 유입 · 초점</text>

      <line x1="200" y1="492" x2="224" y2="492" stroke="#9caf8f" stroke-width="1.2"/>
      <text x="232" y="496" fill="#d4d2de" font-size="12" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" font-weight="500">직접 유입</text>

      <line x1="316" y1="492" x2="340" y2="492" stroke="#82a0c0" stroke-width="1.2"/>
      <text x="348" y="496" fill="#d4d2de" font-size="12" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" font-weight="500">제휴 유입</text>
    </svg>
  </div>
</body>
</html>
