<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>1차년도 과제 일정 · 간트 차트</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --color-paper:#ffffff; --color-ink:#17152b; --color-muted:#68657b; --color-accent:#2f6fdb; --font-sans:'Geist', 'Pretendard', 'Noto Sans KR', system-ui,sans-serif; --font-serif:'Instrument Serif',serif; --font-mono:'Geist Mono',ui-monospace,monospace; }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 760px; display: block; }
    /* mega: Korean h1 is set in sans */
    h1 { font-family: var(--font-sans); font-weight: 700; letter-spacing: -0.03em; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Gantt · mega-diagram</p>
    <h1>1차년도 과제 일정 · 12주</h1>

    <!-- viewBox 0 0 1000 500. Timeline x=200-956 = 756px / 12 weeks = 63px per week -->
    <!-- Rows: label col x=20-196, timeline x=200-956 -->
    <!-- Row height=40, bar h=24, bar top pad=8 -->
    <!-- Week x = 200 + i*63, i=0..12 -->
    <svg viewBox="0 0 1000 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="gantt-title gantt-desc">
      <title id="gantt-title">1차년도 과제 일정 · 12주</title>
      <desc id="gantt-desc">과제 착수와 요구사항 분석부터 설계, 시제품 개발, 중간 보고, 본 개발, 시험·검증까지 1차년도 12주 과제 일정을 보여 주는 간트 차트.</desc>
      <defs>
        <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
          <circle cx="1" cy="1" r="0.9" fill="rgba(23,21,43,0.10)"/>
        </pattern>
      </defs>


      <!-- Phase zones (drawn before everything) -->
      <!-- Phase 1 DISCOVERY: rows y=84,124 → zone y=72, h=84 -->
      <rect x="12" y="72" width="976" height="84" rx="6" fill="rgba(23,21,43,0.02)" stroke="rgba(23,21,43,0.10)" stroke-width="0.8"/>
      <!-- Phase 2 DESIGN: rows y=184,224,264 → zone y=172, h=120 -->
      <rect x="12" y="172" width="976" height="120" rx="6" fill="rgba(23,21,43,0.02)" stroke="rgba(23,21,43,0.10)" stroke-width="0.8"/>
      <!-- Phase 3 LAUNCH: rows y=324,364 → zone y=312, h=88 -->
      <rect x="12" y="312" width="976" height="88" rx="6" fill="rgba(23,21,43,0.02)" stroke="rgba(23,21,43,0.10)" stroke-width="0.8"/>

      <!-- Month headers at y=40-56 -->
      <text x="326" y="52" fill="#17152b" font-size="12" font-weight="600" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="middle">4월</text>
      <text x="578" y="52" fill="#17152b" font-size="12" font-weight="600" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="middle">5월</text>
      <text x="830" y="52" fill="#17152b" font-size="12" font-weight="600" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="middle">6월</text>

      <!-- Month separator lines -->
      <line x1="452" y1="36" x2="452" y2="416" stroke="rgba(23,21,43,0.08)" stroke-width="0.8" stroke-dasharray="3,3"/>
      <line x1="704" y1="36" x2="704" y2="416" stroke="rgba(23,21,43,0.08)" stroke-width="0.8" stroke-dasharray="3,3"/>

      <!-- Week gridlines (vertical, hairline) -->
      <line x1="263" y1="60" x2="263" y2="416" stroke="rgba(23,21,43,0.05)" stroke-width="0.6"/>
      <line x1="326" y1="60" x2="326" y2="416" stroke="rgba(23,21,43,0.05)" stroke-width="0.6"/>
      <line x1="389" y1="60" x2="389" y2="416" stroke="rgba(23,21,43,0.05)" stroke-width="0.6"/>
      <line x1="515" y1="60" x2="515" y2="416" stroke="rgba(23,21,43,0.05)" stroke-width="0.6"/>
      <line x1="578" y1="60" x2="578" y2="416" stroke="rgba(23,21,43,0.05)" stroke-width="0.6"/>
      <line x1="641" y1="60" x2="641" y2="416" stroke="rgba(23,21,43,0.05)" stroke-width="0.6"/>
      <line x1="767" y1="60" x2="767" y2="416" stroke="rgba(23,21,43,0.05)" stroke-width="0.6"/>
      <line x1="830" y1="60" x2="830" y2="416" stroke="rgba(23,21,43,0.05)" stroke-width="0.6"/>
      <line x1="893" y1="60" x2="893" y2="416" stroke="rgba(23,21,43,0.05)" stroke-width="0.6"/>

      <!-- Timeline header line -->
      <line x1="200" y1="60" x2="956" y2="60" stroke="rgba(23,21,43,0.20)" stroke-width="0.8"/>
      <!-- Left divider -->
      <line x1="200" y1="36" x2="200" y2="416" stroke="rgba(23,21,43,0.20)" stroke-width="0.8"/>

      <!-- Phase labels (eyebrow style) -->
      <text x="20" y="88" fill="rgba(23,21,43,0.40)" font-size="12" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" font-weight="500">1단계 · 분석</text>
      <text x="20" y="188" fill="rgba(23,21,43,0.40)" font-size="12" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" font-weight="500">2단계 · 설계</text>
      <text x="20" y="328" fill="rgba(23,21,43,0.40)" font-size="12" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" font-weight="500">3단계 · 개발</text>

      <!-- ─── TASK BARS ─── -->
      <!-- W_x = 200 + week_index * 63 -->
      <!-- Row 1 y=84: Market research W1-W3 (i=0..2, x=200, dur=2*63=126) -->
      <rect x="20"  y="92" width="176" height="24" fill="#ffffff"/>
      <text x="20"  y="108" fill="#17152b" font-size="12" font-weight="600" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">과제 착수</text>
      <rect x="200" y="92" width="126" height="24" rx="4" fill="#ffffff"/>
      <rect x="200" y="92" width="126" height="24" rx="4" fill="rgba(104,101,123,0.15)" stroke="#68657b" stroke-width="1"/>

      <!-- Row 2 y=124: User interviews W2-W4 (i=1..3, x=263, dur=2*63=126) -->
      <rect x="20"  y="132" width="176" height="24" fill="#ffffff"/>
      <text x="20"  y="148" fill="#17152b" font-size="12" font-weight="600" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">요구사항 분석</text>
      <rect x="263" y="132" width="126" height="24" rx="4" fill="#ffffff"/>
      <rect x="263" y="132" width="126" height="24" rx="4" fill="rgba(104,101,123,0.15)" stroke="#68657b" stroke-width="1"/>

      <!-- Row 3 y=184: Wireframes W4-W6 (i=3..5, x=389, dur=2*63=126) -->
      <rect x="20"  y="192" width="176" height="24" fill="#ffffff"/>
      <text x="20"  y="208" fill="#17152b" font-size="12" font-weight="600" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">기본 설계</text>
      <rect x="389" y="192" width="126" height="24" rx="4" fill="#ffffff"/>
      <rect x="389" y="192" width="126" height="24" rx="4" fill="rgba(104,101,123,0.15)" stroke="#68657b" stroke-width="1"/>

      <!-- Row 4 y=224: Prototype W5-W8 (i=4..7, x=452, dur=3*63=189) -->
      <rect x="20"  y="232" width="176" height="24" fill="#ffffff"/>
      <text x="20"  y="248" fill="#17152b" font-size="12" font-weight="600" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">시제품 개발</text>
      <rect x="452" y="232" width="189" height="24" rx="4" fill="#ffffff"/>
      <rect x="452" y="232" width="189" height="24" rx="4" fill="rgba(104,101,123,0.15)" stroke="#68657b" stroke-width="1"/>

      <!-- Row 5 y=264 FOCAL: Design review W8-W9 (i=7..8, x=641, dur=63) -->
      <rect x="20"  y="272" width="176" height="24" fill="#ffffff"/>
      <text x="20"  y="288" fill="#2f6fdb" font-size="12" font-weight="600" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">중간 보고</text>
      <rect x="641" y="272" width="63" height="24" rx="4" fill="#ffffff"/>
      <rect x="641" y="272" width="63" height="24" rx="4" fill="rgba(47,111,219,0.12)" stroke="#2f6fdb" stroke-width="1"/>
      <text x="672" y="288" fill="#2f6fdb" font-size="12" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="middle" font-weight="500">점검</text>

      <!-- Row 6 y=324: Development W7-W11 (i=6..10, x=578, dur=4*63=252) -->
      <rect x="20"  y="332" width="176" height="24" fill="#ffffff"/>
      <text x="20"  y="348" fill="#17152b" font-size="12" font-weight="600" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">본 개발</text>
      <rect x="578" y="332" width="252" height="24" rx="4" fill="#ffffff"/>
      <rect x="578" y="332" width="252" height="24" rx="4" fill="rgba(104,101,123,0.15)" stroke="#68657b" stroke-width="1"/>

      <!-- Row 7 y=364: Beta testing W10-W12 (i=9..11, x=767, dur=2*63=126) -->
      <rect x="20"  y="372" width="176" height="24" fill="#ffffff"/>
      <text x="20"  y="388" fill="#17152b" font-size="12" font-weight="600" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">시험·검증</text>
      <rect x="767" y="372" width="126" height="24" rx="4" fill="#ffffff"/>
      <rect x="767" y="372" width="126" height="24" rx="4" fill="rgba(104,101,123,0.15)" stroke="#68657b" stroke-width="1"/>

      <!-- Legend -->
      <line x1="40" y1="430" x2="960" y2="430" stroke="rgba(23,21,43,0.10)" stroke-width="0.8"/>
      <text x="40" y="446" fill="#68657b" font-size="12" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" font-weight="500">범례</text>

      <rect x="40" y="456" width="20" height="12" rx="3" fill="rgba(47,111,219,0.12)" stroke="#2f6fdb" stroke-width="1"/>
      <text x="68" y="466" fill="#68657b" font-size="12" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" font-weight="500">중간 보고 · 핵심 관문</text>

      <rect x="280" y="456" width="20" height="12" rx="3" fill="rgba(104,101,123,0.15)" stroke="#68657b" stroke-width="1"/>
      <text x="308" y="466" fill="#68657b" font-size="12" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" font-weight="500">과업</text>

      <rect x="368" y="456" width="20" height="12" rx="3" fill="rgba(23,21,43,0.02)" stroke="rgba(23,21,43,0.10)" stroke-width="0.8"/>
      <text x="396" y="466" fill="#68657b" font-size="12" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" font-weight="500">단계</text>
    </svg>
  </div>
</body>
</html>
