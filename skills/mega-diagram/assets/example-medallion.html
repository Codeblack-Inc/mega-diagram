<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>대중교통 데이터 분석 · 메달리온</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --paper: #ffffff; --paper-2: #f6f5fa; --ink: #17152b; --muted: #68657b;
      --soft: #8a879c; --rule: rgba(23,21,43,0.12); --accent: #2f6fdb;
      --accent-tint: rgba(47,111,219,0.08); --link: #6043d5;
      --sans: 'Geist', 'Pretendard', 'Noto Sans KR', system-ui, sans-serif; --serif: 'Instrument Serif', serif;
      --mono: 'Geist Mono', ui-monospace, monospace;
    }
    body { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; background: var(--paper); color: var(--ink); font-family: var(--sans); }
    .frame { width: 100%; max-width: 1200px; }
    .eyebrow { margin-bottom: 0.5rem; color: var(--muted); font: 500 0.66rem var(--mono); letter-spacing: 0.18em; text-transform: uppercase; }
    h1 { margin-bottom: 1.5rem; color: var(--ink); font: 700 clamp(1.5rem, 2.4vw + 0.75rem, 2rem)/1.15 var(--sans); letter-spacing: -0.03em; }
    svg { display: block; width: 100%; min-width: 1040px; }
    .tier-title { fill: var(--ink); font: 600 13px var(--sans); text-anchor: middle; }
    .bucket, .field-value { fill: var(--muted); font: 400 9px var(--mono); }
    .example-value { fill: var(--muted); font: 400 12px var(--sans); }
    .bucket { text-anchor: middle; }
    .field-value { color: var(--muted); }
    .focal-text { fill: var(--accent); }
    .field-label { fill: var(--ink); font: 600 12px var(--sans); }
    .field-value.ko { font: 500 12px var(--sans); }
    .path-tag { font-family: var(--mono); font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; }
    .example-label, .arc-label { font: 500 12px var(--sans); }
    .example-label { fill: var(--soft); }
    .arc-label { text-anchor: middle; }
    .path-title { fill: var(--ink); font: 600 12px var(--sans); }
    .path-sub { fill: var(--muted); font: 400 12px var(--sans); }
  </style>
</head>
<body>
  <main class="frame">
    <p class="eyebrow">Medallion · mega-diagram</p>
    <h1>대중교통 이용 데이터 5단계 저장 구조</h1>

    <svg viewBox="0 0 1040 548" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="medallion-title medallion-desc">
      <title id="medallion-title">대중교통 이용 데이터 메달리온 구조</title>
      <desc id="medallion-desc">교통카드 승하차 기록과 충전 거래가 원천, 비식별, 정제, 집계 단계를 거쳐 보관 단계로 이관되는 5단계 저장 구조.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#68657b"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2f6fdb"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#6043d5"/></marker>
        <clipPath id="clip-raw"><rect x="16" y="80" width="172" height="380" rx="6"/></clipPath>
        <clipPath id="clip-anon"><rect x="204" y="80" width="172" height="380" rx="6"/></clipPath>
        <clipPath id="clip-stage"><rect x="392" y="80" width="172" height="380" rx="6"/></clipPath>
        <clipPath id="clip-aggregate"><rect x="580" y="80" width="172" height="380" rx="6"/></clipPath>
        <clipPath id="clip-archive"><rect x="768" y="80" width="172" height="380" rx="6"/></clipPath>
      </defs>

      <!-- Promotion arcs are the medallion type's required connector grammar. -->
      <path d="M102 80 C102 0 290 0 290 80" fill="none" stroke="#68657b" stroke-width="1.4" marker-end="url(#arrow)"/>
      <path d="M290 80 C290 0 478 0 478 80" fill="none" stroke="#68657b" stroke-width="1.4" marker-end="url(#arrow)"/>
      <path d="M478 80 C478 0 666 0 666 80" fill="none" stroke="#2f6fdb" stroke-width="1.6" marker-end="url(#arrow-accent)"/>
      <path d="M666 80 C666 0 854 0 854 80" fill="none" stroke="#68657b" stroke-width="1.4" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <text x="196" y="50" class="arc-label" fill="#68657b" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">가명 처리</text>
      <text x="384" y="50" class="arc-label" fill="#68657b" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">정제·결합</text>
      <text x="572" y="50" class="arc-label" fill="#2f6fdb" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">지표 집계</text>
      <text x="760" y="50" class="arc-label" fill="#68657b" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">보관 이관</text>

      <!-- Raw -->
      <rect x="16" y="80" width="172" height="380" rx="6" fill="#fff"/>
      <rect x="16" y="80" width="172" height="50" fill="rgba(104,101,123,0.10)" clip-path="url(#clip-raw)"/>
      <rect x="16" y="80" width="172" height="380" rx="6" fill="none" stroke="#68657b"/>
      <text x="102" y="106" class="tier-title" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">원천</text>
      <text x="102" y="144" class="bucket">raw-transit</text>
      <text x="32" y="180" class="field-label" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">도구</text>
      <foreignObject x="32" y="186" width="140" height="24"><div xmlns="http://www.w3.org/1999/xhtml" class="field-value" style="line-height:1.25">NiFi ingest</div></foreignObject>
      <text x="32" y="220" class="field-label" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">형식</text>
      <foreignObject x="32" y="226" width="140" height="24"><div xmlns="http://www.w3.org/1999/xhtml" class="field-value" style="line-height:1.25">JSON · Parquet</div></foreignObject>
      <text x="32" y="260" class="field-label" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">담당</text>
      <foreignObject x="32" y="266" width="140" height="24"><div xmlns="http://www.w3.org/1999/xhtml" class="field-value ko" style="line-height:1.25">데이터 엔지니어</div></foreignObject>
      <text x="32" y="360" class="example-label" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">교통카드 예시</text>
      <text x="32" y="380" class="example-value" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">승하차 태깅 기록</text>
      <text x="32" y="398" class="example-value" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">카드 충전 거래</text>

      <!-- Anonymized -->
      <rect x="204" y="80" width="172" height="380" rx="6" fill="#fff"/>
      <rect x="204" y="80" width="172" height="50" fill="rgba(23,21,43,0.06)" clip-path="url(#clip-anon)"/>
      <rect x="204" y="80" width="172" height="380" rx="6" fill="none" stroke="#17152b"/>
      <text x="290" y="106" class="tier-title" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">비식별</text>
      <text x="290" y="144" class="bucket">anon-transit</text>
      <text x="220" y="180" class="field-label" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">도구</text>
      <foreignObject x="220" y="186" width="140" height="24"><div xmlns="http://www.w3.org/1999/xhtml" class="field-value" style="line-height:1.25">Trino SQL</div></foreignObject>
      <text x="220" y="220" class="field-label" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">형식</text>
      <foreignObject x="220" y="226" width="140" height="24"><div xmlns="http://www.w3.org/1999/xhtml" class="field-value" style="line-height:1.25">Iceberg · partitioned</div></foreignObject>
      <text x="220" y="260" class="field-label" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">담당</text>
      <foreignObject x="220" y="266" width="140" height="24"><div xmlns="http://www.w3.org/1999/xhtml" class="field-value ko" style="line-height:1.25">데이터 엔지니어</div></foreignObject>
      <text x="220" y="360" class="example-label" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">교통카드 예시</text>
      <text x="220" y="380" class="example-value" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">가명 카드번호</text>
      <text x="220" y="398" class="example-value" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">익명 이용자 ID</text>

      <!-- Staging -->
      <rect x="392" y="80" width="172" height="380" rx="6" fill="#fff"/>
      <rect x="392" y="80" width="172" height="50" fill="rgba(23,21,43,0.06)" clip-path="url(#clip-stage)"/>
      <rect x="392" y="80" width="172" height="380" rx="6" fill="none" stroke="#17152b"/>
      <text x="478" y="106" class="tier-title" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">정제</text>
      <text x="478" y="144" class="bucket">staging-transit</text>
      <text x="408" y="180" class="field-label" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">도구</text>
      <foreignObject x="408" y="186" width="140" height="24"><div xmlns="http://www.w3.org/1999/xhtml" class="field-value" style="line-height:1.25">Trino · notebooks</div></foreignObject>
      <text x="408" y="220" class="field-label" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">형식</text>
      <foreignObject x="408" y="226" width="140" height="24"><div xmlns="http://www.w3.org/1999/xhtml" class="field-value" style="line-height:1.25">Iceberg · cleaned</div></foreignObject>
      <text x="408" y="260" class="field-label" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">담당</text>
      <foreignObject x="408" y="266" width="140" height="24"><div xmlns="http://www.w3.org/1999/xhtml" class="field-value ko" style="line-height:1.25">데이터 분석가</div></foreignObject>
      <text x="408" y="360" class="example-label" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">교통카드 예시</text>
      <text x="408" y="380" class="example-value" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">통행 경로 결합</text>
      <text x="408" y="398" class="example-value" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">검증된 거래 행</text>

      <!-- Aggregated focal tier -->
      <rect x="580" y="80" width="172" height="380" rx="6" fill="rgba(47,111,219,0.07)"/>
      <rect x="580" y="80" width="172" height="50" fill="rgba(47,111,219,0.14)" clip-path="url(#clip-aggregate)"/>
      <rect x="580" y="80" width="172" height="380" rx="6" fill="none" stroke="#2f6fdb" stroke-width="1.6"/>
      <text x="666" y="106" class="tier-title" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">집계</text>
      <text x="666" y="144" class="bucket focal-text">analytics-marts</text>
      <text x="596" y="180" class="field-label" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">도구</text>
      <foreignObject x="596" y="186" width="140" height="24"><div xmlns="http://www.w3.org/1999/xhtml" class="field-value" style="line-height:1.25">Trino INSERT</div></foreignObject>
      <text x="596" y="220" class="field-label" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">형식</text>
      <foreignObject x="596" y="226" width="140" height="24"><div xmlns="http://www.w3.org/1999/xhtml" class="field-value" style="line-height:1.25">Iceberg · metrics</div></foreignObject>
      <text x="596" y="260" class="field-label" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">담당</text>
      <foreignObject x="596" y="266" width="140" height="24"><div xmlns="http://www.w3.org/1999/xhtml" class="field-value ko" style="line-height:1.25">데이터 분석가</div></foreignObject>
      <text x="596" y="360" class="example-label" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">교통카드 예시</text>
      <text x="596" y="380" class="example-value focal-text" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">정류장별 일 승차량</text>
      <text x="596" y="398" class="example-value focal-text" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">노선별 이용 추이</text>

      <!-- Archive -->
      <rect x="768" y="80" width="172" height="380" rx="6" fill="#f6f5fa"/>
      <rect x="768" y="80" width="172" height="50" fill="rgba(104,101,123,0.18)" clip-path="url(#clip-archive)"/>
      <rect x="768" y="80" width="172" height="380" rx="6" fill="none" stroke="#68657b" stroke-dasharray="5,3"/>
      <text x="854" y="106" class="tier-title" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">보관</text>
      <text x="854" y="144" class="bucket">archive-transit</text>
      <text x="784" y="180" class="field-label" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">도구</text>
      <foreignObject x="784" y="186" width="140" height="24"><div xmlns="http://www.w3.org/1999/xhtml" class="field-value" style="line-height:1.25">Object storage lifecycle</div></foreignObject>
      <text x="784" y="220" class="field-label" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">형식</text>
      <foreignObject x="784" y="226" width="140" height="24"><div xmlns="http://www.w3.org/1999/xhtml" class="field-value" style="line-height:1.25">Cold tier · immutable</div></foreignObject>
      <text x="784" y="260" class="field-label" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">담당</text>
      <foreignObject x="784" y="266" width="140" height="24"><div xmlns="http://www.w3.org/1999/xhtml" class="field-value ko" style="line-height:1.25">데이터 엔지니어</div></foreignObject>
      <text x="784" y="360" class="example-label" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">교통카드 예시</text>
      <text x="784" y="380" class="example-value" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">보존 태깅 기록</text>
      <text x="784" y="398" class="example-value" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">마감 정산 스냅숏</text>

      <!-- Write-method paths -->
      <rect x="16" y="476" width="460" height="56" rx="6" fill="#fff" stroke="rgba(23,21,43,0.20)"/>
      <rect x="24" y="482" width="64" height="12" rx="2" fill="none" stroke="rgba(23,21,43,0.30)" stroke-width="0.8"/>
      <text x="56" y="491" class="path-tag" fill="#17152b" font-size="7" text-anchor="middle">SQL PATH</text>
      <text x="96" y="506" class="path-title">Trino INSERT INTO … SELECT</text>
      <text x="96" y="524" class="path-sub" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">필터·결합·집계 — 반복 가능한 변환</text>
      <rect x="492" y="476" width="460" height="56" rx="6" fill="#fff" stroke="rgba(23,21,43,0.20)"/>
      <rect x="500" y="482" width="96" height="12" rx="2" fill="none" stroke="rgba(23,21,43,0.30)" stroke-width="0.8"/>
      <text x="548" y="491" class="path-tag" fill="#17152b" font-size="7" text-anchor="middle">NOTEBOOK PATH</text>
      <text x="604" y="506" class="path-title" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">오브젝트 스토리지 기반 Python 노트북</text>
      <text x="604" y="524" class="path-sub" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">탐색·검증·모델링 — 대화형 분석</text>
    </svg>
  </main>
</body>
</html>
