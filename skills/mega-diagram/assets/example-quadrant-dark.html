<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>디지털 행정 과제 · 영향도 × 난이도</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #17152b;
      --color-ink:     #f6f5fa;
      --color-muted:   #d4d2de;
      --color-accent:  #6e9bea;
      --font-sans:     'Geist', 'Pretendard', 'Noto Sans KR', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
    /* mega: Korean h1 is set in sans */
    h1 { font-family: var(--font-sans); font-weight: 700; letter-spacing: -0.03em; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Quadrant · mega-diagram</p>
    <h1>디지털 행정 과제 · 영향도 × 난이도</h1>

    <svg viewBox="0 0 1000 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="quadrant-dark-title quadrant-dark-desc">
      <title id="quadrant-dark-title">디지털 행정 과제 · 영향도 × 난이도</title>
      <desc id="quadrant-dark-desc">디지털 행정 과제 8건을 영향도와 난이도에 따라 우선 추진, 중장기 과제, 즉시 개선, 보류 네 영역에 배치한 매트릭스.</desc>
        <defs>
          <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r="0.9" fill="rgba(246,245,250,0.10)"/>
          </pattern>
        </defs>


        <!-- Quadrant backgrounds (very subtle, only coral on DO FIRST) -->
        <rect x="120" y="80" width="380" height="170" fill="rgba(110,155,234,0.03)"/>

        <!-- Axis cross -->
        <line x1="120" y1="250" x2="880" y2="250" stroke="rgba(246,245,250,0.45)" stroke-width="1"/>
        <line x1="500" y1="80" x2="500" y2="420" stroke="rgba(246,245,250,0.45)" stroke-width="1"/>

        <!-- Axis end labels -->
        <text x="880" y="270" fill="#d4d2de" font-size="12" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="end" font-weight="500">난이도 높음</text>
        <text x="120" y="270" fill="#d4d2de" font-size="12" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" font-weight="500">난이도 낮음</text>
        <text x="512" y="80" fill="#d4d2de" font-size="12" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" font-weight="500">영향도 높음</text>
        <text x="512" y="436" fill="#d4d2de" font-size="12" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" font-weight="500">영향도 낮음</text>

        <!-- Quadrant corner labels -->
        <text x="140" y="104" fill="#6e9bea" font-size="12" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" font-weight="600">우선 추진</text>
        <text x="860" y="104" fill="#d4d2de" font-size="12" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="end" font-weight="500">중장기 과제</text>
        <text x="140" y="412" fill="#d4d2de" font-size="12" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" font-weight="500">즉시 개선</text>
        <text x="860" y="412" fill="#d4d2de" font-size="12" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" text-anchor="end" font-weight="500">보류</text>

        <!-- Items: TL (Do First) -->
        <!-- coral focal -->
        <circle cx="220" cy="140" r="6" fill="#6e9bea"/>
        <text x="232" y="144" fill="#f6f5fa" font-size="12" font-weight="600" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif">민원 챗봇 고도화</text>

        <circle cx="320" cy="200" r="4" fill="#f6f5fa"/>
        <text x="332" y="204" fill="#d4d2de" font-size="12" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" font-weight="500">공지 게시판 정비</text>

        <!-- Items: TR (Major Projects) -->
        <circle cx="620" cy="140" r="4" fill="#f6f5fa"/>
        <text x="632" y="144" fill="#d4d2de" font-size="12" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" font-weight="500">행정 포털 개편</text>

        <circle cx="760" cy="180" r="4" fill="#f6f5fa"/>
        <text x="772" y="184" fill="#d4d2de" font-size="12" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" font-weight="500">공공데이터 개방</text>

        <!-- Items: BL (Quick Wins) -->
        <circle cx="260" cy="320" r="4" fill="#f6f5fa"/>
        <text x="272" y="324" fill="#d4d2de" font-size="12" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" font-weight="500">서식 링크 수정</text>

        <circle cx="360" cy="380" r="4" fill="#f6f5fa"/>
        <text x="372" y="384" fill="#d4d2de" font-size="12" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" font-weight="500">안내 문구 정비</text>

        <!-- Items: BR (Avoid) -->
        <circle cx="640" cy="380" r="4" fill="#f6f5fa"/>
        <text x="652" y="384" fill="#d4d2de" font-size="12" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" font-weight="500">레거시 전면 재구축</text>

        <circle cx="780" cy="320" r="4" fill="#f6f5fa"/>
        <text x="792" y="324" fill="#d4d2de" font-size="12" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" font-weight="500">자체 메신저 개발</text>

        <!-- Legend -->
        <line x1="40" y1="456" x2="960" y2="456" stroke="rgba(246,245,250,0.10)" stroke-width="0.8"/>
        <text x="40" y="472" fill="#d4d2de" font-size="12" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" font-weight="500">범례</text>

        <circle cx="52" cy="488" r="6" fill="#6e9bea"/>
        <text x="68" y="492" fill="#d4d2de" font-size="12" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" font-weight="500">즉시 착수</text>

        <circle cx="192" cy="488" r="4" fill="#f6f5fa"/>
        <text x="208" y="492" fill="#d4d2de" font-size="12" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" font-weight="500">후보 과제</text>

        <text x="336" y="492" fill="#d4d2de" font-size="12" font-family="'Geist', 'Pretendard', 'Noto Sans KR', sans-serif" font-weight="500">위치가 판단 근거이고, 색은 착수할 과제 하나에만 쓴다.</text>
      </svg>
  </div>
</body>
</html>
